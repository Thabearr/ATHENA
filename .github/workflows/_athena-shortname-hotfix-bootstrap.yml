name: ATHENA reviewed shortName compatibility bootstrap

on:
  push:
    branches:
      - fix/fresh-holdout-shortname-compatibility

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify authoritative base
        shell: bash
        run: |
          git pull --ff-only && git fetch origin main
          test "$(git rev-parse origin/main)" = "c4839977bd64d17ed0e01e44ef95ca320a29e4b0"
          test "$(git merge-base HEAD origin/main)" = "c4839977bd64d17ed0e01e44ef95ca320a29e4b0"

      - name: Install test dependency
        shell: bash
        run: git pull --ff-only && python -m pip install -q pytest

      - name: Apply bounded reviewed shortName compatibility
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          from pathlib import Path

          capture_path = Path('domain/fotmob_fresh_holdout_capture_qualification_adapter.py')
          settlement_path = Path('domain/fotmob_fresh_holdout_ordinary_ft_settlement_schema_adapter.py')
          tick_path = Path('scripts/run_fotmob_utc_native_xg_fresh_holdout_tick.py')
          duplicate_test_path = Path('tests/test_fotmob_fresh_holdout_duplicate_group_wrapper.py')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              return text.replace(old, new, 1)

          def git_blob_sha(path: Path) -> str:
              raw = path.read_bytes()
              return hashlib.sha1(b'blob ' + str(len(raw)).encode('ascii') + b'\0' + raw).hexdigest()

          capture = capture_path.read_text(encoding='utf-8')
          capture = replace_once(capture, 'ADAPTER_ID = "FOTMOB_FRESH_HOLDOUT_REVIEWED_SCHEMA_ADAPTER_V2"', 'ADAPTER_ID = "FOTMOB_FRESH_HOLDOUT_REVIEWED_SCHEMA_ADAPTER_V3"', 'capture adapter id')
          capture = replace_once(
              capture,
              'EXTRA_HALFS_RULE = (\n    "OPTIONAL_EXACT_STRING_NULL_FORBIDDEN_OPAQUE_NO_EXTRA_TIME_SEMANTICS"\n)\nREQUEST_BUCKET_SPILLOVER_RULE = (',
              'EXTRA_HALFS_RULE = (\n    "OPTIONAL_EXACT_STRING_NULL_FORBIDDEN_OPAQUE_NO_EXTRA_TIME_SEMANTICS"\n)\nTEAM_SHORTNAME_KEY = "shortName"\nTEAM_SHORTNAME_RULE = (\n    "OPTIONAL_MATCH_TEAM_SHORTNAME_EXACT_STRING_NULL_FORBIDDEN_OPAQUE_"\n    "VALIDATION_PROJECTION_ONLY"\n)\nTEAM_SHORTNAME_SOURCE_WORKFLOW_RUN_ID = 34426288968\nTEAM_SHORTNAME_SOURCE_ACTIONS_ARTIFACT_ID = 10132954816\nTEAM_SHORTNAME_SOURCE_ACTIONS_ARTIFACT_NAME = (\n    "failure-20260910T013700Z-run-34426288968.tar.gz"\n)\nTEAM_SHORTNAME_SOURCE_ACTIONS_ARTIFACT_SHA256 = (\n    "ad44afa394d5fc9be03132af069acf018566cc8eebcee932d518f9fb15b4ab7e"\n)\nTEAM_SHORTNAME_SOURCE_CAPTURE_LINEAGES = (\n    {\n        "request_date": "20260909",\n        "observed_at": "2026-09-10T01:46:14.724321Z",\n        "manifest_sha256": "308898f47d5a6f8e292d247ff661c4b3e71ebb4b0349b13435a59b6ac91c6cf4",\n        "raw_sha256": "6884f67152db749c9f69dc74119d6bed475971d3cb9d27ceb65d1e4ee5d69ccb",\n    },\n    {\n        "request_date": "20260910",\n        "observed_at": "2026-09-10T01:46:15.042980Z",\n        "manifest_sha256": "0aa3be5dc0f8fe3c8922d40d3a2a277ce3df377bc4fc6fdd1c1b34c2f2af710a",\n        "raw_sha256": "3492eab523b2a9e330f7fadb61b25ad21595242f86d6b1173fa2a3547fe2ca1f",\n    },\n    {\n        "request_date": "20260911",\n        "observed_at": "2026-09-10T01:46:15.396251Z",\n        "manifest_sha256": "82149cd522c5146d9158382caa8edb03b8dac3a966d3df799cae3833292a0cf4",\n        "raw_sha256": "1e2029c8e6878e6ec40b414d046ef3e817c69e4f64659363ce5b8de8e6d9a51a",\n    },\n)\nREQUEST_BUCKET_SPILLOVER_RULE = (',
              'team shortName constants',
          )
          capture = replace_once(capture, '    "extra_time_semantics_promoted",\n    "request_bucket_semantics_promoted",', '    "extra_time_semantics_promoted",\n    "team_shortname_semantics_promoted",\n    "request_bucket_semantics_promoted",', 'shortName safety key')
          helper = (
              'def _remove_reviewed_team_short_names(payload: dict[str, Any]) -> dict[str, Any]:\n'
              '    """Remove reviewed opaque team shortName only from a validation copy."""\n'
              '    projected = copy.deepcopy(payload)\n'
              '    leagues = projected.get("leagues")\n'
              '    if type(leagues) is not list:\n'
              '        return projected\n'
              '    for league_index, league in enumerate(leagues):\n'
              '        if type(league) is not dict:\n'
              '            continue\n'
              '        matches = league.get("matches")\n'
              '        if type(matches) is not list:\n'
              '            continue\n'
              '        for match_index, match in enumerate(matches):\n'
              '            if type(match) is not dict:\n'
              '                continue\n'
              '            for side in ("home", "away"):\n'
              '                team = match.get(side)\n'
              '                if type(team) is not dict or TEAM_SHORTNAME_KEY not in team:\n'
              '                    continue\n'
              '                if type(team[TEAM_SHORTNAME_KEY]) is not str:\n'
              '                    raise _error(\n'
              '                        f"leagues[{league_index}].matches[{match_index}]."\n'
              '                        f"{side}.{TEAM_SHORTNAME_KEY} must be an exact string"\n'
              '                    )\n'
              '                del team[TEAM_SHORTNAME_KEY]\n'
              '    return projected\n\n\n'
          )
          capture = replace_once(capture, 'def _remove_reviewed_extra_halfs(payload: dict[str, Any]) -> dict[str, Any]:\n', helper + 'def _remove_reviewed_extra_halfs(payload: dict[str, Any]) -> dict[str, Any]:\n', 'shortName helper')
          capture = replace_once(capture, '    pr89_payload = _remove_reviewed_extra_halfs(payload)\n', '    pr89_payload = _remove_reviewed_team_short_names(payload)\n    pr89_payload = _remove_reviewed_extra_halfs(pr89_payload)\n', 'shortName projection order')
          capture = replace_once(capture, '        "reviewed_extra_halfs_rule": EXTRA_HALFS_RULE,\n        "reviewed_request_bucket_spillover_rule": REQUEST_BUCKET_SPILLOVER_RULE,', '        "reviewed_extra_halfs_rule": EXTRA_HALFS_RULE,\n        "reviewed_team_shortname_key": TEAM_SHORTNAME_KEY,\n        "reviewed_team_shortname_rule": TEAM_SHORTNAME_RULE,\n        "team_shortname_source_workflow_run_id": TEAM_SHORTNAME_SOURCE_WORKFLOW_RUN_ID,\n        "team_shortname_source_actions_artifact_id": TEAM_SHORTNAME_SOURCE_ACTIONS_ARTIFACT_ID,\n        "team_shortname_source_actions_artifact_name": TEAM_SHORTNAME_SOURCE_ACTIONS_ARTIFACT_NAME,\n        "team_shortname_source_actions_artifact_sha256": TEAM_SHORTNAME_SOURCE_ACTIONS_ARTIFACT_SHA256,\n        "team_shortname_source_capture_lineages": [dict(item) for item in TEAM_SHORTNAME_SOURCE_CAPTURE_LINEAGES],\n        "reviewed_request_bucket_spillover_rule": REQUEST_BUCKET_SPILLOVER_RULE,', 'shortName receipt')
          capture = replace_once(capture, '        "compatibility_projection_is_not_source_evidence": True,\n        "network_acquisition_performed": False,', '        "compatibility_projection_is_not_source_evidence": True,\n        "team_shortname_projection_is_validation_only": True,\n        "team_shortname_has_no_identity_or_football_semantics": True,\n        "network_acquisition_performed": False,', 'shortName receipt semantics')
          capture = replace_once(capture, '    "EXTRA_HALFS_RULE",\n    "FreshHoldoutCaptureQualificationAdapterError",', '    "EXTRA_HALFS_RULE",\n    "TEAM_SHORTNAME_KEY",\n    "TEAM_SHORTNAME_RULE",\n    "TEAM_SHORTNAME_SOURCE_ACTIONS_ARTIFACT_ID",\n    "TEAM_SHORTNAME_SOURCE_ACTIONS_ARTIFACT_NAME",\n    "TEAM_SHORTNAME_SOURCE_ACTIONS_ARTIFACT_SHA256",\n    "TEAM_SHORTNAME_SOURCE_CAPTURE_LINEAGES",\n    "TEAM_SHORTNAME_SOURCE_WORKFLOW_RUN_ID",\n    "FreshHoldoutCaptureQualificationAdapterError",', 'shortName exports')
          capture_path.write_text(capture, encoding='utf-8')
          capture_blob = git_blob_sha(capture_path)

          settlement = settlement_path.read_text(encoding='utf-8')
          settlement = replace_once(settlement, 'LIVE_CAPTURE_ADAPTER_BLOB_SHA = "6fb36b3ced7f9879984128033473fee7721428f6"', f'LIVE_CAPTURE_ADAPTER_BLOB_SHA = "{capture_blob}"', 'settlement live pin')
          settlement = replace_once(settlement, 'EXTRA_HALFS_RULE = "OPTIONAL_EXACT_STRING_NULL_FORBIDDEN_OPAQUE_NO_EXTRA_TIME_SEMANTICS"\n', 'EXTRA_HALFS_RULE = "OPTIONAL_EXACT_STRING_NULL_FORBIDDEN_OPAQUE_NO_EXTRA_TIME_SEMANTICS"\nTEAM_SHORTNAME_RULE = (\n    "OPTIONAL_MATCH_TEAM_SHORTNAME_EXACT_STRING_NULL_FORBIDDEN_OPAQUE_"\n    "VALIDATION_PROJECTION_ONLY"\n)\n', 'settlement shortName rule')
          settlement = replace_once(settlement, '    if not isinstance(live_capture_adapter.REQUEST_BUCKET_SPILLOVER_RULE, str):\n        raise _error("reviewed request-bucket spillover rule changed")\n', '    if live_capture_adapter.TEAM_SHORTNAME_RULE != TEAM_SHORTNAME_RULE:\n        raise _error("reviewed team shortName rule changed")\n    if not isinstance(live_capture_adapter.REQUEST_BUCKET_SPILLOVER_RULE, str):\n        raise _error("reviewed request-bucket spillover rule changed")\n', 'settlement dependency rule')
          settlement = replace_once(settlement, '    projected_payload = _remove_reviewed_extra_halfs(requested_payload)\n', '    try:\n        projected_payload = live_capture_adapter._remove_reviewed_team_short_names(requested_payload)\n    except Exception as exc:\n        raise _error("reviewed team shortName settlement projection failed") from exc\n    projected_payload = _remove_reviewed_extra_halfs(projected_payload)\n', 'settlement shortName projection')
          settlement = replace_once(settlement, '        "reviewed_extra_halfs_rule": EXTRA_HALFS_RULE,\n        "reviewed_request_bucket_spillover_rule": live_capture_adapter.REQUEST_BUCKET_SPILLOVER_RULE,', '        "reviewed_extra_halfs_rule": EXTRA_HALFS_RULE,\n        "reviewed_team_shortname_rule": TEAM_SHORTNAME_RULE,\n        "reviewed_request_bucket_spillover_rule": live_capture_adapter.REQUEST_BUCKET_SPILLOVER_RULE,', 'settlement receipt')
          settlement = replace_once(settlement, '    "EXTRA_HALFS_RULE",\n    "FreshHoldoutOrdinaryFtSettlementSchemaAdapterError",', '    "EXTRA_HALFS_RULE",\n    "TEAM_SHORTNAME_RULE",\n    "FreshHoldoutOrdinaryFtSettlementSchemaAdapterError",', 'settlement exports')
          settlement_path.write_text(settlement, encoding='utf-8')
          settlement_blob = git_blob_sha(settlement_path)

          tick = tick_path.read_text(encoding='utf-8')
          tick = replace_once(tick, 'LIVE_CAPTURE_IDENTITY_ADAPTER_BLOB_SHA = "6fb36b3ced7f9879984128033473fee7721428f6"', f'LIVE_CAPTURE_IDENTITY_ADAPTER_BLOB_SHA = "{capture_blob}"', 'tick live pin')
          tick = replace_once(tick, 'SETTLEMENT_SCHEMA_ADAPTER_BLOB_SHA = "e5bc1f1581913fcebfb989eb6aeb3ab6485282ed"', f'SETTLEMENT_SCHEMA_ADAPTER_BLOB_SHA = "{settlement_blob}"', 'tick settlement pin')
          if 'ACTIVATION_RUNNER_BLOB_SHA = "901ab137d6601a3485eac30da7e6bad7eeefa397"' not in tick:
              raise SystemExit('activation runner pin drifted unexpectedly')
          tick_path.write_text(tick, encoding='utf-8')

          duplicate_test = duplicate_test_path.read_text(encoding='utf-8')
          duplicate_test = replace_once(duplicate_test, 'assert receipt["adapter_id"] == "FOTMOB_FRESH_HOLDOUT_REVIEWED_SCHEMA_ADAPTER_V2"', 'assert receipt["adapter_id"] == "FOTMOB_FRESH_HOLDOUT_REVIEWED_SCHEMA_ADAPTER_V3"', 'duplicate wrapper adapter id')
          duplicate_test_path.write_text(duplicate_test, encoding='utf-8')

          print(f'capture_blob={capture_blob}')
          print(f'settlement_blob={settlement_blob}')
          print(f'tick_blob={git_blob_sha(tick_path)}')
          PY

      - name: Remove bootstrap workflow from final branch state
        shell: bash
        run: rm .github/workflows/_athena-shortname-hotfix-bootstrap.yml

      - name: Focused regression suite
        shell: bash
        run: git pull --ff-only && python -m pytest -q tests/test_fotmob_fresh_holdout_capture_qualification_adapter.py tests/test_fotmob_fresh_holdout_duplicate_group_wrapper.py tests/test_fotmob_fresh_holdout_ordinary_ft_settlement_schema_adapter.py

      - name: Compile touched Python modules
        shell: bash
        run: git pull --ff-only && python -m compileall -q domain/fotmob_fresh_holdout_capture_qualification_adapter.py domain/fotmob_fresh_holdout_ordinary_ft_settlement_schema_adapter.py scripts/run_fotmob_utc_native_xg_fresh_holdout_tick.py

      - name: Diff whitespace validation
        shell: bash
        run: git pull --ff-only && git diff --check

      - name: Commit reviewed hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add domain/fotmob_fresh_holdout_capture_qualification_adapter.py domain/fotmob_fresh_holdout_ordinary_ft_settlement_schema_adapter.py scripts/run_fotmob_utc_native_xg_fresh_holdout_tick.py tests/test_fotmob_fresh_holdout_duplicate_group_wrapper.py .github/workflows/_athena-shortname-hotfix-bootstrap.yml
          git diff --cached --check
          git commit -m "[FotMob][Continuity] Admit reviewed team shortName projection"
          git push origin HEAD:fix/fresh-holdout-shortname-compatibility
