name: ATHENA one-time offline repair workspace (temporary branch only)
on:
  push:
    branches:
      - athena/one-time-checkpoint-holdout-20261024
permissions:
  contents: write
concurrency:
  group: athena-one-time-offline-repair
  cancel-in-progress: false
jobs:
  build-candidate:
    if: "github.event.head_commit.message == 'chore: run one-time offline Checkpoint-E candidate on isolated branch'"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact temporary branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 20
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install offline audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install PyYAML
      - name: Build exact historical Tests repair and derive authenticated A2 successor
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/athena/one-time-checkpoint-holdout-20261024"
          python .github/athena_one_time_checkpoint_candidate.py

