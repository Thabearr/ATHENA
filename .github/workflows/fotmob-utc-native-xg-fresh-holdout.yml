name: FotMob UTC-Native xG Fresh-Holdout Collection Runner

on:
  schedule:
    - cron: '7 * * * *'
    - cron: '37 * * * *'

concurrency:
  group: fotmob-utc-native-xg-fresh-holdout
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  collect:
    name: execute fresh holdout tick
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Resolve nominal schedule slot and release target
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import subprocess
          from pathlib import Path
          import domain.fotmob_utc_native_expected_goals_fresh_holdout_activation_runner as runner

          event_name = os.environ.get("EVENT_NAME")
          if event_name != "schedule":
              raise SystemExit(f"forbidden event trigger: {event_name!r}")

          schedule_expr = os.environ.get("EVENT_SCHEDULE", "")
          if schedule_expr not in ("7 * * * *", "37 * * * *"):
              raise SystemExit(f"unexpected schedule expression: {schedule_expr!r}")

          run_id = os.environ["GITHUB_RUN_ID"]
          repo = os.environ["GITHUB_REPOSITORY"]

          try:
              out = subprocess.check_output(
                  ["gh", "api", f"/repos/{repo}/actions/runs/{run_id}"],
                  text=True,
              )
              data = json.loads(out)
              created_at_text = data["created_at"]
              created_at = dt.datetime.fromisoformat(created_at_text.replace("Z", "+00:00")).astimezone(dt.timezone.utc)
          except Exception as exc:
              raise SystemExit(f"could not obtain authoritative run creation time: {exc}")

          nominal, nominal_iso, release_tag, success_prefix, failure_prefix = runner.resolve_nominal_schedule_slot(
              schedule_expr, created_at
          )
          success_asset = f"{success_prefix}{run_id}.tar.gz"
          failure_asset = f"{failure_prefix}{run_id}.tar.gz"

          output_path = os.environ.get("GITHUB_OUTPUT")
          if output_path:
              with open(output_path, "a", encoding="utf-8") as fh:
                  fh.write(f"nominal_slot={nominal_iso}\n")
                  fh.write(f"nominal_compact={nominal.strftime('%Y%m%dT%H%M%SZ')}\n")
                  fh.write(f"release_tag={release_tag}\n")
                  fh.write(f"success_asset={success_asset}\n")
                  fh.write(f"failure_asset={failure_asset}\n")

          print(f"schedule: {schedule_expr}")
          print(f"run created_at: {created_at_text}")
          print(f"nominal slot: {nominal_iso}")
          print(f"release tag: {release_tag}")
          print(f"success asset: {success_asset}")
          print(f"failure asset: {failure_asset}")
          PY

      - name: Restore or materialize PR119 bootstrap projection
        id: bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          import domain.fotmob_utc_native_expected_goals_fresh_holdout as fresh

          expected_sha = fresh.BOOTSTRAP_PROJECTION_SHA256
          expected_size = fresh.BOOTSTRAP_PROJECTION_SIZE
          expected_rows = fresh.BOOTSTRAP_PROJECTION_ROWS
          bootstrap_tag = "athena-fresh-holdout-bootstrap-v1"
          asset_name = "pr119-materialized.ndjson"
          repo = os.environ["GITHUB_REPOSITORY"]

          target = Path("pr119-materialized.ndjson")
          downloaded = False

          try:
              res = subprocess.run(
                  ["gh", "release", "download", bootstrap_tag, "--pattern", asset_name, "--repo", repo],
                  capture_output=True,
                  text=True,
              )
              if res.returncode == 0 and target.is_file():
                  raw = target.read_bytes()
                  if hashlib.sha256(raw).hexdigest() == expected_sha and len(raw) == expected_size:
                      downloaded = True
                      print("restored bootstrap projection from release asset")
          except Exception as exc:
              print(f"release download check: {exc}")

          if not downloaded:
              print("materializing bootstrap projection from preserved PR119 campaign artifact...")
              artifact_id = "9249856559"
              zip_path = Path("pr119-preserved-artifact.zip")
              subprocess.check_call(
                  ["gh", "api", f"/repos/{repo}/actions/artifacts/{artifact_id}/zip"],
                  stdout=zip_path.open("wb"),
              )
              zip_raw = zip_path.read_bytes()
              zip_sha = hashlib.sha256(zip_raw).hexdigest()
              zip_size = len(zip_raw)
              expected_zip_sha = "7c2fa200efed098bd5fca22fc139af816256c74967b98d8cb2c62fe3e793508f"
              expected_zip_size = 61_886_753
              if zip_sha != expected_zip_sha or zip_size != expected_zip_size:
                  raise SystemExit(f"preserved artifact mismatch: got sha={zip_sha} size={zip_size}")

              subprocess.check_call([
                  "python",
                  "scripts/qualify_fotmob_historical_source_history_completeness_materialization.py",
                  "pr119-preserved-artifact.zip",
                  "--projection-output",
                  str(target),
              ])
              raw = target.read_bytes()
              if hashlib.sha256(raw).hexdigest() != expected_sha or len(raw) != expected_size:
                  raise SystemExit("materialized projection failed validation")

              try:
                  subprocess.run(
                      [
                          "gh", "release", "create", bootstrap_tag,
                          "--title", "FotMob UTC-Native Fresh Holdout Bootstrap V1",
                          "--notes", "Exact reviewed PR119 materialized bootstrap projection.",
                          str(target),
                          "--repo", repo,
                      ],
                      check=True,
                  )
              except Exception:
                  try:
                      subprocess.run(
                          ["gh", "release", "upload", bootstrap_tag, str(target), "--repo", repo],
                          check=True,
                      )
                  except Exception as e:
                      print(f"bootstrap release upload warning: {e}")

          raw = target.read_bytes()
          rows = raw.count(b"\n")
          if hashlib.sha256(raw).hexdigest() != expected_sha or len(raw) != expected_size or rows != expected_rows:
              raise SystemExit("bootstrap projection integrity check failed")
          print(f"bootstrap verified: sha256={expected_sha} size={expected_size} rows={rows}")
          PY

      - name: Restore latest authoritative durable state
        id: restore_state
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          NOMINAL_SLOT: ${{ steps.slot.outputs.nominal_slot }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import hashlib
          import json
          import os
          import subprocess
          import tempfile
          import zipfile
          from pathlib import Path
          import domain.fotmob_utc_native_expected_goals_fresh_holdout_activation_runner as runner
          import domain.fotmob_utc_native_expected_goals_fresh_holdout_collection_control as control

          repo = os.environ["GITHUB_REPOSITORY"]
          current_run_id = int(os.environ["CURRENT_RUN_ID"])
          nominal_slot_text = os.environ["NOMINAL_SLOT"]
          nominal_slot = dt.datetime.fromisoformat(nominal_slot_text.replace("Z", "+00:00")).astimezone(dt.timezone.utc)

          state_root = Path(control.CONTROL_ROOT_RELATIVE)
          state_root.mkdir(parents=True, exist_ok=True)

          try:
              out = subprocess.check_output(
                  [
                      "gh", "api",
                      f"/repos/{repo}/actions/workflows/fotmob-utc-native-xg-fresh-holdout.yml/runs?status=success&per_page=100",
                  ],
                  text=True,
              )
              runs_data = json.loads(out)
          except Exception as exc:
              raise SystemExit(f"FATAL: failed to query workflow runs from GitHub API: {exc}")

          if "workflow_runs" not in runs_data:
              raise SystemExit("FATAL: malformed workflow_runs response from GitHub API")

          prior_runs = [
              r for r in runs_data["workflow_runs"]
              if r["id"] != current_run_id and r.get("conclusion") == "success"
          ]
          prior_runs.sort(key=lambda r: r["id"], reverse=True)

          if not prior_runs:
              print("No prior successful workflow runs found in repository.")
              print("Legitimate first genesis: starting fresh from control state.")
          else:
              restored = False
              errors = []
              for prior_run in prior_runs:
                  p_id = prior_run["id"]
                  try:
                      art_out = subprocess.check_output(
                          ["gh", "api", f"/repos/{repo}/actions/runs/{p_id}/artifacts"],
                          text=True,
                      )
                      art_data = json.loads(art_out)
                      success_artifacts = [
                          a for a in art_data.get("artifacts", [])
                          if a["name"].startswith("success-") and not a.get("expired", False)
                      ]
                      if not success_artifacts:
                          continue

                      art = success_artifacts[0]
                      art_id = art["id"]
                      art_name = art["name"]
                      print(f"Restoring authoritative artifact {art_name} (ID: {art_id}) from run {p_id}...")

                      with tempfile.TemporaryDirectory() as tmpdir:
                          tmp = Path(tmpdir)
                          zip_path = tmp / "artifact.zip"
                          subprocess.check_call(
                              ["gh", "api", f"/repos/{repo}/actions/artifacts/{art_id}/zip"],
                              stdout=zip_path.open("wb"),
                          )
                          with zipfile.ZipFile(zip_path, "r") as zf:
                              tar_names = [n for n in zf.namelist() if n.startswith("success-") and n.endswith(".tar.gz")]
                              if not tar_names:
                                  raise SystemExit(f"artifact zip {art_name} does not contain success tar archive")
                              tar_name = tar_names[0]
                              zf.extract(tar_name, path=tmp)
                              tar_path = tmp / tar_name
                              runner.verify_and_extract_durable_state_archive(tar_path, repository_root=Path("."))

                      print(f"Successfully restored and verified durable state from run {p_id}.")
                      restored = True
                      break
                  except Exception as e:
                      errors.append(f"run {p_id}: {e}")

              if not restored:
                  raise SystemExit(
                      f"FATAL: prior successful campaign runs exist ({len(prior_runs)} found), "
                      f"but failed to restore authoritative predecessor state: {' | '.join(errors)}"
                  )
          PY

      - name: Execute reviewed fresh-holdout collection tick
        id: execute_tick
        env:
          NOMINAL_SLOT: ${{ steps.slot.outputs.nominal_slot }}
          RELEASE_TAG: ${{ steps.slot.outputs.release_tag }}
          SUCCESS_ASSET: ${{ steps.slot.outputs.success_asset }}
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          set +e
          python scripts/run_fotmob_utc_native_xg_fresh_holdout_tick.py \
            --scheduled-for "${NOMINAL_SLOT}" \
            --bootstrap-projection pr119-materialized.ndjson \
            --durable-release-tag "${RELEASE_TAG}" \
            --durable-asset-name "${SUCCESS_ASSET}" \
            --execute-live-network \
            --receipt-output fresh-holdout-tick-receipt.json
          exit_code=$?
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          exit ${exit_code}

      - name: Package durable state archive
        id: package
        if: always()
        env:
          SUCCESS_ASSET: ${{ steps.slot.outputs.success_asset }}
          FAILURE_ASSET: ${{ steps.slot.outputs.failure_asset }}
          TICK_EXIT: ${{ steps.execute_tick.outputs.exit_code }}
        shell: bash
        run: |
          set -euo pipefail
          state_dir=".cache/athena-research/fotmob-utc-native-xg-fresh-holdout"
          if [ "${TICK_EXIT:-1}" = "0" ]; then
            tar_name="${SUCCESS_ASSET}"
          else
            tar_name="${FAILURE_ASSET}"
          fi
          mkdir -p "${state_dir}"
          if [ -f fresh-holdout-tick-receipt.json ]; then
            tar -czf "${tar_name}" -C . "${state_dir}" fresh-holdout-tick-receipt.json
          else
            tar -czf "${tar_name}" -C . "${state_dir}"
          fi
          echo "archive_name=${tar_name}" >> "${GITHUB_OUTPUT}"
          ls -la "${tar_name}"

      - name: Publish long-lived evidence release asset
        id: publish_release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.slot.outputs.release_tag }}
          ARCHIVE_NAME: ${{ steps.package.outputs.archive_name }}
          TICK_EXIT: ${{ steps.execute_tick.outputs.exit_code }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          tag="${RELEASE_TAG}"
          archive="${ARCHIVE_NAME}"

          if ! gh release view "${tag}" --repo "${repo}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              --title "FotMob UTC-Native Fresh Holdout Evidence ${tag}" \
              --notes "Cumulative prospective evidence bundle for ${tag}." \
              --repo "${repo}" || true
          fi

          gh release upload "${tag}" "${archive}" --repo "${repo}" || true
          echo "uploaded ${archive} to release ${tag}"

      - name: Upload authoritative 90-day Actions artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ steps.package.outputs.archive_name }}
          path: |
            ${{ steps.package.outputs.archive_name }}
            fresh-holdout-tick-receipt.json
          retention-days: 90
