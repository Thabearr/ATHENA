name: FotMob UTC-Native xG Fresh-Holdout Collection Runner

on:
  schedule:
    - cron: '7 * * * *'
    - cron: '37 * * * *'

concurrency:
  group: fotmob-utc-native-xg-fresh-holdout
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  collect:
    name: execute fresh holdout tick
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Restore predecessor durable state and resolve schedule slot
        id: state
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path
          import domain.fotmob_utc_native_expected_goals_fresh_holdout_activation_runner as runner

          event_name = os.environ.get("EVENT_NAME")
          if event_name != "schedule":
              raise SystemExit(f"forbidden event trigger: {event_name!r}")

          schedule_expr = os.environ.get("EVENT_SCHEDULE", "")
          if schedule_expr not in ("7 * * * *", "37 * * * *"):
              raise SystemExit(f"unexpected schedule expression: {schedule_expr!r}")

          current_run_id = int(os.environ["GITHUB_RUN_ID"])
          repo = os.environ["GITHUB_REPOSITORY"]

          # Query GitHub API for workflow runs
          try:
              runs_out = subprocess.check_output(
                  [
                      "gh", "api",
                      f"/repos/{repo}/actions/workflows/fotmob-utc-native-xg-fresh-holdout.yml/runs?status=success&per_page=100",
                  ],
                  text=True,
              )
              runs_data = json.loads(runs_out)
              prior_runs = runs_data.get("workflow_runs", [])
          except Exception as exc:
              raise SystemExit(f"FATAL: failed to query workflow runs: {exc}")

          # Fetch current run metadata for exact created_at
          try:
              run_out = subprocess.check_output(
                  ["gh", "api", f"/repos/{repo}/actions/runs/{current_run_id}"],
                  text=True,
              )
              run_data = json.loads(run_out)
              created_at_text = run_data["created_at"]
              created_at = dt.datetime.fromisoformat(created_at_text.replace("Z", "+00:00")).astimezone(dt.timezone.utc)
          except Exception as exc:
              raise SystemExit(f"FATAL: could not obtain authoritative run creation time: {exc}")

          def get_run_artifacts(run_id: int):
              out = subprocess.check_output(
                  ["gh", "api", f"/repos/{repo}/actions/runs/{run_id}/artifacts"],
                  text=True,
              )
              return json.loads(out)

          def download_artifact_zip(art_id: int) -> bytes:
              return subprocess.check_output(
                  ["gh", "api", f"/repos/{repo}/actions/artifacts/{art_id}/zip"],
              )

          try:
              last_committed_utc = runner.restore_predecessor_durable_state(
                  prior_runs=prior_runs,
                  current_run_id=current_run_id,
                  get_run_artifacts=get_run_artifacts,
                  download_artifact_zip=download_artifact_zip,
                  repository_root=Path("."),
              )
          except Exception as exc:
              raise SystemExit(f"FATAL: predecessor state restore failed: {exc}")

          if last_committed_utc is None:
              print("Legitimate first Genesis: zero prior successful runs found.")
          else:
              print(f"Authoritative predecessor restored. Last committed tick: {last_committed_utc.isoformat()}")

          try:
              nominal, nominal_iso, release_tag, success_prefix, failure_prefix = runner.resolve_nominal_schedule_slot(
                  schedule_expr, created_at, last_committed_utc=last_committed_utc
              )
          except Exception as exc:
              raise SystemExit(f"FATAL: schedule slot resolution failed: {exc}")

          success_asset = f"{success_prefix}{current_run_id}.tar.gz"
          failure_asset = f"{failure_prefix}{current_run_id}.tar.gz"

          output_path = os.environ.get("GITHUB_OUTPUT")
          if output_path:
              with open(output_path, "a", encoding="utf-8") as fh:
                  fh.write(f"nominal_slot={nominal_iso}\n")
                  fh.write(f"nominal_compact={nominal.strftime('%Y%m%dT%H%M%SZ')}\n")
                  fh.write(f"release_tag={release_tag}\n")
                  fh.write(f"success_asset={success_asset}\n")
                  fh.write(f"failure_asset={failure_asset}\n")

          print(f"schedule expression: {schedule_expr}")
          print(f"run created_at: {created_at_text}")
          print(f"resolved nominal slot: {nominal_iso}")
          print(f"release tag: {release_tag}")
          print(f"success asset: {success_asset}")
          print(f"failure asset: {failure_asset}")
          PY

      - name: Restore or materialize PR119 bootstrap projection
        id: bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          import domain.fotmob_utc_native_expected_goals_fresh_holdout as fresh

          expected_sha = fresh.BOOTSTRAP_PROJECTION_SHA256
          expected_size = fresh.BOOTSTRAP_PROJECTION_SIZE
          expected_rows = fresh.BOOTSTRAP_PROJECTION_ROWS
          bootstrap_tag = "athena-fresh-holdout-bootstrap-v1"
          asset_name = "pr119-materialized.ndjson"
          repo = os.environ["GITHUB_REPOSITORY"]

          target = Path("pr119-materialized.ndjson")
          downloaded = False

          try:
              res = subprocess.run(
                  ["gh", "release", "download", bootstrap_tag, "--pattern", asset_name, "--repo", repo],
                  capture_output=True,
                  text=True,
              )
              if res.returncode == 0 and target.is_file():
                  raw = target.read_bytes()
                  if hashlib.sha256(raw).hexdigest() == expected_sha and len(raw) == expected_size:
                      downloaded = True
                      print("restored bootstrap projection from release asset")
          except Exception as exc:
              print(f"release download check: {exc}")

          if not downloaded:
              print("materializing bootstrap projection from preserved PR119 campaign artifact...")
              artifact_id = "9249856559"
              zip_path = Path("pr119-preserved-artifact.zip")
              subprocess.check_call(
                  ["gh", "api", f"/repos/{repo}/actions/artifacts/{artifact_id}/zip"],
                  stdout=zip_path.open("wb"),
              )
              import zipfile
              with zipfile.ZipFile(zip_path, "r") as zf:
                  zf.extractall("preserved_pr119")
              ndjson_src = Path("preserved_pr119/database/market_evidence/fotmob_data_matches_epl_historical_raw_features.ndjson")
              if not ndjson_src.is_file():
                  raise SystemExit("source ndjson missing from PR119 artifact")
              lines = ndjson_src.read_bytes().splitlines()
              if len(lines) != expected_rows:
                  raise SystemExit(f"unexpected line count: {len(lines)}")
              target.write_bytes(ndjson_src.read_bytes())

              if not subprocess.run(["gh", "release", "view", bootstrap_tag, "--repo", repo], capture_output=True).returncode == 0:
                  subprocess.run(
                      ["gh", "release", "create", bootstrap_tag, "--title", "PR119 Materialized Bootstrap Projection", "--notes", "Preserved immutable bootstrap projection for the reviewed FotMob fresh holdout.", "--repo", repo],
                      check=False,
                  )
              try:
                  subprocess.run(
                      ["gh", "release", "upload", bootstrap_tag, str(target), "--repo", repo],
                      check=False,
                  )
              except Exception as e:
                  print(f"bootstrap release upload warning: {e}")

          raw = target.read_bytes()
          rows = raw.count(b"\n")
          if hashlib.sha256(raw).hexdigest() != expected_sha or len(raw) != expected_size or rows != expected_rows:
              raise SystemExit("bootstrap projection integrity check failed")
          print(f"bootstrap verified: sha256={expected_sha} size={expected_size} rows={rows}")
          PY

      - name: Execute reviewed fresh-holdout collection tick
        id: execute_tick
        env:
          NOMINAL_SLOT: ${{ steps.state.outputs.nominal_slot }}
          RELEASE_TAG: ${{ steps.state.outputs.release_tag }}
          SUCCESS_ASSET: ${{ steps.state.outputs.success_asset }}
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          set +e
          python scripts/run_fotmob_utc_native_xg_fresh_holdout_tick.py \
            --scheduled-for "${NOMINAL_SLOT}" \
            --bootstrap-projection pr119-materialized.ndjson \
            --durable-release-tag "${RELEASE_TAG}" \
            --durable-asset-name "${SUCCESS_ASSET}" \
            --execute-live-network \
            --receipt-output fresh-holdout-tick-receipt.json
          exit_code=$?
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          exit ${exit_code}

      - name: Package durable state archive
        id: package
        if: always()
        env:
          SUCCESS_ASSET: ${{ steps.state.outputs.success_asset }}
          FAILURE_ASSET: ${{ steps.state.outputs.failure_asset }}
          TICK_EXIT: ${{ steps.execute_tick.outputs.exit_code }}
        shell: bash
        run: |
          set -euo pipefail
          state_dir=".cache/athena-research/fotmob-utc-native-xg-fresh-holdout"
          if [ "${TICK_EXIT:-1}" = "0" ]; then
            tar_name="${SUCCESS_ASSET}"
          else
            tar_name="${FAILURE_ASSET}"
          fi
          mkdir -p "${state_dir}"
          tar -czf "${tar_name}" -C . "${state_dir}"

          python - <<PY
          import hashlib
          import json
          from pathlib import Path

          tar_path = Path("${tar_name}")
          tar_bytes = tar_path.read_bytes()
          tar_sha = hashlib.sha256(tar_bytes).hexdigest()
          tar_size = len(tar_bytes)

          receipt_path = Path("fresh-holdout-tick-receipt.json")
          receipt_data = {}
          if receipt_path.is_file():
              try:
                  receipt_data = json.loads(receipt_path.read_bytes())
              except Exception:
                  pass

          receipt_data["durable_asset_name"] = "${tar_name}"
          receipt_data["durable_asset_sha256"] = tar_sha
          receipt_data["durable_asset_size_bytes"] = tar_size

          receipt_path.write_bytes(
              (json.dumps(receipt_data, sort_keys=True, separators=(",", ":")) + "\n").encode("utf-8")
          )
          print(f"packaged {tar_name}: sha256={tar_sha} size={tar_size}")
          PY

          echo "archive_name=${tar_name}" >> "${GITHUB_OUTPUT}"

      - name: Upload authoritative 90-day Actions artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ steps.package.outputs.archive_name }}
          path: |
            ${{ steps.package.outputs.archive_name }}
            fresh-holdout-tick-receipt.json
          retention-days: 90

      - name: Publish and verify long-lived evidence release asset
        id: publish_release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.state.outputs.release_tag }}
          ARCHIVE_NAME: ${{ steps.package.outputs.archive_name }}
          TICK_EXIT: ${{ steps.execute_tick.outputs.exit_code }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          tag="${RELEASE_TAG}"
          archive="${ARCHIVE_NAME}"

          if ! gh release view "${tag}" --repo "${repo}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              --title "FotMob UTC-Native Fresh Holdout Evidence ${tag}" \
              --notes "Cumulative prospective evidence bundle for ${tag}." \
              --repo "${repo}"
          fi

          gh release upload "${tag}" "${archive}" --repo "${repo}"

          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          archive_name = os.environ["ARCHIVE_NAME"]
          archive_path = Path(archive_name)
          expected_size = archive_path.stat().st_size

          out = subprocess.check_output(
              ["gh", "api", f"/repos/{repo}/releases/tags/{tag}"],
              text=True,
          )
          release_data = json.loads(out)
          matching_assets = [
              a for a in release_data.get("assets", [])
              if a.get("name") == archive_name
          ]
          if len(matching_assets) != 1:
              raise SystemExit(
                  f"FATAL: release {tag} does not contain exactly one asset named {archive_name}, found {len(matching_assets)}"
              )
          asset = matching_assets[0]
          if asset.get("state") != "uploaded":
              raise SystemExit(f"FATAL: release asset {archive_name} state is not 'uploaded': {asset.get('state')}")
          if asset.get("size") != expected_size:
              raise SystemExit(f"FATAL: release asset {archive_name} size mismatch: expected {expected_size}, got {asset.get('size')}")
          print(f"Verified release asset {archive_name} on {tag} (size={expected_size}).")
          PY

          # Re-raise tick execution failure if the tick itself failed
          if [ "${TICK_EXIT:-1}" != "0" ]; then
            echo "Tick execution failed with exit code ${TICK_EXIT}; failure archive published."
            exit "${TICK_EXIT}"
          fi
