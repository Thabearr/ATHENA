name: FotMob UTC-Native xG Fresh-Holdout Collection Runner

on:
  schedule:
    - cron: '7 * * * *'
    - cron: '37 * * * *'

concurrency:
  group: fotmob-utc-native-xg-fresh-holdout
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  collect:
    name: execute fresh holdout tick
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Restore newest durable lineage and resolve schedule slot
        id: state
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import subprocess
          from pathlib import Path
          import domain.fotmob_utc_native_expected_goals_fresh_holdout_failure_lineage as lineage

          event_name = os.environ.get("EVENT_NAME")
          if event_name != "schedule":
              raise SystemExit(f"forbidden event trigger: {event_name!r}")

          schedule_expr = os.environ.get("EVENT_SCHEDULE", "")
          if schedule_expr not in ("7 * * * *", "37 * * * *"):
              raise SystemExit(f"unexpected schedule expression: {schedule_expr!r}")

          current_run_id = int(os.environ["GITHUB_RUN_ID"])
          repo = os.environ["GITHUB_REPOSITORY"]

          try:
              runs_out = subprocess.check_output(
                  [
                      "gh", "api", "--paginate", "--slurp",
                      f"/repos/{repo}/actions/workflows/fotmob-utc-native-xg-fresh-holdout.yml/runs?per_page=100",
                  ],
                  text=True,
              )
              runs_pages = json.loads(runs_out)
              if type(runs_pages) is not list or not runs_pages:
                  raise RuntimeError("malformed paginated workflow_runs response")
              prior_runs = []
              for runs_data in runs_pages:
                  if (
                      type(runs_data) is not dict
                      or type(runs_data.get("workflow_runs")) is not list
                  ):
                      raise RuntimeError("malformed workflow_runs response page")
                  prior_runs.extend(runs_data["workflow_runs"])
          except Exception as exc:
              raise SystemExit(f"FATAL: failed to query workflow runs: {exc}")

          try:
              run_out = subprocess.check_output(
                  ["gh", "api", f"/repos/{repo}/actions/runs/{current_run_id}"],
                  text=True,
              )
              run_data = json.loads(run_out)
              created_at_text = run_data["created_at"]
              created_at = dt.datetime.fromisoformat(
                  created_at_text.replace("Z", "+00:00")
              ).astimezone(dt.timezone.utc)
          except Exception as exc:
              raise SystemExit(
                  f"FATAL: could not obtain authoritative run creation time: {exc}"
              )

          def get_run_artifacts(run_id: int):
              out = subprocess.check_output(
                  ["gh", "api", f"/repos/{repo}/actions/runs/{run_id}/artifacts"],
                  text=True,
              )
              return json.loads(out)

          def download_artifact_zip(artifact_id: int) -> bytes:
              return subprocess.check_output(
                  [
                      "gh", "api", "-H", "Accept: application/vnd.github+json",
                      f"/repos/{repo}/actions/artifacts/{artifact_id}/zip",
                  ],
              )

          try:
              restored = lineage.restore_latest_lineage_state(
                  prior_runs=prior_runs,
                  current_run_id=current_run_id,
                  get_run_artifacts=get_run_artifacts,
                  download_artifact_zip=download_artifact_zip,
                  repository_root=Path("."),
              )
          except Exception as exc:
              raise SystemExit(f"FATAL: predecessor lineage restore failed: {exc}")

          if restored.predecessor_run_id is None:
              print("Legitimate first Genesis: zero prior completed campaign runs found.")
          else:
              print(
                  "Authoritative predecessor restored: "
                  f"run={restored.predecessor_run_id} "
                  f"conclusion={restored.predecessor_conclusion} "
                  f"last_committed={restored.last_committed_utc} "
                  f"last_attempted={restored.last_attempted_utc}"
              )

          try:
              nominal, nominal_iso, release_tag, success_prefix, failure_prefix = (
                  lineage.resolve_nominal_schedule_slot_from_lineage(
                      schedule_expr,
                      created_at,
                      restored,
                  )
              )
          except Exception as exc:
              raise SystemExit(f"FATAL: schedule slot resolution failed: {exc}")

          success_asset = f"{success_prefix}{current_run_id}.tar.gz"
          failure_asset = f"{failure_prefix}{current_run_id}.tar.gz"

          output_path = os.environ.get("GITHUB_OUTPUT")
          if output_path:
              with open(output_path, "a", encoding="utf-8") as fh:
                  fh.write(f"nominal_slot={nominal_iso}\n")
                  fh.write(f"nominal_compact={nominal.strftime('%Y%m%dT%H%M%SZ')}\n")
                  fh.write(f"release_tag={release_tag}\n")
                  fh.write(f"success_asset={success_asset}\n")
                  fh.write(f"failure_asset={failure_asset}\n")

          print(f"schedule expression: {schedule_expr}")
          print(f"run created_at: {created_at_text}")
          print(f"resolved nominal slot: {nominal_iso}")
          print(f"release tag: {release_tag}")
          print(f"success asset: {success_asset}")
          print(f"failure asset: {failure_asset}")
          PY

      - name: Restore or materialize PR119 bootstrap projection
        id: bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import os
          import subprocess
          import sys
          from pathlib import Path
          import domain.fotmob_utc_native_expected_goals_fresh_holdout as fresh

          expected_sha = fresh.BOOTSTRAP_PROJECTION_SHA256
          expected_size = fresh.BOOTSTRAP_PROJECTION_SIZE
          expected_rows = fresh.BOOTSTRAP_PROJECTION_ROWS
          bootstrap_tag = "athena-fresh-holdout-bootstrap-v1"
          asset_name = "pr119-materialized.ndjson"
          repo = os.environ["GITHUB_REPOSITORY"]

          artifact_id = "9249856559"
          expected_artifact_sha = "7c2fa200efed098bd5fca22fc139af816256c74967b98d8cb2c62fe3e793508f"
          expected_artifact_size = 61_886_753
          executor = "scripts/qualify_fotmob_historical_source_history_completeness_materialization.py"
          expected_executor_blob = "2409676b4993a25024e2e8554e84e3525e7c5e6e"
          expected_receipt_sha = "da8037cd9b4a4f91be942a4052e76134b66cc94221ed66e624c14008c9e562a0"
          expected_receipt_size = 6_810

          target = Path(asset_name)
          downloaded = False

          try:
              res = subprocess.run(
                  [
                      "gh", "release", "download", bootstrap_tag,
                      "--pattern", asset_name,
                      "--repo", repo,
                  ],
                  capture_output=True,
                  text=True,
              )
              if res.returncode == 0 and target.is_file():
                  raw = target.read_bytes()
                  if (
                      hashlib.sha256(raw).hexdigest() == expected_sha
                      and len(raw) == expected_size
                      and raw.count(b"\n") == expected_rows
                  ):
                      downloaded = True
                      print("restored exact bootstrap projection from release asset")
                  else:
                      target.unlink(missing_ok=True)
                      print("bootstrap release asset identity mismatch; rebuilding from frozen PR119 source")
          except Exception as exc:
              target.unlink(missing_ok=True)
              print(f"release download check: {exc}")

          if not downloaded:
              print("materializing exact bootstrap projection from preserved PR119 campaign artifact...")
              actual_executor_blob = subprocess.check_output(
                  ["git", "rev-parse", f"HEAD:{executor}"],
                  text=True,
              ).strip()
              if actual_executor_blob != expected_executor_blob:
                  raise SystemExit(
                      "reviewed PR119 materialization executor blob identity changed"
                  )

              zip_path = Path("pr119-preserved-artifact.zip")
              with zip_path.open("wb") as handle:
                  subprocess.check_call(
                      [
                          "gh", "api", "-H", "Accept: application/vnd.github+json",
                          f"/repos/{repo}/actions/artifacts/{artifact_id}/zip",
                      ],
                      stdout=handle,
                  )
              artifact_raw = zip_path.read_bytes()
              if (
                  len(artifact_raw) != expected_artifact_size
                  or hashlib.sha256(artifact_raw).hexdigest() != expected_artifact_sha
              ):
                  raise SystemExit("preserved PR119 artifact ZIP identity changed")

              receipt_path = Path("pr119-materialization-receipt.json")
              subprocess.check_call(
                  [
                      sys.executable,
                      executor,
                      str(zip_path),
                      "--output", str(receipt_path),
                      "--projection-output", str(target),
                  ]
              )
              receipt_raw = receipt_path.read_bytes()
              if (
                  len(receipt_raw) != expected_receipt_size
                  or hashlib.sha256(receipt_raw).hexdigest() != expected_receipt_sha
              ):
                  raise SystemExit("replayed PR119 materialization receipt identity changed")

              if subprocess.run(
                  ["gh", "release", "view", bootstrap_tag, "--repo", repo],
                  capture_output=True,
              ).returncode != 0:
                  subprocess.run(
                      [
                          "gh", "release", "create", bootstrap_tag,
                          "--title", "PR119 Materialized Bootstrap Projection",
                          "--notes", "Preserved immutable bootstrap projection for the reviewed FotMob fresh holdout.",
                          "--repo", repo,
                      ],
                      check=False,
                  )
              try:
                  subprocess.run(
                      [
                          "gh", "release", "upload", bootstrap_tag, str(target),
                          "--clobber", "--repo", repo,
                      ],
                      check=False,
                  )
              except Exception as exc:
                  print(f"bootstrap release upload warning: {exc}")

          raw = target.read_bytes()
          rows = raw.count(b"\n")
          if (
              hashlib.sha256(raw).hexdigest() != expected_sha
              or len(raw) != expected_size
              or rows != expected_rows
          ):
              raise SystemExit("bootstrap projection integrity check failed")
          print(
              f"bootstrap verified: sha256={expected_sha} "
              f"size={expected_size} rows={rows}"
          )
          PY

      - name: Execute reviewed fresh-holdout collection tick
        id: execute_tick
        env:
          NOMINAL_SLOT: ${{ steps.state.outputs.nominal_slot }}
          RELEASE_TAG: ${{ steps.state.outputs.release_tag }}
          SUCCESS_ASSET: ${{ steps.state.outputs.success_asset }}
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          set +e
          python scripts/run_fotmob_utc_native_xg_fresh_holdout_tick.py \
            --scheduled-for "${NOMINAL_SLOT}" \
            --bootstrap-projection pr119-materialized.ndjson \
            --durable-release-tag "${RELEASE_TAG}" \
            --durable-asset-name "${SUCCESS_ASSET}" \
            --execute-live-network \
            --receipt-output fresh-holdout-tick-receipt.json
          exit_code=$?
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          exit ${exit_code}

      - name: Reconcile any staged capture lineage
        id: reconcile
        if: always() && steps.state.outcome == 'success' && steps.execute_tick.outcome == 'failure'
        env:
          RELEASE_TAG: ${{ steps.state.outputs.release_tag }}
          FAILURE_ASSET: ${{ steps.state.outputs.failure_asset }}
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import domain.fotmob_utc_native_expected_goals_fresh_holdout_failure_lineage as lineage

          result = lineage.reconcile_staged_capture_lineage(
              durable_release_tag=os.environ["RELEASE_TAG"],
              durable_asset_name=os.environ["FAILURE_ASSET"],
              repository_root=Path("."),
          )
          print(f"failed-tick evidence reconciliation: {result}")
          PY

      - name: Package durable state archive
        id: package
        if: always()
        env:
          SUCCESS_ASSET: ${{ steps.state.outputs.success_asset }}
          FAILURE_ASSET: ${{ steps.state.outputs.failure_asset }}
          RELEASE_TAG: ${{ steps.state.outputs.release_tag }}
          NOMINAL_SLOT: ${{ steps.state.outputs.nominal_slot }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          TICK_EXIT: ${{ steps.execute_tick.outputs.exit_code }}
          RECONCILE_OUTCOME: ${{ steps.reconcile.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          state_dir=".cache/athena-research/fotmob-utc-native-xg-fresh-holdout"
          if [ -z "${NOMINAL_SLOT:-}" ]; then
            echo "FATAL: nominal slot was not resolved; refusing to fabricate lineage archive identity"
            exit 1
          fi
          if [ "${TICK_EXIT:-1}" = "0" ]; then
            tar_name="${SUCCESS_ASSET}"
          else
            tar_name="${FAILURE_ASSET}"
          fi
          if [ -z "${tar_name:-}" ]; then
            echo "FATAL: durable archive name is empty"
            exit 1
          fi
          mkdir -p "${state_dir}"
          tar -czf "${tar_name}" -C . "${state_dir}"

          python - <<PY
          import hashlib
          import json
          from pathlib import Path

          tar_path = Path("${tar_name}")
          tar_bytes = tar_path.read_bytes()
          tar_sha = hashlib.sha256(tar_bytes).hexdigest()
          tar_size = len(tar_bytes)

          receipt_path = Path("fresh-holdout-tick-receipt.json")
          receipt_data = {}
          if receipt_path.is_file():
              try:
                  receipt_data = json.loads(receipt_path.read_bytes())
              except Exception:
                  receipt_data = {}

          receipt_data["workflow_run_id"] = int("${WORKFLOW_RUN_ID}")
          receipt_data["workflow_event_schedule"] = "${EVENT_SCHEDULE}"
          receipt_data["nominal_scheduled_for_utc"] = "${NOMINAL_SLOT}"
          receipt_data["durable_release_tag"] = "${RELEASE_TAG}"
          receipt_data["durable_asset_name"] = "${tar_name}"
          receipt_data["durable_asset_sha256"] = tar_sha
          receipt_data["durable_asset_size_bytes"] = tar_size
          receipt_data["tick_exit_code"] = int("${TICK_EXIT:-1}")
          receipt_data["tick_committed"] = "${TICK_EXIT:-1}" == "0"
          receipt_data["failure_lineage_reconcile_outcome"] = "${RECONCILE_OUTCOME:-skipped}"

          receipt_path.write_bytes(
              (
                  json.dumps(
                      receipt_data,
                      sort_keys=True,
                      separators=(",", ":"),
                  )
                  + "\n"
              ).encode("utf-8")
          )
          print(
              f"packaged {tar_path.name}: sha256={tar_sha} size={tar_size}"
          )
          PY

          echo "archive_name=${tar_name}" >> "${GITHUB_OUTPUT}"

      - name: Upload authoritative 90-day Actions artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ steps.package.outputs.archive_name }}
          path: |
            ${{ steps.package.outputs.archive_name }}
            fresh-holdout-tick-receipt.json
          retention-days: 90

      - name: Publish and verify long-lived evidence release asset
        id: publish_release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.state.outputs.release_tag }}
          ARCHIVE_NAME: ${{ steps.package.outputs.archive_name }}
          TICK_EXIT: ${{ steps.execute_tick.outputs.exit_code }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          tag="${RELEASE_TAG}"
          archive="${ARCHIVE_NAME}"

          if [ -z "${tag:-}" ] || [ -z "${archive:-}" ]; then
            echo "FATAL: release identity unavailable"
            exit 1
          fi

          if ! gh release view "${tag}" --repo "${repo}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              --title "FotMob UTC-Native Fresh Holdout Evidence ${tag}" \
              --notes "Cumulative prospective evidence bundle for ${tag}." \
              --repo "${repo}"
          fi

          gh release upload "${tag}" "${archive}" --repo "${repo}"

          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          archive_name = os.environ["ARCHIVE_NAME"]
          archive_path = Path(archive_name)
          expected_size = archive_path.stat().st_size

          out = subprocess.check_output(
              ["gh", "api", f"/repos/{repo}/releases/tags/{tag}"],
              text=True,
          )
          release_data = json.loads(out)
          matching_assets = [
              asset
              for asset in release_data.get("assets", [])
              if asset.get("name") == archive_name
          ]
          if len(matching_assets) != 1:
              raise SystemExit(
                  f"FATAL: release {tag} does not contain exactly one asset "
                  f"named {archive_name}, found {len(matching_assets)}"
              )
          asset = matching_assets[0]
          if asset.get("state") != "uploaded":
              raise SystemExit(
                  f"FATAL: release asset {archive_name} state is not uploaded: "
                  f"{asset.get('state')}"
              )
          if asset.get("size") != expected_size:
              raise SystemExit(
                  f"FATAL: release asset {archive_name} size mismatch: "
                  f"expected {expected_size}, got {asset.get('size')}"
              )
          print(
              f"Verified release asset {archive_name} on {tag} "
              f"(size={expected_size})."
          )
          PY

          if [ "${TICK_EXIT:-1}" != "0" ]; then
            echo "Tick execution failed with exit code ${TICK_EXIT:-1}; failure archive published and retained for next-run lineage restore."
            exit "${TICK_EXIT:-1}"
          fi
