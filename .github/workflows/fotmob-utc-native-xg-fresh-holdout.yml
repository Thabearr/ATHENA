name: FotMob UTC-Native xG Fresh-Holdout Collection Runner

on:
  schedule:
    - cron: '7 * * * *'
    - cron: '37 * * * *'

concurrency:
  group: fotmob-utc-native-xg-fresh-holdout
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  collect:
    name: execute fresh holdout tick
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Resolve nominal schedule slot and release target
        id: slot
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import subprocess
          from pathlib import Path

          run_id = os.environ["GITHUB_RUN_ID"]
          now = dt.datetime.now(dt.timezone.utc)

          # Fetch workflow run created_at if possible, fallback to current time
          created_at = now
          try:
              out = subprocess.check_output(
                  ["gh", "run", "view", run_id, "--json", "createdAt"],
                  text=True,
              )
              data = json.loads(out)
              if "createdAt" in data:
                  created_at = dt.datetime.fromisoformat(data["createdAt"].replace("Z", "+00:00")).astimezone(dt.timezone.utc)
          except Exception:
              pass

          # Determine nominal minute from cron or closest :07/:37
          minute = created_at.minute
          # Find latest occurrence of :07 or :37 <= created_at
          c07 = created_at.replace(minute=7, second=0, microsecond=0)
          c37 = created_at.replace(minute=37, second=0, microsecond=0)
          candidates = [c07, c37]
          # Also check previous hour
          prev_hour = created_at - dt.timedelta(hours=1)
          candidates.extend([
              prev_hour.replace(minute=7, second=0, microsecond=0),
              prev_hour.replace(minute=37, second=0, microsecond=0),
          ])
          valid_candidates = [c for c in candidates if c <= created_at]
          nominal = max(valid_candidates)

          nominal_iso = nominal.strftime("%Y-%m-%dT%H:%M:%SZ")
          nominal_compact = nominal.strftime("%Y%m%dT%H%M%SZ")
          iso_year, iso_week, _ = nominal.isocalendar()
          release_tag = f"athena-fresh-holdout-evidence-{iso_year}-W{iso_week:02d}"
          success_asset = f"success-{nominal_compact}-run-{run_id}.tar.gz"
          failure_asset = f"failure-{nominal_compact}-run-{run_id}.tar.gz"

          output_path = os.environ.get("GITHUB_OUTPUT")
          if output_path:
              with open(output_path, "a", encoding="utf-8") as fh:
                  fh.write(f"nominal_slot={nominal_iso}\n")
                  fh.write(f"nominal_compact={nominal_compact}\n")
                  fh.write(f"release_tag={release_tag}\n")
                  fh.write(f"success_asset={success_asset}\n")
                  fh.write(f"failure_asset={failure_asset}\n")

          print(f"nominal slot: {nominal_iso}")
          print(f"release tag: {release_tag}")
          print(f"success asset: {success_asset}")
          print(f"failure asset: {failure_asset}")
          PY

      - name: Restore or materialize PR119 bootstrap projection
        id: bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          expected_sha = "e5b78163a5eb68000b9a60dda97f04cac2a970f9cf2aaf588233151e586be8c2"
          expected_size = 10_545_099
          expected_rows = 21_326
          bootstrap_tag = "athena-fresh-holdout-bootstrap-v1"
          asset_name = "pr119-materialized.ndjson"
          repo = os.environ["GITHUB_REPOSITORY"]

          target = Path("pr119-materialized.ndjson")
          downloaded = False

          # Try downloading from release
          try:
              res = subprocess.run(
                  ["gh", "release", "download", bootstrap_tag, "--pattern", asset_name, "--repo", repo],
                  capture_output=True,
                  text=True,
              )
              if res.returncode == 0 and target.is_file():
                  raw = target.read_bytes()
                  if hashlib.sha256(raw).hexdigest() == expected_sha and len(raw) == expected_size:
                      downloaded = True
                      print("restored bootstrap projection from release asset")
          except Exception as exc:
              print(f"release download check: {exc}")

          if not downloaded:
              print("materializing bootstrap projection from preserved PR119 campaign artifact...")
              # Download artifact 9249856559 from run 31887523012
              artifact_id = "9249856559"
              zip_path = Path("pr119-preserved-artifact.zip")
              subprocess.check_call(
                  ["gh", "api", f"/repos/{repo}/actions/artifacts/{artifact_id}/zip"],
                  stdout=zip_path.open("wb"),
              )
              zip_raw = zip_path.read_bytes()
              zip_sha = hashlib.sha256(zip_raw).hexdigest()
              zip_size = len(zip_raw)
              expected_zip_sha = "7c2fa200efed098bd5fca22fc139af816256c74967b98d8cb2c62fe3e793508f"
              expected_zip_size = 61_886_753
              if zip_sha != expected_zip_sha or zip_size != expected_zip_size:
                  raise SystemExit(f"preserved artifact mismatch: got sha={zip_sha} size={zip_size}")

              subprocess.check_call([
                  "python",
                  "scripts/qualify_fotmob_historical_source_history_completeness_materialization.py",
                  "pr119-preserved-artifact.zip",
                  "--projection-output",
                  str(target),
              ])
              raw = target.read_bytes()
              if hashlib.sha256(raw).hexdigest() != expected_sha or len(raw) != expected_size:
                  raise SystemExit("materialized projection failed validation")

              # Upload to release if release doesn't exist or asset is missing
              try:
                  subprocess.run(
                      ["gh", "release", "view", bootstrap_tag, "--repo", repo],
                      check=True,
                      capture_output=True,
                  )
                  subprocess.run(
                      ["gh", "release", "upload", bootstrap_tag, str(target), "--repo", repo, "--clobber"],
                      check=True,
                  )
              except Exception:
                  try:
                      subprocess.run(
                          [
                              "gh", "release", "create", bootstrap_tag,
                              "--title", "FotMob UTC-Native Fresh Holdout Bootstrap V1",
                              "--notes", "Exact reviewed PR119 materialized bootstrap projection.",
                              str(target),
                              "--repo", repo,
                          ],
                          check=True,
                      )
                  except Exception as e:
                      print(f"bootstrap release upload warning: {e}")

          # Final integrity verification
          raw = target.read_bytes()
          rows = raw.count(b"\n")
          if hashlib.sha256(raw).hexdigest() != expected_sha or len(raw) != expected_size or rows != expected_rows:
              raise SystemExit("bootstrap projection integrity check failed")
          print(f"bootstrap verified: sha256={expected_sha} size={expected_size} rows={rows}")
          PY

      - name: Restore latest durable state
        id: restore_state
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import shutil
          import subprocess
          import tarfile
          from pathlib import Path

          state_root = Path(".cache/athena-research/fotmob-utc-native-xg-fresh-holdout")
          state_root.mkdir(parents=True, exist_ok=True)
          repo = os.environ["GITHUB_REPOSITORY"]

          # List releases starting with athena-fresh-holdout-evidence-
          try:
              out = subprocess.check_output(
                  ["gh", "release", "list", "--repo", repo, "--limit", "100"],
                  text=True,
              )
          except Exception as exc:
              print(f"release list failed: {exc}")
              out = ""

          evidence_tags = []
          for line in out.splitlines():
              parts = line.split("\t")
              if parts and parts[0].startswith("athena-fresh-holdout-evidence-"):
                  evidence_tags.append(parts[0])

          success_assets = []
          for tag in sorted(evidence_tags, reverse=True):
              try:
                  view_out = subprocess.check_output(
                      ["gh", "release", "view", tag, "--repo", repo, "--json", "assets"],
                      text=True,
                  )
                  data = json.loads(view_out)
                  for asset in data.get("assets", []):
                      name = asset.get("name", "")
                      if name.startswith("success-") and name.endswith(".tar.gz"):
                          match = re.match(r"^success-(\d{8}T\d{6}Z)-run-\d+\.tar\.gz$", name)
                          if match:
                              success_assets.append((match.group(1), tag, name))
              except Exception as exc:
                  print(f"release view {tag} failed: {exc}")

          if success_assets:
              # Sort by nominal slot timestamp
              success_assets.sort(key=lambda x: x[0])
              latest_slot, latest_tag, latest_asset = success_assets[-1]
              print(f"restoring durable state from {latest_tag} / {latest_asset}...")
              tar_path = Path(latest_asset)
              subprocess.check_call([
                  "gh", "release", "download", latest_tag,
                  "--pattern", latest_asset,
                  "--repo", repo,
              ])
              with tarfile.open(tar_path, "r:gz") as tar:
                  for member in tar.getmembers():
                      p = Path(member.name)
                      if p.is_absolute() or ".." in p.parts or member.issym() or member.islnk():
                          raise SystemExit(f"forbidden archive member: {member.name}")
                  tar.extractall()
              print("durable state restored successfully")
          else:
              print("no previous durable state found; starting fresh from control state")
          PY

      - name: Execute reviewed fresh-holdout collection tick
        id: execute_tick
        env:
          NOMINAL_SLOT: ${{ steps.slot.outputs.nominal_slot }}
          RELEASE_TAG: ${{ steps.slot.outputs.release_tag }}
          SUCCESS_ASSET: ${{ steps.slot.outputs.success_asset }}
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          set +e
          python scripts/run_fotmob_utc_native_xg_fresh_holdout_tick.py \
            --scheduled-for "${NOMINAL_SLOT}" \
            --bootstrap-projection pr119-materialized.ndjson \
            --durable-release-tag "${RELEASE_TAG}" \
            --durable-asset-name "${SUCCESS_ASSET}" \
            --execute-live-network \
            --receipt-output fresh-holdout-tick-receipt.json
          exit_code=$?
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          exit ${exit_code}

      - name: Package durable state archive
        id: package
        if: always()
        env:
          SUCCESS_ASSET: ${{ steps.slot.outputs.success_asset }}
          FAILURE_ASSET: ${{ steps.slot.outputs.failure_asset }}
          TICK_EXIT: ${{ steps.execute_tick.outputs.exit_code }}
        shell: bash
        run: |
          set -euo pipefail
          state_dir=".cache/athena-research/fotmob-utc-native-xg-fresh-holdout"
          if [ "${TICK_EXIT:-1}" = "0" ]; then
            tar_name="${SUCCESS_ASSET}"
          else
            tar_name="${FAILURE_ASSET}"
          fi
          mkdir -p "${state_dir}"
          if [ -f fresh-holdout-tick-receipt.json ]; then
            tar -czf "${tar_name}" -C . "${state_dir}" fresh-holdout-tick-receipt.json
          else
            tar -czf "${tar_name}" -C . "${state_dir}"
          fi
          echo "archive_name=${tar_name}" >> "${GITHUB_OUTPUT}"
          ls -la "${tar_name}"

      - name: Publish durable evidence release asset
        id: publish_release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.slot.outputs.release_tag }}
          ARCHIVE_NAME: ${{ steps.package.outputs.archive_name }}
          TICK_EXIT: ${{ steps.execute_tick.outputs.exit_code }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          tag="${RELEASE_TAG}"
          archive="${ARCHIVE_NAME}"

          # Ensure release exists
          if ! gh release view "${tag}" --repo "${repo}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              --title "FotMob UTC-Native Fresh Holdout Evidence ${tag}" \
              --notes "Cumulative prospective evidence bundle for ${tag}." \
              --repo "${repo}" || true
          fi

          # Upload archive
          gh release upload "${tag}" "${archive}" --repo "${repo}" --clobber
          echo "uploaded ${archive} to release ${tag}"

      - name: Upload 90-day Actions artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ steps.package.outputs.archive_name }}
          path: |
            ${{ steps.package.outputs.archive_name }}
            fresh-holdout-tick-receipt.json
          retention-days: 90
