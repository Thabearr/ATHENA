name: Temporary Athena Sunday SportyBet code build

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tmp-athena-sunday-sportybet-code.yml"
      - "artifacts/research-protocols/sunday-2026-08-23-sportybet-final-20-selections-v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Inspect current SportyBet share codes and event metadata
        run: |
          python - <<'PY'
          import json
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          headers={"Accept":"application/json","Accept-Language":"en-NG,en;q=0.9","OperId":"2","User-Agent":"ATHENA/1.0 direct-sportybet-share-inspection"}
          codes = ["23MDR7", "W1PM6Q"]
          ids=[]
          for code in codes:
              req=Request(f"https://www.sportybet.com/api/ng/orders/share/{code}",headers=headers)
              with urlopen(req,timeout=45) as r: payload=json.load(r)
              rows=((payload.get("data") or {}).get("ticket") or {}).get("selections") or []
              print(f"=== SHARE {code} bizCode={payload.get('bizCode')} count={len(rows)} ===")
              for row in rows:
                  eid=row.get("eventId")
                  if isinstance(eid,str) and eid not in ids: ids.append(eid)
          for eid in ["sr:match:72221166","sr:match:72221168","sr:match:72221170"]:
              if eid not in ids: ids.append(eid)

          def walk(v):
              if isinstance(v,dict):
                  yield v
                  for x in v.values(): yield from walk(x)
              elif isinstance(v,list):
                  for x in v: yield from walk(x)

          for eid in ids:
              url="https://www.sportybet.com/api/ng/factsCenter/event?"+urlencode({"productId":3,"eventId":eid})
              try:
                  req=Request(url,headers=headers)
                  with urlopen(req,timeout=45) as r: p=json.load(r)
              except Exception as exc:
                  print("EVENT_ERROR",eid,repr(exc)); continue
              matches=[o for o in walk(p) if o.get("eventId")==eid]
              print(f"=== EVENT {eid} bizCode={p.get('bizCode')} matches={len(matches)} ===")
              for o in matches[:2]:
                  print(json.dumps(o,ensure_ascii=False,sort_keys=True)[:6000])
          PY
