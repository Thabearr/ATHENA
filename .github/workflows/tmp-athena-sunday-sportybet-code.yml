name: Temporary Athena Sunday SportyBet code build

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tmp-athena-sunday-sportybet-code.yml"
      - "artifacts/research-protocols/sunday-2026-08-23-sportybet-final-20-selections-v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Create and exact-roundtrip Sunday 20-fold SportyBet code
        run: |
          mkdir -p .cache/athena-research/sunday-2026-08-23-sportybet-final-20
          python scripts/sportybet_direct_share_bridge.py \
            --selections artifacts/research-protocols/sunday-2026-08-23-sportybet-final-20-selections-v1.json \
            --output-dir .cache/athena-research/sunday-2026-08-23-sportybet-final-20 \
            | tee .cache/athena-research/sunday-2026-08-23-sportybet-final-20.summary.json
