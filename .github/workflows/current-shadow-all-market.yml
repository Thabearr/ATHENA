name: ATHENA Current Shadow daily + on-demand

on:
  schedule:
    - cron: "0 9 * * *" # 10:00 WAT (UTC+1)
  workflow_dispatch:
    inputs:
      target_size:
        description: Requested research fold target, 1..50 (never padded)
        required: true
        default: "20"
        type: string
      fixture_scope:
        description: Today only, or the existing three-day research horizon
        required: true
        default: today
        type: choice
        options:
          - today
          - three-day

permissions:
  contents: read
  actions: read

concurrency:
  group: current-shadow-all-market
  cancel-in-progress: false

jobs:
  current-shadow-all-market:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Resolve daily/on-demand request
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGET_SIZE: ${{ inputs.target_size }}
          INPUT_FIXTURE_SCOPE: ${{ inputs.fixture_scope }}
        run: |
          if [ "${EVENT_NAME}" = "schedule" ]; then
            target_size="20"
            fixture_scope="today"
          else
            target_size="${INPUT_TARGET_SIZE}"
            fixture_scope="${INPUT_FIXTURE_SCOPE}"
          fi

          if ! [[ "${target_size}" =~ ^[0-9]+$ ]] || [ "${target_size}" -lt 1 ] || [ "${target_size}" -gt 50 ]; then
            echo "target_size must be an integer from 1 through 50" >&2
            exit 2
          fi
          case "${fixture_scope}" in
            today|three-day) ;;
            *)
              echo "fixture_scope must be today or three-day" >&2
              exit 2
              ;;
          esac

          printf 'ATHENA_TARGET_SIZE=%s\n' "${target_size}" >> "${GITHUB_ENV}"
          printf 'ATHENA_FIXTURE_SCOPE=%s\n' "${fixture_scope}" >> "${GITHUB_ENV}"
          printf 'Resolved ATHENA request: target=%s scope=%s\n' "${target_size}" "${fixture_scope}"

      - name: Restore fixed PR119 materialized bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache/athena-research/pr119-bootstrap
          gh release download athena-fresh-holdout-bootstrap-v1 \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern pr119-materialized.ndjson \
            --dir .cache/athena-research/pr119-bootstrap \
            --clobber
          printf '%s  %s\n' \
            'e5b78163a5eb68000b9a60dda97f04cac2a970f9cf2aaf588233151e586be8c2' \
            '.cache/athena-research/pr119-bootstrap/pr119-materialized.ndjson' \
            | sha256sum --check --strict

      - name: Resolve exact lineage main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lineage_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "${#lineage_main_sha}" -eq 40
          printf 'ATHENA_EXPECTED_LINEAGE_MAIN_SHA=%s\n' "${lineage_main_sha}" >> "${GITHUB_ENV}"

      - name: Execute current research Shadow request
        env:
          GH_TOKEN: ${{ github.token }}
          ATHENA_PR119_BOOTSTRAP_PATH: .cache/athena-research/pr119-bootstrap/pr119-materialized.ndjson
        run: |
          python -m scripts.execute_current_shadow_daily \
            --target-size "${ATHENA_TARGET_SIZE}" \
            --fixture-scope "${ATHENA_FIXTURE_SCOPE}" \
            --output-dir artifacts/current-shadow-all-market

      - name: Preserve exact current source evidence
        if: always()
        run: |
          evidence_root='artifacts/current-shadow-all-market/source-evidence'
          mkdir -p "${evidence_root}"
          for source_dir in \
            '.cache/athena-research/current-shadow-sportybet-catalog-fanout' \
            '.cache/athena-research/current-shadow-sportybet-upcoming-discovery' \
            '.cache/athena-research/sportybet-live-event-quote-evidence' \
            '.cache/athena-research/fotmob-data-matches-captures'
          do
            if [ -d "${source_dir}" ]; then
              cp -a "${source_dir}" "${evidence_root}/"
            fi
          done

      - name: Email durable Shadow result when configured
        if: always()
        continue-on-error: true
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          if [ -z "${GMAIL_ADDRESS}" ] || [ -z "${GMAIL_APP_PASSWORD}" ] || [ -z "${RECIPIENT_EMAIL}" ]; then
            echo "ATHENA email delivery skipped: repository email secrets are not fully configured."
            exit 0
          fi
          receipt='artifacts/current-shadow-all-market/current-shadow-all-market-run-receipt.json'
          if [ ! -f "${receipt}" ]; then
            echo "ATHENA email delivery skipped: durable Shadow run receipt is unavailable."
            exit 0
          fi
          python -m scripts.send_current_shadow_email --receipt "${receipt}"

      - name: Upload durable research receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-shadow-all-market-request
          path: artifacts/current-shadow-all-market
          if-no-files-found: error
          retention-days: 30
