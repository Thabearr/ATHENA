name: Validate Win Either Half Campaign Commitment

on:
  pull_request:
    branches:
      - main
    paths:
      - 'artifacts/research-commitments/win-either-half/**'
      - '.github/workflows/validate-win-either-half-campaign-commitment.yml'
      - 'artifacts/research-protocols/win-either-half-campaign-commitment-v1.json'
      - 'domain/win_either_half_campaign_commitment.py'
      - 'scripts/manage_win_either_half_campaign_commitment.py'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate-commitment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR Head Revision
        uses: actions/checkout@v4
        with:
          path: head
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout Base Revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: verifier
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          if [ -f verifier/requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r verifier/requirements.txt
          elif [ -f head/requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r head/requirements.txt
          fi

      - name: Run Commitment Deadline Validation
        run: |
          set -e
          SERVER_UTC=$(date -u +%Y-%m-%dT%H:%M:%S.%6NZ)
          ATTESTATION_PATH="${{ runner.temp }}/attestation-${{ github.run_id }}.json"

          # Check if base revision has Stage 5B4 verifier
          if [ -f "verifier/scripts/manage_win_either_half_campaign_commitment.py" ]; then
            echo "Executing base-revision verifier code..."

            # Enforce separation-of-duties: if commitment files changed, verifier/tooling cannot change in same PR
            COMMITMENT_CHANGES=$(git -C head diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} -- artifacts/research-commitments/win-either-half/)
            TOOLING_CHANGES=$(git -C head diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} -- .github/workflows/validate-win-either-half-campaign-commitment.yml artifacts/research-protocols/win-either-half-campaign-commitment-v1.json domain/win_either_half_campaign_commitment.py scripts/manage_win_either_half_campaign_commitment.py)

            if [ -n "$COMMITMENT_CHANGES" ] && [ -n "$TOOLING_CHANGES" ]; then
              echo "error: Separation-of-duties violation. Campaign commitment declarations cannot edit Stage 5B4 verifier/workflow/protocol files in the same pull request." >&2
              exit 1
            fi

            PYTHONPATH=verifier python -m scripts.manage_win_either_half_campaign_commitment \
              --validate-git-diff \
              --repository-root head \
              --base-sha ${{ github.event.pull_request.base.sha }} \
              --head-sha ${{ github.event.pull_request.head.sha }} \
              --server-observed-at "$SERVER_UTC" \
              --github-run-id ${{ github.run_id }} \
              --github-run-attempt ${{ github.run_attempt }} \
              --github-event-name pull_request \
              --attestation-output "$ATTESTATION_PATH" | tee output_summary.md

            cat output_summary.md >> $GITHUB_STEP_SUMMARY
            echo "ATTESTATION_CREATED=true" >> $GITHUB_ENV
            echo "ATTESTATION_PATH=$ATTESTATION_PATH" >> $GITHUB_ENV

          else
            echo "Base revision does not contain Stage 5B4 verifier (Bootstrap PR mode)."

            # Fail unless zero declarations exist under commitment root
            COMMITMENT_COUNT=$(git -C head diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} -- artifacts/research-commitments/win-either-half/ | wc -l)
            if [ "$COMMITMENT_COUNT" -ne 0 ]; then
              echo "error: Bootstrap PR cannot include real campaign declarations before base verifier is merged." >&2
              exit 1
            fi

            PYTHONPATH=head python -m pytest head/tests/test_win_either_half_campaign_commitment.py -q

            echo "### Stage 5B4 Tooling Bootstrap" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** \`BOOTSTRAP_TOOLING_ONLY\`" >> $GITHUB_STEP_SUMMARY
            echo "Base revision does not yet contain Stage 5B4 verifier. Stage 5B4 test suite passed cleanly. Zero commitment declarations were added." >> $GITHUB_STEP_SUMMARY
            echo "ATTESTATION_CREATED=false" >> $GITHUB_ENV
          fi

      - name: Upload Attestation Artifact
        if: env.ATTESTATION_CREATED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: win-either-half-campaign-commitment-${{ github.run_id }}
          path: ${{ env.ATTESTATION_PATH }}
          retention-days: 90
          if-no-files-found: error
