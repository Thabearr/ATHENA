name: Validate Win Either Half Campaign Commitment

on:
  pull_request:
    branches:
      - main
    paths:
      - 'artifacts/research-commitments/win-either-half/**'
      - '.github/workflows/validate-win-either-half-campaign-commitment.yml'
      - 'artifacts/research-protocols/win-either-half-campaign-commitment-v1.json'
      - 'domain/win_either_half_campaign_commitment.py'
      - 'scripts/manage_win_either_half_campaign_commitment.py'
      - 'docs/win_either_half_campaign_commitment.md'
      - 'tests/test_win_either_half_campaign_commitment.py'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate-commitment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR Head Revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout Base Revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: verifier
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Checked-out Revisions
        run: |
          HEAD_ACTUAL=$(git -C head rev-parse HEAD)
          if [ "$HEAD_ACTUAL" != "${{ github.event.pull_request.head.sha }}" ]; then
            echo "error: head checkout SHA mismatch: expected ${{ github.event.pull_request.head.sha }}, got $HEAD_ACTUAL" >&2
            exit 1
          fi

          BASE_ACTUAL=$(git -C verifier rev-parse HEAD)
          if [ "$BASE_ACTUAL" != "${{ github.event.pull_request.base.sha }}" ]; then
            echo "error: base checkout SHA mismatch: expected ${{ github.event.pull_request.base.sha }}, got $BASE_ACTUAL" >&2
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          if [ -f verifier/requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r verifier/requirements.txt
          elif [ -f head/requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r head/requirements.txt
          fi

      - name: Run Commitment Deadline Validation
        run: |
          set -e
          SERVER_UTC=$(date -u +%Y-%m-%dT%H:%M:%S.%6NZ)
          ATTESTATION_PATH="${{ runner.temp }}/attestation-${{ github.run_id }}.json"

          # Check if base revision has Stage 5B4 verifier
          if [ -f "verifier/scripts/manage_win_either_half_campaign_commitment.py" ]; then
            echo "Base revision contains Stage 5B4 verifier."

            COMMITMENT_CHANGES=$(git -C head diff --name-only \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" \
              -- artifacts/research-commitments/win-either-half/)

            TOOLING_CHANGES=$(git -C head diff --name-only \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" \
              -- \
              .github/workflows/validate-win-either-half-campaign-commitment.yml \
              artifacts/research-protocols/win-either-half-campaign-commitment-v1.json \
              domain/win_either_half_campaign_commitment.py \
              scripts/manage_win_either_half_campaign_commitment.py \
              docs/win_either_half_campaign_commitment.md \
              tests/test_win_either_half_campaign_commitment.py)

            if [ -n "$COMMITMENT_CHANGES" ] && [ -n "$TOOLING_CHANGES" ]; then
              echo "error: Separation-of-duties violation. Campaign commitment declarations cannot edit Stage 5B4 verifier/workflow/protocol files in the same pull request." >&2
              exit 1
            fi

            if [ -n "$COMMITMENT_CHANGES" ]; then
              echo "Executing base-revision declaration verifier..."

              PYTHONPATH=verifier python -m \
                scripts.manage_win_either_half_campaign_commitment \
                --validate-git-diff \
                --repository-root head \
                --base-sha "${{ github.event.pull_request.base.sha }}" \
                --head-sha "${{ github.event.pull_request.head.sha }}" \
                --server-observed-at "$SERVER_UTC" \
                --github-run-id "${{ github.run_id }}" \
                --github-run-attempt "${{ github.run_attempt }}" \
                --github-event-name pull_request \
                --attestation-output "$ATTESTATION_PATH" \
                | tee output_summary.md

              cat output_summary.md >> "$GITHUB_STEP_SUMMARY"
              echo "VALIDATION_MODE=DECLARATION_VALIDATION" >> "$GITHUB_ENV"
              echo "ATTESTATION_CREATED=true" >> "$GITHUB_ENV"
              echo "ATTESTATION_PATH=$ATTESTATION_PATH" >> "$GITHUB_ENV"

            elif [ -n "$TOOLING_CHANGES" ]; then
              echo "Executing Stage 5B4 tooling-only validation..."

              (
                cd head
                PYTHONPATH=. python -m pytest \
                  tests/test_win_either_half_campaign_commitment.py -q

                python -m compileall -q \
                  domain/win_either_half_campaign_commitment.py \
                  scripts/manage_win_either_half_campaign_commitment.py \
                  tests/test_win_either_half_campaign_commitment.py
              )

              {
                echo "### Stage 5B4 Tooling-Only Validation"
                echo
                echo "**Status:** \`TOOLING_ONLY_VALIDATION\`"
                echo
                echo "Stage 5B4 focused tests and syntax validation passed."
                echo "No campaign commitment declarations changed."
                echo "No timing qualification or attestation was created."
                echo "Markets and all authorization remain disabled."
              } >> "$GITHUB_STEP_SUMMARY"

              echo "VALIDATION_MODE=TOOLING_ONLY_VALIDATION" >> "$GITHUB_ENV"
              echo "ATTESTATION_CREATED=false" >> "$GITHUB_ENV"

            else
              echo "error: Stage 5B4 workflow was triggered but no commitment or tooling changes were found." >&2
              exit 1
            fi

          else
            echo "Base revision does not contain Stage 5B4 verifier (Bootstrap PR mode)."

            # Fail if any declarations exist under commitment root in bootstrap PR
            COMMITMENT_CHANGES=$(git -C head diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- artifacts/research-commitments/win-either-half/)
            if [ -n "$COMMITMENT_CHANGES" ]; then
              echo "error: Bootstrap PR cannot include real campaign declarations before base verifier is merged." >&2
              exit 1
            fi

            (
              cd head
              PYTHONPATH=. python -m pytest tests/test_win_either_half_campaign_commitment.py -q
            )

            echo "### Stage 5B4 Tooling Bootstrap" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** \`BOOTSTRAP_TOOLING_ONLY\`" >> $GITHUB_STEP_SUMMARY
            echo "Base revision does not yet contain Stage 5B4 verifier. Stage 5B4 test suite passed cleanly. Zero commitment declarations were added." >> $GITHUB_STEP_SUMMARY
            echo "ATTESTATION_CREATED=false" >> $GITHUB_ENV
          fi

      - name: Upload Attestation Artifact
        if: env.ATTESTATION_CREATED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: win-either-half-campaign-commitment-${{ github.run_id }}
          path: ${{ env.ATTESTATION_PATH }}
          retention-days: 90
          if-no-files-found: error
