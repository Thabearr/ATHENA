name: Build Historical Football Warehouse

on:
  workflow_dispatch:
    inputs:
      include_statsbomb:
        description: "Enrich supported matches with StatsBomb events and lineups"
        required: true
        default: true
        type: boolean
      start_year:
        description: "Football-Data.co.uk first season start year"
        required: true
        default: "1993"
        type: string
      end_year:
        description: "Football-Data.co.uk last season start year"
        required: true
        default: "2026"
        type: string

permissions:
  contents: read

jobs:
  build-history:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Athena
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install historical-data dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pandas pyarrow pytest

      - name: Run warehouse tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_historical_warehouse.py

      - name: Import global top-flight and international backbone
        run: python scripts/import_global_football_backbone.py

      - name: Import internationals, World Cup, Football-Data and OpenFootball
        run: >-
          python scripts/build_historical_warehouse.py
          --all
          --start-year ${{ inputs.start_year }}
          --end-year ${{ inputs.end_year }}
          --audit

      - name: Enrich StatsBomb open-data matches
        if: ${{ inputs.include_statsbomb }}
        run: python scripts/enrich_statsbomb_history.py

      - name: Export CSV tables and final audit
        run: >-
          python scripts/build_historical_warehouse.py
          --export-csv data/history_exports
          --audit

      - name: SQLite integrity check
        run: |
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect('database/athena_history.db')
          result = db.execute('PRAGMA integrity_check').fetchone()[0]
          print('SQLite integrity_check:', result)
          if result != 'ok':
              raise SystemExit(1)
          PY

      - name: Package CSV exports
        run: tar -czf athena-history-csv.tar.gz data/history_exports

      - name: Upload SQLite warehouse
        uses: actions/upload-artifact@v4
        with:
          name: athena-history-sqlite
          path: database/athena_history.db
          compression-level: 6
          retention-days: 30

      - name: Upload CSV warehouse
        uses: actions/upload-artifact@v4
        with:
          name: athena-history-csv
          path: athena-history-csv.tar.gz
          compression-level: 0
          retention-days: 30
