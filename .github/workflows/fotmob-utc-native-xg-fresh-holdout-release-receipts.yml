name: Mirror FotMob Fresh-Holdout Release Receipts

on:
  workflow_run:
    workflows:
      - FotMob UTC-Native xG Fresh-Holdout Collection Runner
    types:
      - completed

concurrency:
  group: fotmob-fresh-holdout-release-receipt-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  mirror:
    name: verify archive and mirror canonical receipt
    if: ${{ github.event.workflow_run.event == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout current reviewed main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify reviewed mirror implementation blob
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git hash-object scripts/mirror_fotmob_fresh_holdout_release_receipt.py)"
          expected="b311f3136c6b06dfbe40babd66a2fb9fdf18fedf"
          test "${actual}" = "${expected}" || {
            echo "FATAL: release-receipt mirror implementation blob changed"
            exit 1
          }

      - name: Verify release archive and mirror canonical receipt
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/mirror_fotmob_fresh_holdout_release_receipt.py \
            --repository "${GITHUB_REPOSITORY}" \
            --run-id "${SOURCE_RUN_ID}"
