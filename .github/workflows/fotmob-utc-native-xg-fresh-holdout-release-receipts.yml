name: Mirror FotMob Fresh-Holdout Release Receipts

on:
  workflow_run:
    workflows:
      - FotMob UTC-Native xG Fresh-Holdout Collection Runner
    types:
      - completed

concurrency:
  group: fotmob-fresh-holdout-release-receipt-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  mirror:
    name: verify archive or proven no-acquisition disposition
    if: >-
      ${{
        (github.event.workflow_run.event == 'schedule' ||
         github.event.workflow_run.event == 'workflow_dispatch') &&
        github.event.workflow_run.conclusion == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout current reviewed main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify reviewed mirror implementation blobs
        shell: bash
        run: |
          set -euo pipefail
          mirror_actual="$(git hash-object scripts/mirror_fotmob_fresh_holdout_release_receipt.py)"
          mirror_expected="ddabb6ae83cbe6c81c9264119a121a54715df960"
          test "${mirror_actual}" = "${mirror_expected}" || {
            echo "FATAL: release-receipt mirror implementation blob changed"
            exit 1
          }
          recovery_actual="$(git hash-object domain/fotmob_utc_native_expected_goals_fresh_holdout_schedule_recovery.py)"
          recovery_expected="e24929813e5666c5477aa8906cf36cc7ef6ffcc4"
          test "${recovery_actual}" = "${recovery_expected}" || {
            echo "FATAL: reviewed no-acquisition proof implementation blob changed"
            exit 1
          }
          continuity_actual="$(git hash-object domain/fotmob_fresh_holdout_continuity.py)"
          continuity_expected="3f42e9f57af96d489cbc59db9c5c9df65750a5f4"
          test "${continuity_actual}" = "${continuity_expected}" || {
            echo "FATAL: reviewed prospective continuity provenance implementation blob changed"
            exit 1
          }
          transport_actual="$(git hash-object scripts/run_fotmob_fresh_holdout_release_receipt_mirror.py)"
          transport_expected="57839269ff3968b38445112c16f5b3ab749eb997"
          test "${transport_actual}" = "${transport_expected}" || {
            echo "FATAL: release-receipt Actions transport/compatibility blob changed"
            exit 1
          }

      - name: Verify release archive or proven no-acquisition disposition
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.run_fotmob_fresh_holdout_release_receipt_mirror \
            --repository "${GITHUB_REPOSITORY}" \
            --run-id "${SOURCE_RUN_ID}"
