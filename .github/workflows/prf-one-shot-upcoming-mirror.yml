name: PR F one-shot mirror proven SportyBet upcoming discovery

on:
  push:
    branches:
      - feat/prf-shadow-live-all-market-field-proof
    paths:
      - .github/workflows/prf-one-shot-upcoming-mirror.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR F branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/prf-shadow-live-all-market-field-proof
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply narrow PR F upcoming adapter
        run: PYTHONPATH=. python .github/prf_apply_upcoming_mirror.py

      - name: Verify targeted Shadow boundaries
        run: |
          python -m py_compile \
            domain/current_shadow_sportybet_upcoming_reconciliation.py \
            domain/_current_shadow_quote_binding.py \
            domain/current_shadow_all_market_runner.py
          python -m pytest -q \
            tests/test_current_shadow_sportybet_upcoming_reconciliation.py \
            tests/test_current_shadow_all_market_runner.py \
            tests/test_current_shadow_all_market_live_field_proof.py \
            tests/test_current_shadow_all_market_price_all_router.py

      - name: Commit final self-cleaning patch
        run: |
          test ! -e .github/prf_apply_upcoming_mirror.py
          test ! -e .github/workflows/prf-one-shot-upcoming-mirror.yml
          git config user.name "ATHENA PR-F Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Mirror proven SportyBet upcoming discovery into PR F Shadow"
          git push origin HEAD:feat/prf-shadow-live-all-market-field-proof
