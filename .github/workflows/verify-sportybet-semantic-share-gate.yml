name: Verify SportyBet semantic share gate

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/verify-sportybet-semantic-share-gate.yml"
      - "scripts/sportybet_semantic_share_bridge.py"
      - "tests/test_sportybet_semantic_share_bridge.py"
      - "docs/sportybet_semantic_share_gate.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sportybet-semantic-share-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: deterministic semantic-to-native fail-closed tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install focused test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Verify semantic share gate
        run: |
          python -m pytest -q tests/test_sportybet_semantic_share_bridge.py
