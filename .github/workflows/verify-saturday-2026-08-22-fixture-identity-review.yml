name: Verify Saturday 2026-08-22 Fixture Identity Review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.event.pull_request.number == 201 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'evidence/saturday-2026-08-22-fixture-identity-review'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read

    steps:
      - name: Validate exact PR and frozen PR199 source evidence
        id: guard
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr || pr.number !== 201) {
              core.setFailed('Verification is bound only to PR #201.');
              return;
            }
            if (pr.base.ref !== 'main' || pr.base.sha !== '5a77c55b939ac447f8409b945a576d5a9ad3b26a') {
              core.setFailed(`PR base ${pr.base.ref}@${pr.base.sha} differs from frozen post-PR200 main.`);
              return;
            }
            if (
              pr.head.repo.full_name !== context.repo.owner + '/' + context.repo.repo ||
              pr.head.ref !== 'evidence/saturday-2026-08-22-fixture-identity-review'
            ) {
              core.setFailed('PR head repository/branch mismatch.');
              return;
            }
            const { data: artifact } = await github.rest.actions.getArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: 9437181220,
            });
            if (
              artifact.id !== 9437181220 ||
              artifact.name !== 'saturday-2026-08-22-fixture-universe-evidence' ||
              artifact.expired ||
              artifact.digest !== 'sha256:360aac588f049fe6b0437c43e060b317edd12aaf4672db93ebe2fca42de00589' ||
              !artifact.workflow_run ||
              artifact.workflow_run.id !== 32455713912 ||
              artifact.workflow_run.head_sha !== 'b879b2140d0bc3fb64fa8fec4c73c735240a3b41'
            ) {
              core.setFailed('Frozen PR199 source artifact identity/provenance mismatch.');
              return;
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: 32455713912,
            });
            if (
              run.status !== 'completed' || run.conclusion !== 'success' ||
              run.event !== 'pull_request' ||
              run.head_sha !== 'b879b2140d0bc3fb64fa8fec4c73c735240a3b41' ||
              run.name !== 'Capture Saturday 2026-08-22 FotMob Fixture Universe'
            ) {
              core.setFailed('Frozen PR199 capture run is not exact successful evidence.');
              return;
            }
            core.setOutput('head_sha', pr.head.sha);

      - name: Check out exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.guard.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout and frozen base ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.guard.outputs.head_sha }}"
          git merge-base --is-ancestor 5a77c55b939ac447f8409b945a576d5a9ad3b26a HEAD
          test -z "$(git status --short --untracked-files=no)"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install frozen repository dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run focused explicit-review test
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_saturday_2026_08_22_fixture_identity_review.py

      - name: Download exact PR199 Saturday source artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 9437181220
          path: source-artifact
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32455713912

      - name: Replay exact 50-fixture explicit identity review
        id: replay
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_saturday_2026_08_22_fixture_identity_review.py \
            --source-artifact-directory source-artifact \
            --decision-ledger evidence/saturday_2026_08_22_fixture_identity_review_decisions.json \
            --output-directory saturday-fixture-identity-review-artifact \
            | tee fixture-identity-review-result.txt
          result="$(tail -n 1 fixture-identity-review-result.txt)"
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('fixture-identity-review-result.txt').read_text().splitlines()[-1])
          assert value['result'] == 'SATURDAY_FIXTURE_IDENTITY_REVIEW_VERIFIED_EXPLICIT'
          assert value['approved_identity_count'] == 50
          assert value['unreviewed_identity_count'] == 620
          PY
          echo "result=${result}" >> "${GITHUB_OUTPUT}"

      - name: Verify explicit-review authority remains narrow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('saturday-fixture-identity-review-artifact/fixture-identity-review-receipt.json').read_text())
          assert receipt['repository_head_sha'] == '${{ steps.guard.outputs.head_sha }}'
          assert receipt['candidate_count'] == 670
          assert receipt['explicit_decision_count'] == 50
          assert receipt['approved_identity_count'] == 50
          assert receipt['rejected_identity_count'] == 0
          assert receipt['unreviewed_identity_count'] == 620
          assert receipt['blocked_candidate_count'] == 0
          assert receipt['explicit_review_completed'] is True
          assert receipt['automatic_review_performed'] is False
          assert receipt['fixture_catalog_admission_performed'] is False
          assert receipt['fixture_intelligence_performed'] is False
          assert receipt['model_probability_performed'] is False
          assert receipt['sportybet_reconciliation_performed'] is False
          assert receipt['fresh_price_performed'] is False
          assert receipt['selection_performed'] is False
          assert receipt['bet_decision_performed'] is False
          assert receipt['safety']
          assert not any(receipt['safety'].values())
          PY

      - name: Upload exact explicit fixture-identity review proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: saturday-2026-08-22-fixture-identity-review-verification
          path: saturday-fixture-identity-review-artifact/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish review summary
        if: always()
        shell: bash
        env:
          REPLAY_RESULT: ${{ steps.replay.outputs.result }}
        run: |
          set -euo pipefail
          {
            echo '## Saturday 2026-08-22 explicit fixture-identity review'
            echo
            echo "- exact PR head: ${{ steps.guard.outputs.head_sha }}"
            echo "- result: ${REPLAY_RESULT:-REPLAY_DID_NOT_RETURN_RESULT}"
            echo '- source candidates: 670'
            echo '- explicit identity approvals: 50'
            echo '- remaining unreviewed: 620'
            echo '- automatic review: false'
            echo '- Fixture Catalog admission: false'
            echo '- model/probability: false'
            echo '- SportyBet pricing/selection: false'
            echo '- BET: false'
          } >> "${GITHUB_STEP_SUMMARY}"
