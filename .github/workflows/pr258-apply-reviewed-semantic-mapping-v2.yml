name: PR258 Apply Reviewed Semantic Mapping V2

on:
  push:
    branches:
      - feature/pr258-research-shadow-sportybet-field-trial

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pr258-research-shadow-sportybet-field-trial
          fetch-depth: 0

      - name: Apply exact reviewed research-only semantic mapping
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 anchor, found {count}")
              return text.replace(old, new, 1)

          def replace_between(text, start, end, new, label):
              a = text.find(start)
              b = text.find(end, a + len(start)) if a >= 0 else -1
              if a < 0 or b < 0:
                  raise SystemExit(f"{label}: boundary not found")
              if text.find(start, a + 1) >= 0:
                  raise SystemExit(f"{label}: duplicate start boundary")
              return text[:a] + new + "\n\n" + text[b:]

          domain_path = "domain/current_shadow_sportybet_field_trial.py"
          d = read(domain_path)
          d = one(
              d,
              "reconstructs the exact retained current SportyBet event-detail inventory, prices\nonly exact PR252-mapped Total Goals half-line partitions, and applies the frozen\nRouter/Portfolio policy constants for research evaluation.\n",
              "reconstructs the exact retained current SportyBet event-detail inventory, prices\nonly exact reviewed Total Goals half-line partitions, and applies the frozen\nRouter/Portfolio policy constants for research evaluation. PR252 exact semantics\nremain authoritative; one PR258 research-only review may additionally reconcile\nthe current provider's market-18 display-label rename from ``Total Goals`` to\n``Over/Under`` when native IDs, specifier, outcome labels and line semantics all\nremain exact.\n",
              "domain docstring",
          )
          d = one(
              d,
              'MARKET_POLICY_ID = "EXACT_PR252_MAPPED_TOTAL_GOALS_HALF_LINE_PARTITIONS_ONLY_V2"\n',
              'REVIEWED_TOTAL_GOALS_PROVIDER_MARKET_ID = "18"\nREVIEWED_TOTAL_GOALS_SOURCE_LABEL = "Total Goals"\nREVIEWED_TOTAL_GOALS_CURRENT_LABEL = "Over/Under"\nMARKET_LABEL_RENAME_POLICY_ID = (\n    "PR258_REVIEWED_MARKET18_TOTAL_GOALS_TO_OVER_UNDER_"\n    "EXACT_NATIVE_ID_SPECIFIER_OUTCOME_LABEL_V1"\n)\nMARKET_POLICY_ID = (\n    "EXACT_PR252_TOTAL_GOALS_OR_REVIEWED_PR258_MARKET18_LABEL_RENAME_HALF_LINES_V3"\n)\n',
              "market policy constants",
          )
          d = one(
              d,
              '        if self.provider_market_name != "Total Goals":\n            raise CurrentShadowSportyBetFieldTrialError(\n                "research opportunity escaped exact Total Goals market label"\n            )\n',
              '        if self.provider_market_name not in {\n            REVIEWED_TOTAL_GOALS_SOURCE_LABEL,\n            REVIEWED_TOTAL_GOALS_CURRENT_LABEL,\n        }:\n            raise CurrentShadowSportyBetFieldTrialError(\n                "research opportunity escaped reviewed Total Goals provider labels"\n            )\n        if (\n            self.provider_market_name == REVIEWED_TOTAL_GOALS_CURRENT_LABEL\n            and self.provider_market_id != REVIEWED_TOTAL_GOALS_PROVIDER_MARKET_ID\n        ):\n            raise CurrentShadowSportyBetFieldTrialError(\n                "current Over/Under label is reviewed only for exact provider market 18"\n            )\n',
              "opportunity provider label guard",
          )

          mapping_block = '''@dataclasses.dataclass(frozen=True)
          class _ResearchCurrentTotalGoalsMapping:
              provider_market_id: str
              provider_market_name: str
              provider_specifier: str
              provider_outcome_id: str
              provider_outcome_name: str
              canonical_market_id: MarketId
              canonical_outcome_id: OutcomeId
              canonical_line: float
              source_mapping_row_sha256: str
              current_inventory_sha256: str
              mapping_basis: str

              def __post_init__(self) -> None:
                  _provider_id(self.provider_market_id, "research mapped provider_market_id")
                  _provider_id(self.provider_outcome_id, "research mapped provider_outcome_id")
                  _exact_text(self.provider_market_name, "research mapped provider_market_name")
                  _exact_text(self.provider_outcome_name, "research mapped provider_outcome_name")
                  _strict_sha(self.source_mapping_row_sha256, "source_mapping_row_sha256")
                  _strict_sha(self.current_inventory_sha256, "current_inventory_sha256")
                  if self.canonical_market_id is not MarketId.TOTAL_GOALS:
                      raise CurrentShadowSportyBetFieldTrialError(
                          "research current mapping escaped Total Goals"
                      )
                  if self.canonical_outcome_id not in {OutcomeId.OVER, OutcomeId.UNDER}:
                      raise CurrentShadowSportyBetFieldTrialError(
                          "research current Total Goals mapping has invalid outcome"
                      )
                  line = _finite(self.canonical_line, "research mapped canonical total line")
                  if line < 0 or not _half_line(line):
                      raise CurrentShadowSportyBetFieldTrialError(
                          "research current Total Goals mapping requires exact half line"
                      )
                  match = _TOTAL_SPECIFIER_RE.fullmatch(self.provider_specifier)
                  if match is None or not math.isclose(
                      float(match.group(1)), line, rel_tol=0.0, abs_tol=1e-12
                  ):
                      raise CurrentShadowSportyBetFieldTrialError(
                          "research current Total Goals mapping line/specifier differs"
                      )
                  expected_outcome = (
                      f"Over {line:g}"
                      if self.canonical_outcome_id is OutcomeId.OVER
                      else f"Under {line:g}"
                  )
                  if self.provider_outcome_name != expected_outcome:
                      raise CurrentShadowSportyBetFieldTrialError(
                          "research current Total Goals mapping outcome label differs"
                      )
                  if self.mapping_basis == "PR252_EXACT_REVIEWED_SEMANTICS":
                      if self.provider_market_name != REVIEWED_TOTAL_GOALS_SOURCE_LABEL:
                          raise CurrentShadowSportyBetFieldTrialError(
                              "exact PR252 Total Goals row changed provider label"
                          )
                  elif self.mapping_basis == MARKET_LABEL_RENAME_POLICY_ID:
                      if (
                          self.provider_market_id != REVIEWED_TOTAL_GOALS_PROVIDER_MARKET_ID
                          or self.provider_market_name != REVIEWED_TOTAL_GOALS_CURRENT_LABEL
                      ):
                          raise CurrentShadowSportyBetFieldTrialError(
                              "reviewed current market-label rename escaped exact market-18 rule"
                          )
                  else:
                      raise CurrentShadowSportyBetFieldTrialError(
                          "research current mapping basis is unreviewed"
                      )
                  object.__setattr__(self, "canonical_line", line)

              def to_dict(self) -> dict[str, Any]:
                  return {
                      "provider_market_id": self.provider_market_id,
                      "provider_market_name": self.provider_market_name,
                      "provider_specifier": self.provider_specifier,
                      "provider_outcome_id": self.provider_outcome_id,
                      "provider_outcome_name": self.provider_outcome_name,
                      "canonical_market_id": self.canonical_market_id.value,
                      "canonical_outcome_id": self.canonical_outcome_id.value,
                      "canonical_line": self.canonical_line,
                      "source_mapping_row_sha256": self.source_mapping_row_sha256,
                      "current_inventory_sha256": self.current_inventory_sha256,
                      "mapping_basis": self.mapping_basis,
                  }


          def _reviewed_total_goals_label_rename_rows(
              mapping: current_mapping.CurrentDirectProviderCanonicalMarketMappingRebind,
              inventory: live.SportyBetLiveEventQuoteInventory,
          ) -> tuple[_ResearchCurrentTotalGoalsMapping, ...]:
              if inventory.canonical_sha256 != mapping.current_inventory_sha256:
                  raise CurrentShadowSportyBetFieldTrialError(
                      "label-rename review is not bound to the PR252 current inventory"
                  )
              native_index = {
                  (item.market_id, item.specifier, item.outcome_id): item
                  for item in inventory.selections
              }
              if len(native_index) != len(inventory.selections):
                  raise CurrentShadowSportyBetFieldTrialError(
                      "current inventory contains duplicate provider-native selection identity"
                  )
              rows: list[_ResearchCurrentTotalGoalsMapping] = []
              for audit in mapping.mapping_audits:
                  if (
                      audit.disposition
                      is not current_mapping.RebindAuditDisposition.CURRENT_PROVIDER_LABEL_DRIFT_REJECTED
                      or audit.provider_market_id != REVIEWED_TOTAL_GOALS_PROVIDER_MARKET_ID
                      or audit.reviewed_provider_market_name != REVIEWED_TOTAL_GOALS_SOURCE_LABEL
                      or audit.current_provider_market_name != REVIEWED_TOTAL_GOALS_CURRENT_LABEL
                      or audit.current_provider_outcome_name != audit.reviewed_provider_outcome_name
                      or audit.provider_specifier is None
                      or audit.canonical_market_id is not MarketId.TOTAL_GOALS
                      or audit.canonical_outcome_id not in {OutcomeId.OVER, OutcomeId.UNDER}
                      or audit.canonical_line is None
                  ):
                      continue
                  line = _finite(audit.canonical_line, "reviewed renamed canonical total line")
                  if line < 0 or not _half_line(line):
                      continue
                  selected = native_index.get(
                      (audit.provider_market_id, audit.provider_specifier, audit.provider_outcome_id)
                  )
                  if (
                      selected is None
                      or selected.market_name != REVIEWED_TOTAL_GOALS_CURRENT_LABEL
                      or selected.outcome_name != audit.reviewed_provider_outcome_name
                      or selected.bookable is not True
                  ):
                      continue
                  rows.append(
                      _ResearchCurrentTotalGoalsMapping(
                          provider_market_id=audit.provider_market_id,
                          provider_market_name=selected.market_name,
                          provider_specifier=audit.provider_specifier,
                          provider_outcome_id=audit.provider_outcome_id,
                          provider_outcome_name=selected.outcome_name,
                          canonical_market_id=audit.canonical_market_id,
                          canonical_outcome_id=audit.canonical_outcome_id,
                          canonical_line=line,
                          source_mapping_row_sha256=audit.source_mapping_row_sha256,
                          current_inventory_sha256=inventory.canonical_sha256,
                          mapping_basis=MARKET_LABEL_RENAME_POLICY_ID,
                      )
                  )
              return tuple(rows)


          def _mapped_total_partitions(
              mapping: current_mapping.CurrentDirectProviderCanonicalMarketMappingRebind,
              inventory: live.SportyBetLiveEventQuoteInventory,
          ) -> tuple[
              tuple[_ResearchCurrentTotalGoalsMapping, _ResearchCurrentTotalGoalsMapping],
              ...,
          ]:
              grouped: dict[
                  tuple[str, str, float],
                  dict[OutcomeId, _ResearchCurrentTotalGoalsMapping],
              ] = {}
              rows: list[_ResearchCurrentTotalGoalsMapping] = []
              for row in mapping.mapped_selections:
                  if row.canonical_market_id is not MarketId.TOTAL_GOALS:
                      continue
                  if (
                      row.canonical_line is None
                      or row.provider_specifier is None
                      or row.current_bookable_observed is not True
                      or row.bookmaker_equivalence_authorized is not True
                      or row.provider_market_name != REVIEWED_TOTAL_GOALS_SOURCE_LABEL
                  ):
                      continue
                  line = _finite(row.canonical_line, "mapped canonical total line")
                  if line < 0 or not _half_line(line):
                      continue
                  match = _TOTAL_SPECIFIER_RE.fullmatch(row.provider_specifier)
                  if match is None or not math.isclose(
                      float(match.group(1)), line, rel_tol=0.0, abs_tol=1e-12
                  ):
                      continue
                  if row.canonical_outcome_id not in {OutcomeId.OVER, OutcomeId.UNDER}:
                      continue
                  rows.append(
                      _ResearchCurrentTotalGoalsMapping(
                          provider_market_id=row.provider_market_id,
                          provider_market_name=row.provider_market_name,
                          provider_specifier=row.provider_specifier,
                          provider_outcome_id=row.provider_outcome_id,
                          provider_outcome_name=row.provider_outcome_name,
                          canonical_market_id=row.canonical_market_id,
                          canonical_outcome_id=row.canonical_outcome_id,
                          canonical_line=line,
                          source_mapping_row_sha256=row.source_mapping_row_sha256,
                          current_inventory_sha256=row.current_inventory_sha256,
                          mapping_basis="PR252_EXACT_REVIEWED_SEMANTICS",
                      )
                  )
              rows.extend(_reviewed_total_goals_label_rename_rows(mapping, inventory))
              for row in rows:
                  key = (row.provider_market_id, row.provider_specifier, row.canonical_line)
                  bucket = grouped.setdefault(key, {})
                  if row.canonical_outcome_id in bucket:
                      raise CurrentShadowSportyBetFieldTrialError(
                          "reviewed current mapping contains duplicate canonical total partition side"
                      )
                  bucket[row.canonical_outcome_id] = row
              pairs = []
              for key in sorted(grouped):
                  sides = grouped[key]
                  if set(sides) == {OutcomeId.OVER, OutcomeId.UNDER}:
                      pairs.append((sides[OutcomeId.OVER], sides[OutcomeId.UNDER]))
              return tuple(pairs)
          '''
          d = replace_between(
              d,
              "def _mapped_total_partitions(\n",
              "def build_source_bound_total_goals_research_decision(\n",
              mapping_block,
              "mapped total partitions",
          )
          d = one(
              d,
              "    for over_map, under_map in _mapped_total_partitions(mapping):\n",
              "    for over_map, under_map in _mapped_total_partitions(mapping, inventory):\n",
              "partition call",
          )
          d = d.replace(
              "exact PR252 mapped selection is absent from retained current inventory",
              "reviewed mapped selection is absent from retained current inventory",
          ).replace(
              "current provider selection differs from exact PR252 mapped semantics",
              "current provider selection differs from reviewed mapped semantics",
          )
          write(domain_path, d)

          test_path = "tests/test_current_shadow_sportybet_field_trial.py"
          t = read(test_path)
          start = t.index("def _selection(\n")
          end = t.index("def _source_row(\n", start)
          chunk = t[start:end]
          chunk = one(
              chunk,
              '    market_id: str = "18",\n):\n',
              '    market_id: str = "18",\n    market_name: str = "Total Goals",\n):\n',
              "selection signature",
          )
          chunk = one(
              chunk,
              '            market_name="Total Goals",\n',
              '            market_name=market_name,\n',
              "selection market name",
          )
          t = t[:start] + chunk + t[end:]

          start = t.index("def _current_mapping(\n")
          end = t.index("def _decision(\n", start)
          chunk = t[start:end]
          chunk = one(
              chunk,
              "    include_unreviewed_line: bool = False,\n):\n",
              "    include_unreviewed_line: bool = False,\n    market_id: str = \"18\",\n    current_market_name: str = \"Total Goals\",\n):\n",
              "current mapping signature",
          )
          chunk = one(chunk, '_source_row(line=line, outcome_id="O"),', '_source_row(line=line, outcome_id="O", market_id=market_id),', "source over market id")
          chunk = one(chunk, '_source_row(line=line, outcome_id="U"),', '_source_row(line=line, outcome_id="U", market_id=market_id),', "source under market id")
          chunk = one(chunk, '_selection(line=line, outcome_id="O", odds=6.0),', '_selection(line=line, outcome_id="O", odds=6.0, market_id=market_id, market_name=current_market_name),', "current over selection")
          chunk = one(chunk, '_selection(line=line, outcome_id="U", odds=1.25),', '_selection(line=line, outcome_id="U", odds=1.25, market_id=market_id, market_name=current_market_name),', "current under selection")
          t = t[:start] + chunk + t[end:]

          start = t.index("def _decision(\n")
          end = t.index("def test_source_bound_research_lane_never_claims_production_or_bet_authority(\n", start)
          chunk = t[start:end]
          chunk = one(
              chunk,
              "    decision_evaluation: dt.datetime | None = None,\n):\n",
              "    decision_evaluation: dt.datetime | None = None,\n    market_id: str = \"18\",\n    current_market_name: str = \"Total Goals\",\n):\n",
              "decision signature",
          )
          chunk = one(
              chunk,
              "        mapping_evaluation=mapping_evaluation,\n    )\n",
              "        mapping_evaluation=mapping_evaluation,\n        market_id=market_id,\n        current_market_name=current_market_name,\n    )\n",
              "decision current mapping args",
          )
          t = t[:start] + chunk + t[end:]

          anchor = "def test_unreviewed_provider_total_line_is_never_generalized_into_research_surface(\n"
          addition = '''def test_reviewed_market18_total_goals_to_over_under_label_rename_is_source_bound(
              tmp_path,
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              _history, mapping, inventory, _evaluation, decision = _decision(
                  tmp_path,
                  monkeypatch,
                  current_market_name="Over/Under",
              )
              assert mapping.mapped_selection_count == 0
              assert mapping.current_inventory_sha256 == inventory.canonical_sha256
              assert {
                  audit.disposition for audit in mapping.mapping_audits
              } == {
                  mapping_helpers.rebind.RebindAuditDisposition.CURRENT_PROVIDER_LABEL_DRIFT_REJECTED
              }
              selected = decision.selected
              assert decision.status == "SELECTED"
              assert selected is not None
              assert selected.provider_market_id == "18"
              assert selected.provider_market_name == "Over/Under"
              assert selected.provider_specifier == "total=6.5"
              assert {item.provider_market_name for item in decision.opportunities} == {"Over/Under"}
              assert {item.provider_market_id for item in decision.opportunities} == {"18"}


          def test_over_under_label_rename_is_not_generalized_to_other_native_market_ids(
              tmp_path,
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              *_prefix, decision = _decision(
                  tmp_path,
                  monkeypatch,
                  market_id="19",
                  current_market_name="Over/Under",
              )
              assert decision.status == "NO_BET"
              assert decision.selected is None
              assert decision.opportunities == ()
              assert decision.decision_reasons == (
                  "NO_EXACT_REVIEWED_TOTAL_GOALS_PARTITION",
              )


          '''
          t = one(t, anchor, addition + anchor, "new field-trial tests")
          write(test_path, t)

          verified_path = "tests/test_current_shadow_sportybet_verified_package.py"
          v = read(verified_path)
          anchor = "def test_tampered_verified_decision_receipt_fails_exact_source_replay(\n"
          addition = '''def test_verified_source_replays_reviewed_current_over_under_label_rename(
              tmp_path,
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              history, mapping, _inventory, evaluation, decision = _decision(
                  tmp_path,
                  monkeypatch,
                  current_market_name="Over/Under",
              )
              assert decision.selected is not None
              assert decision.selected.provider_market_name == "Over/Under"
              source = package.build_verified_research_decision_source(
                  complete_current_history=history,
                  current_mapping_rebind=mapping,
                  evaluation_time=evaluation,
              )
              assert source.decision.to_dict() == decision.to_dict()
              assert (
                  package.verify_verified_research_decision_source(source).to_dict()
                  == source.to_dict()
              )
              verified = package.build_verified_research_shadow_portfolio(
                  (source,),
                  target_size=1,
                  evaluation_time=evaluation,
              )
              assert verified.portfolio.selected_legs
              assert verified.portfolio.selected_legs[0].provider_market_name == "Over/Under"
              assert verified.portfolio.authority["production_selection"] is False
              assert verified.portfolio.to_dict()["wager_placed"] is False


          '''
          v = one(v, anchor, addition + anchor, "verified package rename replay test")
          write(verified_path, v)
          PY

          rm -f .athena/pr258-reviewed-semantic-mapping.patch.part1 \
                .athena/pr258-reviewed-semantic-mapping.patch.part2 \
                .athena/pr258-reviewed-semantic-mapping.patch.part3 \
                .athena/pr258-reviewed-semantic-mapping.patch.part4 \
                .github/workflows/pr258-apply-reviewed-semantic-mapping.yml \
                .github/workflows/pr258-apply-reviewed-semantic-mapping-v2.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          python -m py_compile domain/current_shadow_sportybet_field_trial.py \
              tests/test_current_shadow_sportybet_field_trial.py \
              tests/test_current_shadow_sportybet_verified_package.py
          python -m pytest -q \
              tests/test_current_shadow_sportybet_field_trial.py \
              tests/test_current_shadow_sportybet_verified_package.py
          git commit -m "Review current SportyBet Total Goals label rename"
          git push origin HEAD:feature/pr258-research-shadow-sportybet-field-trial
