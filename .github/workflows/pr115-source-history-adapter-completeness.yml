name: PR115 Source History Adapter Completeness

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/assess_fotmob_source_history_adapter_completeness.py"
      - ".github/workflows/pr115-source-history-adapter-completeness.yml"
      - "domain/fotmob_data_matches_ordinary_ft_finished_score_adapter.py"
      - "domain/fotmob_ordinary_ft_finished_score_source_history_completeness_protocol.py"
      - "domain/fotmob_source_history_elo_initialization_boundary_qualification.py"

permissions:
  contents: read
  actions: read

jobs:
  execute-assessment:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download exact preserved FotMob campaign artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location \
            --retry 3 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Thabearr/ATHENA/actions/artifacts/9249856559/zip" \
            --output /tmp/fotmob-campaign.zip
          test "$(stat -c%s /tmp/fotmob-campaign.zip)" = "61886753"
          echo "7c2fa200efed098bd5fca22fc139af816256c74967b98d8cb2c62fe3e793508f  /tmp/fotmob-campaign.zip" | sha256sum --check --strict

      - name: Execute exact source-history assessment
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/assess_fotmob_source_history_adapter_completeness.py \
            --artifact /tmp/fotmob-campaign.zip \
            --output /tmp/fotmob-source-history-adapter-completeness-assessment-v1.json

      - name: Upload assessment receipt
        uses: actions/upload-artifact@v4
        with:
          name: pr115-source-history-adapter-completeness-${{ github.run_id }}
          path: /tmp/fotmob-source-history-adapter-completeness-assessment-v1.json
          if-no-files-found: error
          retention-days: 30
