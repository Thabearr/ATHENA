name: Probe SportyBet direct 20 markets

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/probe-sportybet-direct-20-markets.yml"
      - "artifacts/research-protocols/saturday-2026-08-22-sportybet-direct-20-market-probe-v1.json"
      - "scripts/sportybet_direct_market_probe.py"
      - "tests/test_sportybet_direct_market_probe.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sportybet-direct-20-markets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: exact anonymous 20-event market probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OUTPUT_DIR: .cache/athena-research/sportybet-direct-20-market-probe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run focused market-probe tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest -q tests/test_sportybet_direct_market_probe.py

      - name: Capture exact live SportyBet Nigeria markets for all 20 targets
        id: probe
        continue-on-error: true
        run: |
          mkdir -p "${OUTPUT_DIR}"
          python scripts/sportybet_direct_market_probe.py \
            --targets artifacts/research-protocols/saturday-2026-08-22-sportybet-direct-20-market-probe-v1.json \
            --output-dir "${OUTPUT_DIR}" \
            --delay-seconds 0.8 | tee "${OUTPUT_DIR}/summary.json"

      - name: Upload exact direct-market evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saturday-2026-08-22-sportybet-direct-20-market-probe
          path: .cache/athena-research/sportybet-direct-20-market-probe
          if-no-files-found: error
          retention-days: 7

      - name: Require all 20 intended markets active
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          echo "probe outcome: ${PROBE_OUTCOME}"
          test "${PROBE_OUTCOME}" = "success"
