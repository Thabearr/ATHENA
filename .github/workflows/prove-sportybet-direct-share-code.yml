name: Offline authorization audit for retained SportyBet share-code proof

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/create-saturday-2026-08-22-sportybet-direct-20-code.yml"
      - ".github/workflows/prove-sportybet-direct-share-code.yml"
      - "artifacts/research-protocols/saturday-2026-08-22-sportybet-direct-one-leg-proof-v1.json"
      - "scripts/sportybet_direct_share_bridge.py"
      - "scripts/audit_core_01d_pr459_live_trigger_incident.py"
      - "tests/test_sportybet_direct_share_bridge.py"
      - "tests/test_core_01d_pr459_live_trigger_incident.py"
      - "tests/test_core_01d_sportybet_current_trigger_authority_b4.py"
  workflow_dispatch:
    inputs:
      validation_mode:
        description: Run offline-only validation; no provider operation is available.
        type: choice
        options:
          - offline_only
        default: offline_only
        required: true

permissions:
  contents: read

concurrency:
  group: sportybet-direct-share-offline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Enforce offline-only manual mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          VALIDATION_MODE: ${{ inputs.validation_mode }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${VALIDATION_MODE}" != "offline_only" ]; then
            echo "Only offline validation is supported; live share-code operations are disabled."
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install focused offline test dependencies
        run: python -m pip install --disable-pip-version-check pytest PyYAML

      - name: Run historical trigger-projection regressions
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python -m pytest -q
          tests/test_core_01d_sportybet_current_trigger_authority_b4.py
          tests/test_core_01d_pr459_live_trigger_incident.py

      - name: Audit both direct-share workflow surfaces
        run: python scripts/audit_core_01d_pr459_live_trigger_incident.py
