name: Prove SportyBet direct share code

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/prove-sportybet-direct-share-code.yml"
      - "artifacts/research-protocols/saturday-2026-08-22-sportybet-direct-one-leg-proof-v1.json"
      - "scripts/sportybet_direct_share_bridge.py"
      - "tests/test_sportybet_direct_share_bridge.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sportybet-direct-share-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    name: one-leg anonymous create-and-load roundtrip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OUTPUT_DIR: .cache/athena-research/sportybet-direct-share-proof

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run focused direct-share tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest -q tests/test_sportybet_direct_share_bridge.py

      - name: Create and round-trip one anonymous SportyBet share code
        id: direct
        continue-on-error: true
        run: |
          python scripts/sportybet_direct_share_bridge.py \
            --selections artifacts/research-protocols/saturday-2026-08-22-sportybet-direct-one-leg-proof-v1.json \
            --output-dir "${OUTPUT_DIR}" | tee "${OUTPUT_DIR}.summary.json"

      - name: Upload exact direct-share evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sportybet-direct-share-code-proof
          path: |
            .cache/athena-research/sportybet-direct-share-proof
            .cache/athena-research/sportybet-direct-share-proof.summary.json
          if-no-files-found: warn
          retention-days: 7

      - name: Require exact round-trip proof
        if: always()
        env:
          DIRECT_OUTCOME: ${{ steps.direct.outcome }}
        run: |
          echo "direct outcome: ${DIRECT_OUTCOME}"
          test "${DIRECT_OUTCOME}" = "success"
