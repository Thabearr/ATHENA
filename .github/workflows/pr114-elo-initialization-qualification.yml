name: PR114 Elo Initialization Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/qualify_fotmob_source_history_elo_initialization_boundary.py"
      - ".github/workflows/pr114-elo-initialization-qualification.yml"
      - "domain/fotmob_source_history_elo_initialization_boundary_protocol.py"
      - "domain/fotmob_source_history_rearrangement_chronology_qualification.py"
      - "domain/historical_model_feature_replay_candidate.py"

permissions:
  contents: write
  actions: read

jobs:
  execute-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download exact preserved FotMob campaign artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location \
            --retry 3 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Thabearr/ATHENA/actions/artifacts/9249856559/zip" \
            --output /tmp/fotmob-campaign.zip
          test "$(stat -c%s /tmp/fotmob-campaign.zip)" = "61886753"
          echo "7c2fa200efed098bd5fca22fc139af816256c74967b98d8cb2c62fe3e793508f  /tmp/fotmob-campaign.zip" | sha256sum --check --strict

      - name: Execute reviewed initialization qualification
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/qualify_fotmob_source_history_elo_initialization_boundary.py \
            --artifact /tmp/fotmob-campaign.zip \
            --football-data-cache /tmp/football-data-uk \
            --output /tmp/fotmob-elo-initialization-qualification-v1.json
          test "$(stat -c%s /tmp/fotmob-elo-initialization-qualification-v1.json)" = "24428"
          echo "fbbec0b858c3e9630d9f4c7dec630012f57811de52d300db3a11b781a719e110  /tmp/fotmob-elo-initialization-qualification-v1.json" | sha256sum --check --strict

      - name: Commit exact durable receipt to PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          CONTENT="$(base64 -w0 /tmp/fotmob-elo-initialization-qualification-v1.json)"
          PAYLOAD="$(jq -n \
            --arg message 'Freeze PR114 Elo initialization qualification receipt' \
            --arg content "$CONTENT" \
            --arg branch "$HEAD_REF" \
            '{message:$message,content:$content,branch:$branch}')"
          curl --fail-with-body --request PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Thabearr/ATHENA/contents/artifacts/research-manifests/fotmob-source-history-elo-initialization-boundary-qualification-v1.json" \
            --data "$PAYLOAD"

      - name: Upload execution receipt
        uses: actions/upload-artifact@v4
        with:
          name: pr114-elo-initialization-qualification-${{ github.run_id }}
          path: /tmp/fotmob-elo-initialization-qualification-v1.json
          if-no-files-found: error
          retention-days: 30
