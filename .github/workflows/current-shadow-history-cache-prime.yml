name: ATHENA Current Shadow history transport cache prime

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read

concurrency:
  group: current-shadow-history-cache-prime
  cancel-in-progress: false

jobs:
  prime:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.number == 276 && github.event.comment.user.login == github.repository_owner && github.event.comment.body == '/athena-shadow-history-cache-prime')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore latest trusted-main durable-history prime artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cache_dir='.cache/athena-research/current-shadow-history-github-binary-cache-v1'
          restored=false
          mapfile -t prime_runs < <(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/current-shadow-history-cache-prime.yml/runs?status=success&per_page=10" \
              --jq '.workflow_runs[] | select(.head_branch == "main") | [.id, .head_sha] | @tsv'
          )
          for run_row in "${prime_runs[@]}"; do
            IFS=$'\t' read -r run_id run_sha <<< "${run_row}"
            if ! [[ "${run_id}" =~ ^[0-9]+$ ]] || ! [[ "${run_sha}" =~ ^[0-9a-f]{40}$ ]]; then
              continue
            fi
            if [ "${run_id}" = "${GITHUB_RUN_ID}" ]; then
              continue
            fi
            rm -rf /tmp/athena-current-shadow-history-prime
            mkdir -p /tmp/athena-current-shadow-history-prime
            if gh run download "${run_id}" \
              --repo "${GITHUB_REPOSITORY}" \
              --name current-shadow-history-cache-prime \
              --dir /tmp/athena-current-shadow-history-prime >/dev/null 2>&1
            then
              if python -m scripts.restore_current_shadow_history_prime_artifact \
                --artifact-dir /tmp/athena-current-shadow-history-prime \
                --cache-dir "${cache_dir}" \
                --expected-prime-commit-sha "${run_sha}"
              then
                echo "Restored verified durable-history prime artifact from trusted main run ${run_id} at ${run_sha}."
                restored=true
                break
              fi
            fi
          done
          if [ "${restored}" != true ]; then
            echo "No valid prior trusted-main durable-history prime artifact was restorable; priming from verified live transport."
          fi

      - name: Prime immutable durable-history GitHub transport cache
        env:
          GH_TOKEN: ${{ github.token }}
          ATHENA_CURRENT_SHADOW_HISTORY_CACHE_DIR: .cache/athena-research/current-shadow-history-github-binary-cache-v1
        run: |
          python -m scripts.prime_current_shadow_history_github_cache \
            --output-dir artifacts/current-shadow-history-cache-prime

      - name: Upload transport-only cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-shadow-history-cache-prime
          path: artifacts/current-shadow-history-cache-prime
          if-no-files-found: error
          retention-days: 30
