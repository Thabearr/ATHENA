name: Execute Reconciled PR69 Primary Time-Basis Evidence Campaign V2

on:
  issue_comment:
    types: [created]

concurrency:
  group: athena-pr69-primary-time-basis-evidence-campaign-v2
  cancel-in-progress: false

jobs:
  execute:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 130 &&
      github.event.comment.user.login == 'Thabearr' &&
      startsWith(github.event.comment.body, '/athena-run-pr69-time-basis-evidence-v2')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Validate reconciled one-shot owner command and current main
        id: guard
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const controlPr = 130;
            const priorControlPr = 128;
            const fixPr = 129;
            const fixMergeSha = '94577458d4b8af59a4e986edb2e4df9c426e21be';
            const priorRunId = '31953949073';
            const priorArtifactId = 9266604353;
            const priorArtifactName = 'pr69-primary-time-basis-evidence-campaign-31953949073';
            const priorArtifactDigest = 'ce87f13cb72a917c0a01e4bbede87e4123d85861d5ee1cd98667bb802d380db7';
            const priorResultPrefix = '<!-- ATHENA_PR69_PRIMARY_TIME_BASIS_EVIDENCE_EXECUTION_RESULT_V1 -->';
            const markerPrefix = '<!-- ATHENA_PR69_PRIMARY_TIME_BASIS_EVIDENCE_EXECUTION_ATTEMPT_V2 -->';

            if (context.issue.number !== controlPr) {
              core.setFailed(`Campaign V2 execution is bound only to PR #${controlPr}.`);
              return;
            }
            const body = String(context.payload.comment.body || '').replace(/\r\n/g, '\n');
            const lines = body.split('\n').map((line) => line.trim()).filter(Boolean);
            if (lines.length !== 3 || lines[0] !== '/athena-run-pr69-time-basis-evidence-v2') {
              core.setFailed('Campaign V2 command framing is invalid.');
              return;
            }
            const shaMatch = /^main-sha: ([0-9a-f]{40})$/.exec(lines[1]);
            if (!shaMatch) {
              core.setFailed('Campaign V2 command must contain one exact lowercase 40-hex main-sha.');
              return;
            }
            if (lines[2] !== 'confirm: EXECUTE_RECONCILED_8_PRIMARY_TIME_BASIS_CAPTURES_V2') {
              core.setFailed('Campaign V2 command is missing the exact reconciliation execution token.');
              return;
            }
            const expectedMain = shaMatch[1];

            const { data: control } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: controlPr,
            });
            if (!control.merged_at || control.state !== 'closed') {
              core.setFailed('Campaign V2 control PR must already be merged and closed.');
              return;
            }
            const { data: fix } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: fixPr,
            });
            if (!fix.merged_at || fix.state !== 'closed' || fix.merge_commit_sha !== fixMergeSha) {
              core.setFailed('PR129 reconciliation fix is not the exact reviewed merged boundary.');
              return;
            }
            const { data: repository } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const { data: ref } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${repository.default_branch}`,
            });
            if (ref.object.sha !== expectedMain) {
              core.setFailed(`Current ${repository.default_branch}=${ref.object.sha} differs from requested ${expectedMain}.`);
              return;
            }

            const priorComments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: priorControlPr,
              per_page: 100,
            });
            const priorResult = priorComments.find((comment) => {
              const text = String(comment.body || '');
              return text.startsWith(priorResultPrefix) &&
                text.includes(`run-id: ${priorRunId}`) &&
                text.includes('state: EXECUTION_NOT_QUALIFIED_REVIEW_ARTIFACT_BEFORE_ANY_RETRY') &&
                text.includes(`artifact-id: ${priorArtifactId}`) &&
                text.includes(`artifact-digest: ${priorArtifactDigest}`) &&
                text.includes('Automatic replay is forbidden.');
            });
            if (!priorResult) {
              core.setFailed('Exact failed V1 result receipt is missing from PR128; reconciliation lineage is incomplete.');
              return;
            }
            const { data: priorArtifact } = await github.rest.actions.getArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: priorArtifactId,
            });
            const expectedArtifactDigest = `sha256:${priorArtifactDigest}`;
            if (
              priorArtifact.expired ||
              priorArtifact.name !== priorArtifactName ||
              priorArtifact.digest !== expectedArtifactDigest ||
              String(priorArtifact.workflow_run?.id || '') !== priorRunId
            ) {
              core.setFailed('Exact preserved V1 evidence artifact is unavailable or has changed identity.');
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: controlPr,
              per_page: 100,
            });
            const priorMarker = comments.find(
              (comment) => String(comment.body || '').startsWith(markerPrefix)
            );
            if (priorMarker) {
              core.setFailed(
                `A prior V2 execution-attempt marker already exists at comment ${priorMarker.id}; ` +
                'automatic replay remains forbidden and requires a new reviewed reconciliation boundary.'
              );
              return;
            }

            const marker = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: controlPr,
              body: [
                markerPrefix,
                'ATHENA reconciled PR69 primary time-basis evidence campaign V2 attempt started.',
                `run-id: ${context.runId}`,
                `main-sha: ${expectedMain}`,
                `command-comment-id: ${context.payload.comment.id}`,
                `reconciled-from-run-id: ${priorRunId}`,
                `reconciled-artifact-id: ${priorArtifactId}`,
                `reconciled-artifact-digest: ${priorArtifactDigest}`,
                `fix-pr: ${fixPr}`,
                `fix-merge-sha: ${fixMergeSha}`,
                'state: ATTEMPT_STARTED_NO_RESULT_YET',
                'Automatic replay is forbidden if this V2 run does not complete cleanly.',
              ].join('\n'),
            });
            core.setOutput('main_sha', expectedMain);
            core.setOutput('marker_comment_id', String(marker.data.id));

      - name: Check out exact authorized main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.guard.outputs.main_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify reconciled runner, protocol, and dependency blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.guard.outputs.main_sha }}"
          git merge-base --is-ancestor 94577458d4b8af59a4e986edb2e4df9c426e21be HEAD
          test "$(git rev-parse HEAD:domain/pr69_primary_time_basis_evidence_acquisition_runner.py)" = "04c30b177c2338848a448972cc0cfad0328e602c"
          test "$(git rev-parse HEAD:scripts/run_pr69_primary_time_basis_evidence_acquisition.py)" = "b44a010d0957ad8d76474aae2f090d52ae5b0e6e"
          test "$(git rev-parse HEAD:domain/pr69_primary_time_basis_evidence_acquisition_protocol.py)" = "df1a25227b8fee5fbbb21dce7f5f8be5d2464954"
          test "$(git rev-parse HEAD:requirements.txt)" = "54d24a55dfa4c73ba3910d333257cfd2e68daf4b"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install frozen repository dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate empty network-free campaign preflight
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_pr69_primary_time_basis_evidence_acquisition.py --status > campaign-preflight-status.json
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path('campaign-preflight-status.json').read_text(encoding='utf-8'))
          expected = {
              'completed_slots': 0,
              'total_slots': 8,
              'complete': False,
              'blocked': False,
              'inflight_attempt': None,
              'network_acquisition_performed_by_this_status_command': False,
              'semantic_extraction_performed': False,
              'historical_effective_scope_qualified': False,
              'pr69_source_local_time_basis_resolved': False,
              'pr80_constructor_input_authorized': False,
              'model_training_authorized': False,
              'probability_inference_authorized': False,
              'pricing_authorized': False,
              'selection_authorized': False,
              'production_approval_authorized': False,
              'bet_authorized': False,
          }
          for key, value in expected.items():
              if status.get(key) != value:
                  raise SystemExit(f'preflight {key}={status.get(key)!r}, expected {value!r}')
          next_slot = status.get('next_slot')
          if not isinstance(next_slot, dict) or next_slot.get('ordinal') != 1:
              raise SystemExit(f'preflight next_slot is not exact slot 1: {next_slot!r}')
          PY

      - name: Record reconciled execution metadata
        env:
          AUTHORIZED_MAIN_SHA: ${{ steps.guard.outputs.main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path
          payload = {
              'schema_version': 2,
              'execution_boundary': 'EXECUTE_RECONCILED_REVIEWED_PR69_PRIMARY_TIME_BASIS_EVIDENCE_ACQUISITION_CAMPAIGN_V2',
              'authorized_main_sha': os.environ['AUTHORIZED_MAIN_SHA'],
              'github_run_id': int(os.environ['GITHUB_RUN_ID']),
              'github_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'reconciled_from_run_id': 31953949073,
              'reconciled_artifact_id': 9266604353,
              'reconciled_artifact_digest': 'ce87f13cb72a917c0a01e4bbede87e4123d85861d5ee1cd98667bb802d380db7',
              'fix_pr': 129,
              'fix_merge_sha': '94577458d4b8af59a4e986edb2e4df9c426e21be',
              'runner_contract_blob_sha': '04c30b177c2338848a448972cc0cfad0328e602c',
              'live_executor_blob_sha': 'b44a010d0957ad8d76474aae2f090d52ae5b0e6e',
              'protocol_blob_sha': 'df1a25227b8fee5fbbb21dce7f5f8be5d2464954',
              'requirements_blob_sha': '54d24a55dfa4c73ba3910d333257cfd2e68daf4b',
              'primary_origin': 'https://www.football-data.co.uk',
              'request_headers': [
                  ['Accept', 'text/plain,text/html;q=0.9,*/*;q=0.1'],
                  ['Accept-Encoding', 'identity'],
                  ['User-Agent', 'ATHENA/1.0'],
              ],
              'successful_capture_target': 8,
              'target_count': 4,
              'slot_labels': ['A', 'B'],
              'pass_order': 'ALL_TARGETS_SLOT_A_IN_FROZEN_ORDER_THEN_ALL_TARGETS_SLOT_B_IN_FROZEN_ORDER',
              'minimum_pair_separation_seconds': 300,
              'maximum_pair_separation_seconds': 3600,
              'minimum_inter_request_seconds': 1,
              'maximum_attempts_per_slot': 3,
              'retry_delays_seconds': [60, 300],
              'capture_root': '.cache/athena-research/pr69-primary-time-basis-evidence',
              'recorded_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'semantic_extraction_authorized': False,
              'pr69_time_basis_resolution_authorized': False,
              'pr80_authorized': False,
              'model_authorized': False,
              'probability_authorized': False,
              'pricing_authorized': False,
              'selection_authorized': False,
              'production_authorized': False,
              'bet_authorized': False,
          }
          Path('campaign-execution-metadata.json').write_text(
              json.dumps(payload, sort_keys=True, separators=(',', ':')) + '\n', encoding='utf-8'
          )
          PY

      - name: Execute exact reviewed eight-slot live campaign
        id: campaign
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          set +e
          python scripts/run_pr69_primary_time_basis_evidence_acquisition.py --execute-reviewed-protocol > campaign-execution.log 2>&1
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture network-free post-run status
        id: post_status
        if: always() && steps.guard.outcome == 'success'
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          set +e
          python scripts/run_pr69_primary_time_basis_evidence_acquisition.py --status > campaign-post-status.json 2> campaign-post-status.stderr
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Package immutable execution evidence
        id: package
        if: always() && steps.guard.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact-staging
          for item in campaign-preflight-status.json campaign-execution-metadata.json campaign-execution.log campaign-post-status.json campaign-post-status.stderr; do
            if [ -f "$item" ]; then cp "$item" artifact-staging/; fi
          done
          if [ -d .cache/athena-research/pr69-primary-time-basis-evidence ]; then
            tar -C . -cf artifact-staging/pr69-primary-time-basis-evidence.tar .cache/athena-research/pr69-primary-time-basis-evidence
          else
            tar -cf artifact-staging/pr69-primary-time-basis-evidence.tar --files-from /dev/null
          fi
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          archive = Path('artifact-staging/pr69-primary-time-basis-evidence.tar')
          raw = archive.read_bytes()
          metadata = {
              'schema_version': 2,
              'archive_filename': archive.name,
              'archive_sha256': hashlib.sha256(raw).hexdigest(),
              'archive_size': len(raw),
          }
          Path('artifact-staging/package-metadata.json').write_text(
              json.dumps(metadata, sort_keys=True, separators=(',', ':')) + '\n', encoding='utf-8'
          )
          PY

      - name: Assess preserved campaign state without semantic interpretation
        id: assess
        if: always() && steps.guard.outcome == 'success'
        env:
          CAMPAIGN_EXIT_CODE: ${{ steps.campaign.outputs.exit_code }}
          POST_STATUS_EXIT_CODE: ${{ steps.post_status.outputs.exit_code }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          failures = []
          def require(condition, message):
              if not condition:
                  failures.append(message)

          campaign_exit = os.environ.get('CAMPAIGN_EXIT_CODE', '')
          post_exit = os.environ.get('POST_STATUS_EXIT_CODE', '')
          package_outcome = os.environ.get('PACKAGE_OUTCOME', '')
          require(campaign_exit == '0', f'campaign exit code was {campaign_exit!r}')
          require(post_exit == '0', f'post-status exit code was {post_exit!r}')
          require(package_outcome == 'success', f'package step outcome was {package_outcome!r}')
          require(Path('artifact-staging/pr69-primary-time-basis-evidence.tar').is_file(), 'evidence archive is missing')
          require(Path('artifact-staging/package-metadata.json').is_file(), 'package metadata is missing')

          status = None
          path = Path('campaign-post-status.json')
          if path.is_file():
              try:
                  status = json.loads(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  failures.append(f'post-status JSON could not be parsed: {type(exc).__name__}: {exc}')
          else:
              failures.append('post-status JSON is missing')

          if isinstance(status, dict):
              require(status.get('completed_slots') == 8, 'completed_slots is not 8')
              require(status.get('total_slots') == 8, 'total_slots is not 8')
              require(status.get('complete') is True, 'complete is not true')
              require(status.get('blocked') is False, 'blocked is not false')
              require(status.get('block_reason') is None, 'block_reason is not null')
              require(status.get('inflight_attempt') is None, 'inflight_attempt is not null')
              require(status.get('next_slot') is None, 'next_slot is not null after completion')
              require(status.get('network_acquisition_performed_by_this_status_command') is False,
                      'post status command did network acquisition')
              for key in (
                  'semantic_extraction_performed',
                  'historical_effective_scope_qualified',
                  'pr69_source_local_time_basis_resolved',
                  'pr80_constructor_input_authorized',
                  'model_training_authorized',
                  'probability_inference_authorized',
                  'pricing_authorized',
                  'selection_authorized',
                  'production_approval_authorized',
                  'bet_authorized',
              ):
                  require(status.get(key) is False, f'{key} is not false')
              pairs = status.get('pair_drift_table')
              require(isinstance(pairs, list) and len(pairs) == 4,
                      'pair_drift_table does not contain exactly four targets')
              if isinstance(pairs, list):
                  for row in pairs:
                      require(isinstance(row, dict), 'pair row is not an object')
                      if not isinstance(row, dict):
                          continue
                      separation = row.get('separation_seconds')
                      require(isinstance(separation, (int, float)) and 300 <= separation <= 3600,
                              f'pair separation is outside frozen window: {separation!r}')
                      for key in ('slot_a_raw_sha256', 'slot_b_raw_sha256'):
                          value = row.get(key)
                          require(isinstance(value, str) and len(value) == 64,
                                  f'{key} is not a 64-character digest')

          index_path = Path('.cache/athena-research/pr69-primary-time-basis-evidence/campaign-index.jsonl')
          if index_path.is_file():
              try:
                  rows = [json.loads(line) for line in index_path.read_text(encoding='utf-8').splitlines() if line]
              except Exception as exc:
                  failures.append(f'campaign index could not be parsed: {type(exc).__name__}: {exc}')
              else:
                  succeeded = [row for row in rows if row.get('event_type') == 'SLOT_SUCCEEDED']
                  require(len(succeeded) == 8, f'campaign index contains {len(succeeded)} successful rows instead of 8')
          else:
              failures.append('campaign index is missing')

          assessment = {
              'schema_version': 2,
              'boundary': 'EXECUTE_RECONCILED_REVIEWED_PR69_PRIMARY_TIME_BASIS_EVIDENCE_ACQUISITION_CAMPAIGN_V2',
              'execution_state_valid': not failures,
              'failures': failures,
              'semantic_interpretation_performed': False,
              'pr69_source_local_time_basis_resolved': False,
              'pr80_authorized': False,
              'model_authorized': False,
              'probability_authorized': False,
              'pricing_authorized': False,
              'selection_authorized': False,
              'production_authorized': False,
              'bet_authorized': False,
          }
          Path('campaign-state-assessment.json').write_text(
              json.dumps(assessment, sort_keys=True, separators=(',', ':')) + '\n', encoding='utf-8'
          )
          Path('artifact-staging/campaign-state-assessment.json').write_text(
              json.dumps(assessment, sort_keys=True, separators=(',', ':')) + '\n', encoding='utf-8'
          )
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
              handle.write(f"execution_state_valid={'true' if not failures else 'false'}\n")
          PY
          exit 0

      - name: Upload preserved V2 execution evidence
        id: artifact
        if: always() && steps.guard.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr69-primary-time-basis-evidence-campaign-v2-${{ github.run_id }}
          path: artifact-staging/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish durable V2 result and enforce fail-closed gate
        if: always() && steps.guard.outcome == 'success'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          AUTHORIZED_MAIN_SHA: ${{ steps.guard.outputs.main_sha }}
          CAMPAIGN_EXIT_CODE: ${{ steps.campaign.outputs.exit_code }}
          POST_STATUS_EXIT_CODE: ${{ steps.post_status.outputs.exit_code }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          ASSESS_OUTCOME: ${{ steps.assess.outcome }}
          ASSESSMENT_VALID: ${{ steps.assess.outputs.execution_state_valid }}
          ARTIFACT_UPLOAD_OUTCOME: ${{ steps.artifact.outcome }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        with:
          script: |
            const campaignExit = process.env.CAMPAIGN_EXIT_CODE || '';
            const postExit = process.env.POST_STATUS_EXIT_CODE || '';
            const packageOutcome = process.env.PACKAGE_OUTCOME || '';
            const assessOutcome = process.env.ASSESS_OUTCOME || '';
            const assessmentValid = process.env.ASSESSMENT_VALID || '';
            const artifactOutcome = process.env.ARTIFACT_UPLOAD_OUTCOME || '';
            const artifactId = process.env.ARTIFACT_ID || '';
            const artifactDigest = process.env.ARTIFACT_DIGEST || '';
            const artifactUrl = process.env.ARTIFACT_URL || '';
            const ok = campaignExit === '0' &&
              postExit === '0' &&
              packageOutcome === 'success' &&
              assessOutcome === 'success' &&
              assessmentValid === 'true' &&
              artifactOutcome === 'success' &&
              artifactId.length > 0;
            const state = ok
              ? 'PRIMARY_EVIDENCE_CAMPAIGN_V2_EXECUTED_AND_PRESERVED_PENDING_SEMANTIC_QUALIFICATION'
              : 'EXECUTION_V2_NOT_QUALIFIED_REVIEW_ARTIFACT_BEFORE_ANY_FURTHER_RETRY';
            const resultPrefix = '<!-- ATHENA_PR69_PRIMARY_TIME_BASIS_EVIDENCE_EXECUTION_RESULT_V2 -->';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 130,
              body: [
                resultPrefix,
                'ATHENA reconciled PR69 primary time-basis evidence campaign V2 result.',
                `run-id: ${context.runId}`,
                `main-sha: ${process.env.AUTHORIZED_MAIN_SHA || ''}`,
                `state: ${state}`,
                `campaign-exit-code: ${campaignExit}`,
                `post-status-exit-code: ${postExit}`,
                `package-outcome: ${packageOutcome}`,
                `assessment-outcome: ${assessOutcome}`,
                `assessment-valid: ${assessmentValid}`,
                `artifact-upload-outcome: ${artifactOutcome}`,
                `artifact-id: ${artifactId}`,
                `artifact-digest: ${artifactDigest}`,
                `artifact-url: ${artifactUrl}`,
                'reconciled-from-run-id: 31953949073',
                'reconciled-artifact-id: 9266604353',
                'fix-pr: 129',
                'fix-merge-sha: 94577458d4b8af59a4e986edb2e4df9c426e21be',
                'semantic-extraction: false',
                'historical-effective-scope-qualification: false',
                'pr69-source-local-time-basis-resolution: false',
                'pr80-constructor-input: false',
                'model/probability/pricing/selection/production/BET authority: false',
                ok
                  ? 'No semantic conclusion is authorized by successful acquisition alone.'
                  : 'Automatic replay remains forbidden. Review the preserved V2 artifact before any further retry.',
              ].join('\n'),
            });
            if (!ok) {
              core.setFailed('Reconciled V2 execution did not satisfy the complete preserved-evidence gate.');
            }
