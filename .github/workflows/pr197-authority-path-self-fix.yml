name: PR197 Authority Path Self Fix

on:
  pull_request:
    types: [edited]

jobs:
  fix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'model/fotmob-real-player-context-authoritative-bridge'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Remove parallel authority from prerequisite bridge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('domain/fotmob_real_player_context_authoritative_bridge.py')
          text = path.read_text(encoding='utf-8')
          old = '            "team_strength_feature_authorized": True,\n'
          new = '            "team_strength_feature_authorized": False,\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one bridge authority token, got {text.count(old)}')
          text = text.replace(old, new, 1)
          old_phrase = (
              'Only after that complete ancestry is proven does this wrapper authorize the\n'
              'nested PR190 team-strength feature candidate for the exact classification\n'
              'instant.  It does not authorize probability adjustment, expected-goals use,\n'
          )
          new_phrase = (
              'Only after that complete ancestry is proven does this bridge establish the\n'
              'prerequisite for ATHENA\\'s existing PR191 authoritative wrapper.  This bridge\n'
              'itself grants no feature authority, probability adjustment, expected-goals use,\n'
          )
          if old_phrase not in text:
              raise SystemExit('bridge docstring authority phrase drift')
          text = text.replace(old_phrase, new_phrase, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          grep -F '"team_strength_feature_authorized": False' domain/fotmob_real_player_context_authoritative_bridge.py
          if grep -F '"team_strength_feature_authorized": True' domain/fotmob_real_player_context_authoritative_bridge.py; then
            echo 'parallel bridge authority still present' >&2
            exit 1
          fi

      - name: Commit exact fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add domain/fotmob_real_player_context_authoritative_bridge.py
          git commit -m '[FotMob][Model] keep authority in existing PR191 wrapper'
          git push origin HEAD:model/fotmob-real-player-context-authoritative-bridge
