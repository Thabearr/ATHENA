name: PRF patch hash diagnostic

on:
  push:
    branches:
      - feat/prf-shadow-live-all-market-field-proof
    paths:
      - .github/workflows/prf-patch-hash-diagnostic.yml

permissions:
  contents: read
  issues: read

jobs:
  hash:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compute exact stored fenced patch digest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api repos/${GITHUB_REPOSITORY}/issues/comments/5466339988 > /tmp/comment.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          body = json.loads(Path('/tmp/comment.json').read_text(encoding='utf-8'))['body']
          lines = body.splitlines()
          fence_start = next(i + 1 for i, line in enumerate(lines) if line.strip() == '```diff')
          fence_end = next(i for i in range(fence_start, len(lines)) if lines[i].strip() == '```')
          patch = ('\n'.join(lines[fence_start:fence_end]) + '\n').encode('utf-8')
          print(f'patch_bytes={len(patch)}')
          print(f'patch_sha256={hashlib.sha256(patch).hexdigest()}')
          PY
