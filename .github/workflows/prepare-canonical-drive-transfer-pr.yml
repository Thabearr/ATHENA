name: Prepare Canonical Database Drive Transfer PR

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/prepare-canonical-drive-transfer-pr.yml"

permissions:
  actions: read
  contents: read

jobs:
  prepare-drive-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_RUN_ID: "32628985683"
      SOURCE_ARTIFACT_ID: "9491418446"
      SOURCE_ARTIFACT_SHA256: "a783886d0906e357e26851fcb3eb182bb06bdcc184d21f2b6578bb3d1fa61511"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download canonical artifact archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-artifact drive-transfer
          curl -L --fail --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o source-artifact/athena-history-canonical.zip

      - name: Verify canonical artifact archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE=source-artifact/athena-history-canonical.zip
          ACTUAL="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          echo "Expected artifact SHA-256: $SOURCE_ARTIFACT_SHA256"
          echo "Actual artifact SHA-256:   $ACTUAL"
          test "$ACTUAL" = "$SOURCE_ARTIFACT_SHA256"
          unzip -Z1 "$ARCHIVE" | grep -qx 'athena_history.db'

      - name: Split compressed canonical archive into Drive-safe parts
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE=source-artifact/athena-history-canonical.zip
          split -b 90M -d -a 3 --additional-suffix=.part \
            "$ARCHIVE" drive-transfer/athena-history-canonical.zip.part

          PART_COUNT="$(find drive-transfer -maxdepth 1 -type f -name 'athena-history-canonical.zip.part*.part' | wc -l | tr -d ' ')"
          if [ "$PART_COUNT" -lt 1 ] || [ "$PART_COUNT" -gt 25 ]; then
            echo "Unexpected part count: $PART_COUNT" >&2
            exit 1
          fi

          sha256sum "$ARCHIVE" > drive-transfer/ATHENA_CANONICAL_ARCHIVE_SHA256.txt
          sha256sum drive-transfer/athena-history-canonical.zip.part*.part > drive-transfer/ATHENA_PART_SHA256.txt
          ARCHIVE_BYTES="$(stat -c '%s' "$ARCHIVE")"
          ARCHIVE_SHA="$(awk '{print $1}' drive-transfer/ATHENA_CANONICAL_ARCHIVE_SHA256.txt)"

          printf '%s\n' \
            'ATHENA canonical historical database transfer' \
            "Source historical warehouse run: $SOURCE_RUN_ID" \
            "Source artifact ID: $SOURCE_ARTIFACT_ID" \
            'Canonical archive: athena-history-canonical.zip' \
            "Canonical archive bytes: $ARCHIVE_BYTES" \
            "Canonical archive SHA-256: $ARCHIVE_SHA" \
            "Number of parts: $PART_COUNT" \
            '' \
            'Download and extract every athena-canonical-part-NNN.zip. Put all resulting *.part files in one directory.' \
            '' \
            'Linux/macOS:' \
            '  cat athena-history-canonical.zip.part*.part > athena-history-canonical.zip' \
            '  sha256sum athena-history-canonical.zip' \
            '  unzip athena-history-canonical.zip' \
            '' > drive-transfer/README.txt

          cat >> drive-transfer/README.txt <<'EOF'
          Windows PowerShell:
            $parts = Get-ChildItem athena-history-canonical.zip.part*.part | Sort-Object Name
            $out = [System.IO.File]::Create('athena-history-canonical.zip')
            foreach ($p in $parts) {
              $input = [System.IO.File]::OpenRead($p.FullName)
              $input.CopyTo($out)
              $input.Dispose()
            }
            $out.Dispose()
            Get-FileHash athena-history-canonical.zip -Algorithm SHA256
            Expand-Archive athena-history-canonical.zip -DestinationPath .

          The reconstructed ZIP SHA-256 must equal the canonical archive SHA-256 above.
          The ZIP contains athena_history.db.
          EOF

          echo "Prepared $PART_COUNT Drive-safe archive parts from $ARCHIVE_BYTES bytes"
          ls -lh drive-transfer

      - name: Upload transfer manifest
        uses: actions/upload-artifact@v4
        with:
          name: athena-canonical-drive-manifest
          path: |
            drive-transfer/README.txt
            drive-transfer/ATHENA_CANONICAL_ARCHIVE_SHA256.txt
            drive-transfer/ATHENA_PART_SHA256.txt
          compression-level: 0
          retention-days: 30

      - name: Upload part 000
        if: ${{ hashFiles('drive-transfer/athena-history-canonical.zip.part000.part') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: athena-canonical-drive-part-000
          path: drive-transfer/athena-history-canonical.zip.part000.part
          compression-level: 0
          retention-days: 30
