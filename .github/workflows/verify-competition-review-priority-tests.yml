name: Verify Competition Review Priority Tests

on:
  pull_request:
    branches:
      - evidence/saturday-2026-08-22-fixture-universe-capture

permissions:
  contents: read

jobs:
  test:
    if: >-
      github.event.pull_request.number == 200 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'policy/competition-fixture-review-priority'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout and frozen stacked base ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.base.sha }}" = "b879b2140d0bc3fb64fa8fec4c73c735240a3b41"
          git merge-base --is-ancestor b879b2140d0bc3fb64fa8fec4c73c735240a3b41 HEAD
          test -z "$(git status --short --untracked-files=no)"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install frozen repository dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run focused competition-priority tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_competition_review_priority.py \
            tests/test_accumulator_priority.py \
            tests/test_saturday_2026_08_22_fixture_universe.py
