name: Publish Canonical Historical Database Release

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/publish-canonical-release.yml"

permissions:
  actions: read
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOURCE_ARTIFACT_ID: "9491418446"
      SOURCE_ARTIFACT_SHA256: "a783886d0906e357e26851fcb3eb182bb06bdcc184d21f2b6578bb3d1fa61511"
      RELEASE_TAG: "athena-history-canonical-2026-08-23"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download canonical artifact archive without extracting it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          curl -L --fail --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o release-assets/athena-history-canonical.zip

      - name: Verify source artifact digest
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(sha256sum release-assets/athena-history-canonical.zip | awk '{print $1}')"
          echo "Expected artifact SHA-256: $SOURCE_ARTIFACT_SHA256"
          echo "Actual artifact SHA-256:   $ACTUAL"
          test "$ACTUAL" = "$SOURCE_ARTIFACT_SHA256"

      - name: Split release into sub-2-GiB assets and write manifest
        shell: bash
        run: |
          set -euo pipefail
          split -b 1900M -d -a 2 --additional-suffix=.part \
            release-assets/athena-history-canonical.zip \
            release-assets/athena-history-canonical.zip.part

          sha256sum release-assets/athena-history-canonical.zip > release-assets/ATHENA_RELEASE_SHA256.txt
          sha256sum release-assets/athena-history-canonical.zip.part*.part > release-assets/ATHENA_RELEASE_PART_SHA256.txt
          ARCHIVE_BYTES="$(stat -c '%s' release-assets/athena-history-canonical.zip)"
          PART_COUNT="$(find release-assets -maxdepth 1 -type f -name 'athena-history-canonical.zip.part*.part' | wc -l | tr -d ' ')"
          ARCHIVE_SHA="$(awk '{print $1}' release-assets/ATHENA_RELEASE_SHA256.txt)"

          cat > release-assets/README.md <<EOF
          # ATHENA Canonical Historical Database

          Source historical warehouse run: 32628985683
          Source artifact ID: $SOURCE_ARTIFACT_ID
          Canonical archive bytes: $ARCHIVE_BYTES
          Canonical archive SHA-256: $ARCHIVE_SHA
          Release parts: $PART_COUNT

          Download every `athena-history-canonical.zip.partNN.part` asset into one directory.

          Linux/macOS:

              cat athena-history-canonical.zip.part*.part > athena-history-canonical.zip
              sha256sum athena-history-canonical.zip
              unzip athena-history-canonical.zip

          Windows PowerShell:

              \$parts = Get-ChildItem athena-history-canonical.zip.part*.part | Sort-Object Name
              \$out = [System.IO.File]::Create('athena-history-canonical.zip')
              foreach (\$p in \$parts) {
                  \$input = [System.IO.File]::OpenRead(\$p.FullName)
                  \$input.CopyTo(\$out)
                  \$input.Dispose()
              }
              \$out.Dispose()
              Get-FileHash athena-history-canonical.zip -Algorithm SHA256
              Expand-Archive athena-history-canonical.zip -DestinationPath .

          The reconstructed ZIP SHA-256 must equal the canonical archive SHA-256 above.
          The archive contains the canonical `athena_history.db` SQLite warehouse.
          EOF

          rm release-assets/athena-history-canonical.zip
          ls -lh release-assets

      - name: Publish public GitHub release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              release-assets/athena-history-canonical.zip.part*.part \
              release-assets/ATHENA_RELEASE_SHA256.txt \
              release-assets/ATHENA_RELEASE_PART_SHA256.txt \
              release-assets/README.md \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" \
              release-assets/athena-history-canonical.zip.part*.part \
              release-assets/ATHENA_RELEASE_SHA256.txt \
              release-assets/ATHENA_RELEASE_PART_SHA256.txt \
              release-assets/README.md \
              --title "ATHENA Canonical Historical Database — 2026-08-23" \
              --notes-file release-assets/README.md \
              --target main \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Print release URL
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url
