name: Temporary PR192 long-name fix

on:
  pull_request:
    types: [edited]

jobs:
  patch:
    if: >-
      github.event.pull_request.number == 192 &&
      github.actor == 'Thabearr' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'evidence/fotmob-prospective-player-context-campaign' &&
      contains(github.event.pull_request.body, '<!-- ATHENA_IMPL_PATCH_TRIGGER_20260820 -->')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply exact reviewed long-name fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          domain_path = Path('domain/fotmob_prospective_player_context_campaign.py')
          text = domain_path.read_text(encoding='utf-8')
          old = '''        and item.home_name == expected_home_team\n        and item.away_name == expected_away_team\n'''
          new = '''        and item.home_long_name == expected_home_team\n        and item.away_long_name == expected_away_team\n'''
          if text.count(old) != 1:
              raise SystemExit('expected exact resolver block once')
          text = text.replace(old, new, 1)
          old_identity = '''        "home_team": candidate.home_name,\n        "away_team": candidate.away_name,\n'''
          new_identity = '''        "home_team": candidate.home_long_name,\n        "away_team": candidate.away_long_name,\n'''
          if text.count(old_identity) != 1:
              raise SystemExit('expected exact candidate identity block once')
          text = text.replace(old_identity, new_identity, 1)
          domain_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_fotmob_prospective_player_context_campaign.py')
          tests = test_path.read_text(encoding='utf-8')
          import_old = '''    campaign_receipt_from_bytes,\n    canonical_campaign_receipt_bytes,\n'''
          import_new = '''    campaign_receipt_from_bytes,\n    candidate_identity,\n    canonical_campaign_receipt_bytes,\n'''
          if tests.count(import_old) != 1:
              raise SystemExit('expected exact test import block once')
          tests = tests.replace(import_old, import_new, 1)
          anchor = '''def test_wrong_request_date_and_kickoff_fail_exact_resolution() -> None:\n'''
          regression = '''def test_exact_target_resolution_uses_reviewed_long_names_not_display_abbreviations() -> None:\n    real_source_shape = dataclasses.replace(\n        _candidate(match_id=5795367),\n        home_name="Nottm Forest",\n        away_name="Leeds",\n    )\n    assert resolve_exact_target_candidate((real_source_shape,)) is real_source_shape\n    identity = candidate_identity(real_source_shape)\n    assert identity["home_team"] == EXPECTED_HOME_TEAM\n    assert identity["away_team"] == EXPECTED_AWAY_TEAM\n\n    wrong_long_name = dataclasses.replace(\n        real_source_shape, home_long_name="Nottingham Forest FC"\n    )\n    with pytest.raises(FotMobProspectivePlayerContextCampaignError):\n        resolve_exact_target_candidate((wrong_long_name,))\n\n\n'''
          if tests.count(anchor) != 1:
              raise SystemExit('expected exact regression insertion anchor once')
          if 'test_exact_target_resolution_uses_reviewed_long_names_not_display_abbreviations' in tests:
              raise SystemExit('regression test already present')
          tests = tests.replace(anchor, regression + anchor, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

          git diff --check
          git diff -- domain/fotmob_prospective_player_context_campaign.py tests/test_fotmob_prospective_player_context_campaign.py

      - name: Remove temporary workflow and commit exact fix
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temporary-pr192-long-name-fix.yml
          git config user.name 'ATHENA implementation bridge'
          git config user.email 'actions@users.noreply.github.com'
          git add domain/fotmob_prospective_player_context_campaign.py tests/test_fotmob_prospective_player_context_campaign.py
          git commit -m 'Fix PR192 exact FotMob long-name resolution'
          git push origin HEAD:evidence/fotmob-prospective-player-context-campaign
