name: Extract ATHENA Schochastics Backbone

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-schochastics-backbone.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/extract-schochastics-backbone.yml"

permissions:
  contents: read
  actions: read

jobs:
  extract-backbone:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download certified CSV warehouse artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            /repos/${GITHUB_REPOSITORY}/actions/artifacts/9482429185/zip \
            > certified-csv-artifact.zip
          unzip -q certified-csv-artifact.zip
          test -f athena-history-csv.tar.gz

      - name: Extract only match and source tables
        run: |
          set -euo pipefail
          tar -xzf athena-history-csv.tar.gz \
            data/history_exports/matches.csv \
            data/history_exports/sources.csv

      - name: Build Schochastics backbone CSV
        run: |
          python - <<'PY'
          import csv
          import gzip
          import hashlib
          from pathlib import Path

          root = Path('data/history_exports')
          sources_path = root / 'sources.csv'
          matches_path = root / 'matches.csv'
          output_path = Path('athena-schochastics-global-backbone.csv.gz')

          match_keys = set()
          source_rows = 0
          with sources_path.open('r', encoding='utf-8', newline='') as fh:
              reader = csv.DictReader(fh)
              for row in reader:
                  if row.get('source_key') == 'schochastics_global':
                      source_rows += 1
                      key = row.get('match_key')
                      if key:
                          match_keys.add(key)

          written = 0
          with matches_path.open('r', encoding='utf-8', newline='') as src, gzip.open(
              output_path, 'wt', encoding='utf-8', newline='', compresslevel=6
          ) as dst:
              reader = csv.DictReader(src)
              if not reader.fieldnames or 'match_key' not in reader.fieldnames:
                  raise SystemExit('matches.csv does not contain match_key')
              writer = csv.DictWriter(dst, fieldnames=reader.fieldnames)
              writer.writeheader()
              for row in reader:
                  if row.get('match_key') in match_keys:
                      writer.writerow(row)
                      written += 1

          if written < 1_200_000:
              raise SystemExit(f'Expected at least 1.2M Schochastics matches, wrote {written:,}')

          digest = hashlib.sha256()
          with output_path.open('rb') as fh:
              for chunk in iter(lambda: fh.read(8 * 1024 * 1024), b''):
                  digest.update(chunk)

          summary = (
              f'source_rows={source_rows}\n'
              f'unique_match_keys={len(match_keys)}\n'
              f'csv_rows={written}\n'
              f'sha256={digest.hexdigest()}\n'
              f'bytes={output_path.stat().st_size}\n'
          )
          Path('backbone-summary.txt').write_text(summary, encoding='utf-8')
          print(summary)
          PY

      - name: Upload delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: athena-schochastics-global-backbone
          path: |
            athena-schochastics-global-backbone.csv.gz
            backbone-summary.txt
          compression-level: 0
          retention-days: 30
