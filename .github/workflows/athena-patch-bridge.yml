name: ATHENA Patch Bridge

on:
  issue_comment:
    types: [created]

concurrency:
  group: athena-patch-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'Thabearr' &&
      startsWith(github.event.comment.body, '/athena-apply')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_ref: ${{ steps.pr.outputs.head_ref }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      patch_sha256: ${{ steps.payload.outputs.patch_sha256 }}

    steps:
      - name: Resolve and guard pull request
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const expectedRepo = `${context.repo.owner}/${context.repo.repo}`;
            if (pr.head.repo.full_name !== expectedRepo) {
              core.setFailed('Patch Bridge only accepts same-repository pull requests.');
              return;
            }
            if (!pr.draft) {
              core.setFailed('Patch Bridge only writes to draft pull requests.');
              return;
            }
            if (pr.state !== 'open') {
              core.setFailed('Pull request must be open.');
              return;
            }

            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('head_sha', pr.head.sha);

      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Extract and verify patch payload
        id: payload
        env:
          EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          body = event["comment"]["body"]
          lines = body.splitlines()

          if not lines or lines[0].strip() != "/athena-apply":
              raise SystemExit("Missing /athena-apply command")

          metadata = {}
          fence_start = None
          for index, line in enumerate(lines[1:], start=1):
              stripped = line.strip()
              if stripped == "```diff":
                  fence_start = index + 1
                  break
              if ":" in stripped:
                  key, value = stripped.split(":", 1)
                  metadata[key.strip()] = value.strip()

          if fence_start is None:
              raise SystemExit("Missing ```diff patch block")

          try:
              fence_end = next(
                  index for index in range(fence_start, len(lines))
                  if lines[index].strip() == "```"
              )
          except StopIteration as error:
              raise SystemExit("Unterminated patch block") from error

          if any(line.strip() for line in lines[fence_end + 1:]):
              raise SystemExit("Unexpected content after patch block")

          patch = ("\n".join(lines[fence_start:fence_end]) + "\n").encode("utf-8")
          if len(patch) == 0 or len(patch) > 60000:
              raise SystemExit("Patch must contain 1 to 60000 UTF-8 bytes")

          expected_head = os.environ["EXPECTED_HEAD_SHA"]
          if metadata.get("base-sha") != expected_head:
              raise SystemExit(
                  f"Stale patch: base-sha={metadata.get('base-sha')!r}, "
                  f"current head={expected_head}"
              )

          digest = hashlib.sha256(patch).hexdigest()
          if metadata.get("patch-sha256") != digest:
              raise SystemExit("Patch SHA-256 mismatch")

          Path("athena.patch").write_bytes(patch)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"patch_sha256={digest}\n")
          PY

      - name: Validate and apply patch
        run: |
          git apply --check --whitespace=error-all athena.patch
          git apply --whitespace=fix athena.patch

      - name: Enforce path and patch safety
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import PurePosixPath

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "-z"],
              text=False,
          ).split(b"\0")
          paths = [
              item.decode("utf-8")
              for item in changed
              if item
          ]
          if not paths:
              raise SystemExit("Patch produced no file changes")

          allowed_prefixes = (
              "api/",
              "config/",
              "core/",
              "database/",
              "domain/",
              "engine/",
              "intelligence/",
              "models/",
              "providers/",
              "reports/",
              "repositories/",
              "scripts/",
              "services/",
              "tests/",
              "tools/",
              "workers/",
              "docs/",
              "artifacts/research-protocols/",
          )
          allowed_exact = {
              "build_acca.py",
              "requirements.txt",
              ".gitignore",
          }

          for raw in paths:
              path = PurePosixPath(raw)
              if path.is_absolute() or ".." in path.parts:
                  raise SystemExit(f"Unsafe changed path: {raw}")
              if raw.startswith(".github/"):
                  raise SystemExit("Patch Bridge cannot modify GitHub workflows")
              if raw not in allowed_exact and not raw.startswith(allowed_prefixes):
                  raise SystemExit(f"Changed path is outside the allowlist: {raw}")

          numstat = subprocess.check_output(
              ["git", "diff", "--numstat"],
              text=True,
              encoding="utf-8",
          )
          if any(line.split("\t", 1)[0] == "-" for line in numstat.splitlines()):
              raise SystemExit("Binary patches are forbidden")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run full validation
        run: |
          python -m pytest tests -q
          python -m compileall -q api config core database domain engine intelligence models providers reports repositories scripts services tools workers build_acca.py
          git diff --check

      - name: Upload validated patch
        uses: actions/upload-artifact@v4
        with:
          name: athena-validated-patch-${{ github.event.issue.number }}
          path: athena.patch
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      issues: write

    steps:
      - name: Reconfirm unchanged pull-request head
        id: pr
        uses: actions/github-script@v7
        env:
          EXPECTED_HEAD_SHA: ${{ needs.validate.outputs.head_sha }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            if (pr.head.sha !== process.env.EXPECTED_HEAD_SHA) {
              core.setFailed('Pull-request head changed after validation.');
              return;
            }
            if (!pr.draft || pr.state !== 'open') {
              core.setFailed('Pull request is no longer an open draft.');
              return;
            }

      - name: Check out exact validated head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.head_sha }}
          fetch-depth: 0

      - name: Download validated patch
        uses: actions/download-artifact@v4
        with:
          name: athena-validated-patch-${{ github.event.issue.number }}

      - name: Verify artifact and apply
        env:
          EXPECTED_PATCH_SHA256: ${{ needs.validate.outputs.patch_sha256 }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          digest = hashlib.sha256(Path("athena.patch").read_bytes()).hexdigest()
          if digest != os.environ["EXPECTED_PATCH_SHA256"]:
              raise SystemExit("Validated patch artifact SHA-256 mismatch")
          PY
          git apply --check --whitespace=error-all athena.patch
          git apply --whitespace=fix athena.patch
          git diff --check

      - name: Commit and push
        env:
          HEAD_REF: ${{ needs.validate.outputs.head_ref }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "athena-patch-bridge[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply reviewed ATHENA patch for PR #${PR_NUMBER}"
          git push origin "HEAD:${HEAD_REF}"

      - name: Report success
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `ATHENA Patch Bridge applied, validated, committed, and pushed the requested patch. Source comment: #issuecomment-${context.payload.comment.id}`,
            });
