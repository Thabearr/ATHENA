name: Temporary PR194 Authority Correction

on:
  pull_request:
    types: [edited]

jobs:
  implement:
    if: >-
      github.event.pull_request.number == 194 &&
      github.actor == 'Thabearr' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'model/fotmob-real-player-context-team-strength-handoff' &&
      contains(github.event.pull_request.body, '<!-- ATHENA_PR194_CANDIDATE_ONLY -->')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout exact implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: model/fotmob-real-player-context-team-strength-handoff
          fetch-depth: 0
      - name: Apply candidate-only authority correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('domain/fotmob_real_player_context_team_strength_handoff.py'): [
                  ('"team_strength_feature_authorized": True,', '"team_strength_feature_authorized": False,'),
              ],
              Path('scripts/verify_fotmob_real_player_context_team_strength_handoff.py'): [
                  ('print("team_strength_feature_authorized=true")', 'print("team_strength_feature_authorized=false")\n    print("team_strength_candidate_mapping_verified=true")'),
              ],
              Path('.github/workflows/verify-fotmob-real-player-context-team-strength-handoff.yml'): [
                  ("echo '- exact-observation team-strength feature authority: TRUE'", "echo '- exact-observation team-strength feature authority: FALSE'\n            echo '- exact source-replayed candidate mapping: VERIFIED'"),
              ],
              Path('tests/test_fotmob_real_player_context_team_strength_handoff.py'): [
                  ('def test_boundary_authorizes_feature_handoff_but_not_model_or_bet_decision() -> None:', 'def test_boundary_verifies_candidate_mapping_without_feature_authority() -> None:'),
                  ('\'"team_strength_feature_authorized": True\',', '\'"team_strength_feature_authorized": False\','),
              ],
              Path('docs/fotmob_real_player_context_team_strength_handoff_scope.md'): [
                  ('- exact PR192 evidence is replayed through the PR193 builder;\n', '- exact PR192 evidence is replayed through the PR193 builder;\n- PR191 remains the sole existing feature-authority path that requires PR65/PR66 lineage;\n'),
                  ('- no xG/probability adjustment exists;\n', '- `team_strength_feature_authorized` remains false because this boundary does not replay PR65/PR66 through PR191;\n- no xG/probability adjustment exists;\n'),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence, found {count}: {old!r}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          doc = Path('docs/fotmob_real_player_context_team_strength_handoff.md')
          text = doc.read_text(encoding='utf-8')
          exact_pairs = [
              ('The authoritative PR #194 wrapper sets `team_strength_feature_authorized = true` only for this exact replayed observation and exact candidate.\n', 'PR #194 verifies this exact source-replayed candidate mapping, but keeps `team_strength_feature_authorized = false`. PR #191 established that feature authority requires the admitted PR65/PR66 Fixture Intelligence/model-feature lineage as well as reviewed array evidence; PR #192/#193 did not preserve or replay that full PR65/PR66 chain for this observation.\n'),
              ('True only at this boundary:\n\n- `team_strength_feature_authorized` for the exact replayed PR #194 handoff.\n\nExplicitly false/not used:\n', 'Verified at this boundary:\n\n- exact source-replayed mapping into a PR190 candidate;\n- the two unavailable-player count resolutions are the only AVAILABLE candidate features.\n\nExplicitly false/not used:\n\n- team-strength feature authority;\n'),
          ]
          for old, new in exact_pairs:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{doc}: expected exactly one occurrence, found {count}: {old!r}')
              text = text.replace(old, new)
          marker = '## Scientific consequence\n'
          insertion = ('## Why this does not bypass PR #191\n\n'
                       'PR #191 established the authoritative team-strength adapter as a full-replay boundary over reviewed array evidence plus the admitted PR65 Fixture Intelligence snapshot and PR66 model-feature handoff. The PR #192 artifact contains the real fixture/bootstrap and PR52/PR53 match-details evidence, but it does not contain the required PR65/PR66 artifacts for this exact observation.\n\n'
                       'Therefore PR #194 must not create a parallel authority path. It proves the mapping only. A later narrow boundary must establish/replay the missing admitted Fixture Intelligence/model-feature lineage and then use the PR #191 authority path before current player context can carry team-strength feature authority.\n\n')
          if text.count(marker) != 1:
              raise SystemExit('scientific-consequence marker drift')
          text = text.replace(marker, insertion + marker)
          doc.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- domain/fotmob_real_player_context_team_strength_handoff.py scripts/verify_fotmob_real_player_context_team_strength_handoff.py .github/workflows/verify-fotmob-real-player-context-team-strength-handoff.yml tests/test_fotmob_real_player_context_team_strength_handoff.py docs/fotmob_real_player_context_team_strength_handoff.md docs/fotmob_real_player_context_team_strength_handoff_scope.md
      - name: Commit exact correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Thabearr'
          git config user.email '113853913+Thabearr@users.noreply.github.com'
          git add domain/fotmob_real_player_context_team_strength_handoff.py \
            scripts/verify_fotmob_real_player_context_team_strength_handoff.py \
            .github/workflows/verify-fotmob-real-player-context-team-strength-handoff.yml \
            tests/test_fotmob_real_player_context_team_strength_handoff.py \
            docs/fotmob_real_player_context_team_strength_handoff.md \
            docs/fotmob_real_player_context_team_strength_handoff_scope.md
          git commit -m 'Keep real player-context handoff candidate-only'
          git push origin HEAD:model/fotmob-real-player-context-team-strength-handoff
