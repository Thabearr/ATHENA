name: ATHENA P3.0-E1 owner dispatch bridge
run-name: ATHENA P3.0-E1 owner bridge comment=${{ github.event.comment.id }}

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write

concurrency:
  group: p3-0-e1-owner-dispatch-bridge
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.issue.number == 337 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/athena-run-p3-e1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bind exact main and derive bounded prospective request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMAND: /athena-run-p3-e1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import subprocess
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          issue = event.get("issue") or {}
          comment = event.get("comment") or {}
          repository = event.get("repository") or {}

          if issue.get("number") != 337:
              raise SystemExit("P3.0-E1 bridge escaped master issue #337")
          if comment.get("user", {}).get("login") != repository.get("owner", {}).get("login"):
              raise SystemExit("P3.0-E1 bridge requires repository-owner authorization")
          if comment.get("body") != os.environ["EXPECTED_COMMAND"]:
              raise SystemExit("P3.0-E1 bridge command drifted")

          repo = os.environ["GITHUB_REPOSITORY"]
          main_sha = subprocess.check_output(
              ["gh", "api", f"repos/{repo}/git/ref/heads/main", "--jq", ".object.sha"],
              text=True,
          ).strip()
          if len(main_sha) != 40:
              raise SystemExit("current main SHA is malformed")
          if main_sha != os.environ["GITHUB_SHA"]:
              raise SystemExit("issue-comment workflow is not executing at exact current main")

          today = dt.datetime.now(dt.timezone.utc).date()
          fixture_dates = ",".join(
              (today + dt.timedelta(days=offset)).strftime("%Y%m%d")
              for offset in range(7)
          )
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"main_sha={main_sha}\n")
              handle.write(f"fixture_dates={fixture_dates}\n")
              handle.write("fixture_cap=50\n")
          print(f"exact_main={main_sha}")
          print(f"fixture_dates={fixture_dates}")
          print("fixture_cap=50")
          PY

      - name: Prove one-shot current-head dispatch has not already occurred
        env:
          GH_TOKEN: ${{ github.token }}
          EXACT_MAIN_SHA: ${{ steps.request.outputs.main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          existing_count="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/p3-0-comparison-evidence-capture.yml/runs?event=workflow_dispatch&branch=main&per_page=100" \
              --jq ".workflow_runs | map(select(.head_sha == \"${EXACT_MAIN_SHA}\")) | length"
          )"
          if [ "${existing_count}" != "0" ]; then
            echo "P3.0-E1 already has ${existing_count} workflow_dispatch run(s) at exact current main ${EXACT_MAIN_SHA}." >&2
            exit 1
          fi

      - name: Dispatch exactly one P3.0-E1 prospective capture
        env:
          GH_TOKEN: ${{ github.token }}
          EXACT_MAIN_SHA: ${{ steps.request.outputs.main_sha }}
          ATHENA_P3_FIXTURE_DATES: ${{ steps.request.outputs.fixture_dates }}
          ATHENA_P3_FIXTURE_CAP: ${{ steps.request.outputs.fixture_cap }}
        shell: bash
        run: |
          set -euo pipefail
          live_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "${live_main_sha}" != "${EXACT_MAIN_SHA}" ]; then
            echo "main advanced before P3.0-E1 dispatch" >&2
            exit 1
          fi
          gh workflow run p3-0-comparison-evidence-capture.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f fixture_dates="${ATHENA_P3_FIXTURE_DATES}" \
            -f fixture_cap="${ATHENA_P3_FIXTURE_CAP}"
