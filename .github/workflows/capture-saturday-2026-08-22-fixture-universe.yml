name: Capture Saturday 2026-08-22 FotMob Fixture Universe

on:
  pull_request:
    types: [edited]

concurrency:
  group: athena-saturday-2026-08-22-fixture-universe-v1
  cancel-in-progress: false

jobs:
  capture:
    if: >-
      github.event.pull_request.number == 199 &&
      github.actor == 'Thabearr' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'evidence/saturday-2026-08-22-fixture-universe-capture' &&
      contains(github.event.pull_request.body, '<!-- ATHENA_SATURDAY_FIXTURE_UNIVERSE_V1 -->')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read

    steps:
      - name: Validate exact owner control block
        id: guard
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const marker = '<!-- ATHENA_SATURDAY_FIXTURE_UNIVERSE_V1 -->';
            const end = '<!-- /ATHENA_SATURDAY_FIXTURE_UNIVERSE_V1 -->';
            const pr = context.payload.pull_request;
            if (!pr || pr.number !== 199 || !pr.draft) {
              core.setFailed('Capture is bound only to draft PR #199.');
              return;
            }
            if (context.actor !== 'Thabearr') {
              core.setFailed('Only the repository owner may execute this capture.');
              return;
            }
            if (pr.base.sha !== 'a149d523ee4e8859bfead7b7a42bfcb002fc37a8') {
              core.setFailed(`PR base ${pr.base.sha} differs from frozen post-PR197 main.`);
              return;
            }
            if (
              pr.head.repo.full_name !== context.repo.owner + '/' + context.repo.repo ||
              pr.head.ref !== 'evidence/saturday-2026-08-22-fixture-universe-capture'
            ) {
              core.setFailed('Capture head repository/branch mismatch.');
              return;
            }
            const body = String(pr.body || '').replace(/\r\n/g, '\n');
            if (body.split(marker).length !== 2 || body.split(end).length !== 2) {
              core.setFailed('PR body must contain exactly one complete capture control block.');
              return;
            }
            const block = body.split(marker)[1].split(end)[0]
              .split('\n').map((line) => line.trim()).filter(Boolean);
            const expected = [
              `repository-head-sha: ${pr.head.sha}`,
              'request-date: 20260822',
              'timezone: UTC',
              'ccode3: NGA',
              'confirm: CAPTURE_EXACT_SATURDAY_FOTMOB_FIXTURE_UNIVERSE',
            ];
            if (block.length !== expected.length || block.some((line, index) => line !== expected[index])) {
              core.setFailed('Capture control block is missing, stale, or not exact.');
              return;
            }
            core.setOutput('head_sha', pr.head.sha);

      - name: Check out exact authorized PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.guard.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify frozen base ancestry and exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.guard.outputs.head_sha }}"
          git merge-base --is-ancestor a149d523ee4e8859bfead7b7a42bfcb002fc37a8 HEAD
          test -z "$(git status --short --untracked-files=no)"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install frozen repository dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Capture exact Saturday fixture universe
        id: capture
        env:
          PYTHONPATH: ${{ github.workspace }}
          EXACT_HEAD_SHA: ${{ steps.guard.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/capture_saturday_2026_08_22_fixture_universe.py \
            --repository-head-sha "${EXACT_HEAD_SHA}" \
            --execute-live-network \
            | tee capture-result.txt
          result="$(tail -n 1 capture-result.txt)"
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('capture-result.txt').read_text().splitlines()[-1])
          assert value['result'] == 'SATURDAY_FIXTURE_UNIVERSE_CAPTURED_UNREVIEWED'
          assert value['repository_head_sha']
          assert value['candidate_count'] >= 0
          PY
          echo "result=${result}" >> "${GITHUB_OUTPUT}"

      - name: Verify artifact safety boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('saturday-fixture-universe-artifact/capture-receipt.json').read_text())
          universe = json.loads(Path('saturday-fixture-universe-artifact/saturday-fixture-universe.json').read_text())
          assert receipt['repository_head_sha'] == '${{ steps.guard.outputs.head_sha }}'
          assert receipt['request_date'] == '20260822'
          assert receipt['request_timezone'] == 'UTC'
          assert receipt['request_ccode3'] == 'NGA'
          assert receipt['safety'] == universe['safety']
          assert receipt['safety']
          assert not any(receipt['safety'].values())
          assert universe['requested_fold_size'] == 20
          PY

      - name: Upload exact Saturday fixture-universe evidence
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: saturday-2026-08-22-fixture-universe-evidence
          path: saturday-fixture-universe-artifact/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish capture summary
        if: always()
        shell: bash
        env:
          CAPTURE_RESULT: ${{ steps.capture.outputs.result }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          {
            echo '## Saturday 2026-08-22 fixture-universe capture'
            echo
            echo "- exact PR head: ${{ steps.guard.outputs.head_sha }}"
            echo "- run: ${GITHUB_RUN_ID}"
            echo "- result: ${CAPTURE_RESULT:-RUNNER_DID_NOT_RETURN_RESULT}"
            echo '- request: 20260822 / UTC / NGA'
            echo '- artifact: saturday-2026-08-22-fixture-universe-evidence'
            echo "- upload: ${UPLOAD_OUTCOME}"
            echo '- candidate review authorization: false'
            echo '- fixture admission authorization: false'
            echo '- model/probability authorization: false'
            echo '- SportyBet pricing/selection authorization: false'
            echo '- accumulator authorization: false'
            echo '- bet authorization: false'
          } >> "${GITHUB_STEP_SUMMARY}"
