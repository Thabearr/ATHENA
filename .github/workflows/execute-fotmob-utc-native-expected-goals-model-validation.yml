name: Execute Reviewed FotMob UTC-Native Expected-Goals Model Validation

on:
  issue_comment:
    types: [created]

concurrency:
  group: athena-fotmob-utc-native-expected-goals-model-validation
  cancel-in-progress: false

jobs:
  execute:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 145 &&
      github.event.comment.user.login == 'Thabearr' &&
      startsWith(github.event.comment.body, '/athena-run-fotmob-utc-native-expected-goals-validation')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Validate one-shot owner command and current main
        id: guard
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const controlPr = 145;
            const upstreamPr = 139;
            const upstreamResultCommentId = 5311318782;
            const failedPreAttemptReconciliationCommentId = 5317758294;
            const commandName = '/athena-run-fotmob-utc-native-expected-goals-validation';
            const confirmation =
              'confirm: EXECUTE_REVIEWED_21129_UTC_NATIVE_EXPECTED_GOALS_MODEL_VALIDATION';

            if (context.issue.number !== controlPr) {
              core.setFailed(`Expected-goals model-validation execution is bound only to PR #${controlPr}.`);
              return;
            }

            const body = String(context.payload.comment.body || '').replace(/\r\n/g, '\n');
            const lines = body.split('\n').map((line) => line.trim()).filter(Boolean);
            if (lines.length !== 3 || lines[0] !== commandName) {
              core.setFailed('Expected-goals model-validation command framing is invalid.');
              return;
            }
            const shaMatch = /^main-sha: ([0-9a-f]{40})$/.exec(lines[1]);
            if (!shaMatch) {
              core.setFailed('Expected-goals model-validation command requires one exact lowercase 40-hex main-sha.');
              return;
            }
            if (lines[2] !== confirmation) {
              core.setFailed('Expected-goals model-validation command is missing the exact confirmation token.');
              return;
            }
            const expectedMain = shaMatch[1];

            const { data: control } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: controlPr,
            });
            if (!control.merged_at || control.state !== 'closed') {
              core.setFailed('Expected-goals execution-control PR must already be merged and closed.');
              return;
            }

            const { data: repository } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const { data: ref } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${repository.default_branch}`,
            });
            if (ref.object.sha !== expectedMain) {
              core.setFailed(
                `Current ${repository.default_branch}=${ref.object.sha} differs from requested ${expectedMain}.`
              );
              return;
            }

            const upstreamComments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: upstreamPr,
              per_page: 100,
            });
            const upstreamMarker =
              '<!-- ATHENA_FOTMOB_UTC_NATIVE_FEATURE_QUALIFICATION_RESULT_V2 -->';
            const upstream = upstreamComments.find((comment) => {
              const text = String(comment.body || '');
              return (
                comment.id === upstreamResultCommentId &&
                comment.user &&
                comment.user.login === 'github-actions[bot]' &&
                text.startsWith(upstreamMarker) &&
                text.includes('run-id: 31990121181') &&
                text.includes('main-sha: cd67be14f6a4f09484d18a57de360b8a5d4c51d7') &&
                text.includes('runner-exit-code: 0') &&
                text.includes('artifact-download-outcome: success') &&
                text.includes('package-outcome: success') &&
                text.includes('artifact-upload-outcome: success') &&
                text.includes('verification-outcome: success') &&
                text.includes(
                  'state: EXECUTION_COMPLETED_EXACT_PR119_UTC_NATIVE_FEATURE_PROJECTION_EVIDENCE_PRESERVED_V2'
                ) &&
                text.includes(
                  'artifact-name: fotmob-utc-native-feature-qualification-v2-31990121181'
                ) &&
                text.includes(
                  'Feature qualification evidence only. No model, pricing, selection, production, or BET authority is granted.'
                )
              );
            });
            if (!upstream) {
              core.setFailed('Exact successful V2 feature-qualification result receipt is missing or changed.');
              return;
            }

            const markerPrefix =
              '<!-- ATHENA_FOTMOB_UTC_NATIVE_EXPECTED_GOALS_MODEL_VALIDATION_ATTEMPT -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: controlPr,
              per_page: 100,
            });
            const reconciliationMarker =
              '<!-- ATHENA_FOTMOB_UTC_NATIVE_EXPECTED_GOALS_MODEL_VALIDATION_FAILED_PRE_ATTEMPT_RECONCILIATION -->';
            const reconciliation = comments.find((comment) => {
              const text = String(comment.body || '');
              return (
                comment.id === failedPreAttemptReconciliationCommentId &&
                comment.user &&
                comment.user.login === 'Thabearr' &&
                text.startsWith(reconciliationMarker) &&
                text.includes('run-id: 32046244761') &&
                text.includes('main-sha: 21bff3fe96e8c9b250c9776240ba7bede9f74c89') &&
                text.includes('command-comment-id: 5317747534') &&
                text.includes('attempt-marker-created: false') &&
                text.includes('validator-executed: false') &&
                text.includes('research-training-executed: false') &&
                text.includes('failure-artifact-id: 9292984849') &&
                text.includes(
                  'failure-artifact-sha256: 91965dee1fdb496e776a914de9a9e789a830141ea6b17276a7b1bade541835c1'
                ) &&
                text.includes(
                  'state: FAILED_BEFORE_DURABLE_ATTEMPT_MARKER_NO_MODEL_VALIDATION_EXECUTED'
                )
              );
            });
            if (!reconciliation) {
              core.setFailed('Exact failed pre-attempt reconciliation receipt is missing or changed.');
              return;
            }
            const priorMarker = comments.find(
              (comment) => String(comment.body || '').startsWith(markerPrefix)
            );
            if (priorMarker) {
              core.setFailed(
                `A prior expected-goals validation attempt marker exists at comment ${priorMarker.id}; ` +
                'automatic replay is forbidden and requires reviewed reconciliation.'
              );
              return;
            }

            const marker = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: controlPr,
              body: [
                markerPrefix,
                'ATHENA reviewed FotMob UTC-native expected-goals model-validation attempt started.',
                `run-id: ${context.runId}`,
                `main-sha: ${expectedMain}`,
                `command-comment-id: ${context.payload.comment.id}`,
                `upstream-v2-result-comment-id: ${upstream.id}`,
                'state: ATTEMPT_STARTED_NO_RESULT_YET',
                'Automatic replay is forbidden if this run does not complete cleanly.',
              ].join('\n'),
            });

            core.setOutput('main_sha', expectedMain);
            core.setOutput('marker_comment_id', String(marker.data.id));
            core.setOutput('upstream_result_comment_id', String(upstream.id));

      - name: Check out exact authorized main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.guard.outputs.main_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify reviewed validator and frozen transitive dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.guard.outputs.main_sha }}"
          test "$(git rev-parse HEAD:domain/fotmob_utc_native_expected_goals_model_validation.py)" = "0421506b9e6e398c3469bb69196ef8fcad04f2a5"
          test "$(git rev-parse HEAD:domain/fotmob_utc_native_expected_goals_model_validation_source_bound.py)" = "89cbe2e948c4f69339c89df00db0282e14b955e8"
          test "$(git rev-parse HEAD:scripts/validate_fotmob_utc_native_expected_goals_model.py)" = "d3dddecbd66b79887aef547abcd048f40a57e2a8"
          test "$(git rev-parse HEAD:domain/fotmob_utc_native_expected_goals_model_validation_protocol.py)" = "1780330c4d0ab9140f0b2f6c776dfe79073ca7f8"
          test "$(git rev-parse HEAD:domain/historical_expected_goals_successor_robustness_evaluator.py)" = "28e33a625c02c7f005232d6c5d05d6a0a52397b7"
          test "$(git rev-parse HEAD:domain/historical_expected_goals_component_validation.py)" = "cc75af78cb6af4e3b7ebed5c3569384f2f809bf5"

      - name: Verify preserved V2 feature artifact metadata
        id: artifact_meta
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const artifactId = 9275052993;
            const expected = {
              name: 'fotmob-utc-native-feature-qualification-v2-31990121181',
              size: 23349191,
              digest: 'sha256:f69ffad8f47faadb3ec743c96efa35fb6f4b43776a7650cf0414fb40455d29eb',
              runId: 31990121181,
              headSha: 'cd67be14f6a4f09484d18a57de360b8a5d4c51d7',
            };
            const { data: artifact } = await github.rest.actions.getArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifactId,
            });
            if (artifact.id !== artifactId) core.setFailed('V2 result artifact ID changed.');
            if (artifact.name !== expected.name) core.setFailed('V2 result artifact name changed.');
            if (artifact.size_in_bytes !== expected.size) core.setFailed('V2 result artifact size changed.');
            if (artifact.expired) core.setFailed('V2 result artifact is expired.');
            if (artifact.digest !== expected.digest) core.setFailed('V2 result artifact digest changed.');
            if (!artifact.workflow_run || artifact.workflow_run.id !== expected.runId) {
              core.setFailed('V2 result artifact workflow-run identity changed.');
            }
            if (!artifact.workflow_run || artifact.workflow_run.head_sha !== expected.headSha) {
              core.setFailed('V2 result artifact source head changed.');
            }
            core.setOutput('artifact_id', String(artifactId));
            core.setOutput('artifact_name', artifact.name);
            core.setOutput('artifact_size', String(artifact.size_in_bytes));
            core.setOutput('artifact_digest', artifact.digest);
            core.setOutput('artifact_run_id', String(artifact.workflow_run.id));
            core.setOutput('artifact_head_sha', artifact.workflow_run.head_sha);

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Download and verify exact preserved V2 artifact archive
        id: artifact_download
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact_meta.outputs.artifact_id }}
          EXPECTED_SHA256: f69ffad8f47faadb3ec743c96efa35fb6f4b43776a7650cf0414fb40455d29eb
          EXPECTED_SIZE: '23349191'
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > fotmob-utc-native-feature-qualification-v2.zip
          actual_size="$(stat -c '%s' fotmob-utc-native-feature-qualification-v2.zip)"
          actual_sha256="$(sha256sum fotmob-utc-native-feature-qualification-v2.zip | awk '{print $1}')"
          test "${actual_size}" = "${EXPECTED_SIZE}"
          test "${actual_sha256}" = "${EXPECTED_SHA256}"
          echo "size=${actual_size}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${actual_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Record expected-goals validation execution metadata
        env:
          AUTHORIZED_MAIN_SHA: ${{ steps.guard.outputs.main_sha }}
          UPSTREAM_RESULT_COMMENT_ID: ${{ steps.guard.outputs.upstream_result_comment_id }}
          ARTIFACT_ID: ${{ steps.artifact_meta.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ steps.artifact_meta.outputs.artifact_name }}
          ARTIFACT_SIZE: ${{ steps.artifact_download.outputs.size }}
          ARTIFACT_SHA256: ${{ steps.artifact_download.outputs.sha256 }}
          ARTIFACT_RUN_ID: ${{ steps.artifact_meta.outputs.artifact_run_id }}
          ARTIFACT_HEAD_SHA: ${{ steps.artifact_meta.outputs.artifact_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          payload = {
              'schema_version': 1,
              'execution_boundary': 'EXECUTE_REVIEWED_FOTMOB_UTC_NATIVE_EXPECTED_GOALS_MODEL_VALIDATION',
              'authorized_main_sha': os.environ['AUTHORIZED_MAIN_SHA'],
              'github_run_id': int(os.environ['GITHUB_RUN_ID']),
              'github_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'upstream_v2_result_comment_id': int(os.environ['UPSTREAM_RESULT_COMMENT_ID']),
              'validator_blob_sha': '0421506b9e6e398c3469bb69196ef8fcad04f2a5',
              'source_bound_validator_blob_sha': '89cbe2e948c4f69339c89df00db0282e14b955e8',
              'cli_blob_sha': 'd3dddecbd66b79887aef547abcd048f40a57e2a8',
              'protocol_blob_sha': '1780330c4d0ab9140f0b2f6c776dfe79073ca7f8',
              'historical_fitter_blob_sha': '28e33a625c02c7f005232d6c5d05d6a0a52397b7',
              'historical_component_validation_blob_sha': 'cc75af78cb6af4e3b7ebed5c3569384f2f809bf5',
              'preserved_artifact_id': int(os.environ['ARTIFACT_ID']),
              'preserved_artifact_name': os.environ['ARTIFACT_NAME'],
              'preserved_artifact_size_bytes': int(os.environ['ARTIFACT_SIZE']),
              'preserved_artifact_sha256': os.environ['ARTIFACT_SHA256'],
              'preserved_artifact_run_id': int(os.environ['ARTIFACT_RUN_ID']),
              'preserved_artifact_head_sha': os.environ['ARTIFACT_HEAD_SHA'],
              'qualified_projection_rows': 21326,
              'complete_case_rows': 21129,
              'training_rows': 14181,
              'evaluation_rows': 6948,
              'network_performed_by_model_validator': False,
              'external_python_package_install_performed': False,
              'started_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00', 'Z'),
          }
          Path('xg-validation-execution-metadata.json').write_text(
              json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Execute exact offline source-bound expected-goals validation
        id: execute_validation
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          set +e
          set -o pipefail
          python -m scripts.validate_fotmob_utc_native_expected_goals_model \
            fotmob-utc-native-feature-qualification-v2.zip \
            --predictions-output fotmob-utc-native-xg-validation-predictions.ndjson \
            --receipt-output fotmob-utc-native-xg-validation-receipt.json \
            2>&1 | tee fotmob-utc-native-xg-validation-run.log
          runner_exit=${PIPESTATUS[0]}
          echo "exit_code=${runner_exit}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Package immutable expected-goals validation evidence
        id: package
        if: always()
        env:
          RUNNER_EXIT_CODE: ${{ steps.execute_validation.outputs.exit_code }}
          AUTHORIZED_MAIN_SHA: ${{ steps.guard.outputs.main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p xg-validation-artifact
          for path in \
            xg-validation-execution-metadata.json \
            fotmob-utc-native-xg-validation-run.log \
            fotmob-utc-native-xg-validation-receipt.json \
            fotmob-utc-native-xg-validation-predictions.ndjson
          do
            if [ -f "${path}" ]; then
              cp "${path}" xg-validation-artifact/
            else
              printf 'ABSENT\n' > "xg-validation-artifact/${path}.absent"
            fi
          done

          if [ -f fotmob-utc-native-feature-qualification-v2.zip ]; then
            sha256sum fotmob-utc-native-feature-qualification-v2.zip > xg-validation-artifact/source-artifact.zip.sha256
            stat -c '%s' fotmob-utc-native-feature-qualification-v2.zip > xg-validation-artifact/source-artifact.zip.size
          else
            printf 'ABSENT\n' > xg-validation-artifact/source-artifact.zip.absent
          fi

          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          payload = {
              'schema_version': 1,
              'execution_boundary': 'EXECUTE_REVIEWED_FOTMOB_UTC_NATIVE_EXPECTED_GOALS_MODEL_VALIDATION',
              'authorized_main_sha': os.environ.get('AUTHORIZED_MAIN_SHA', ''),
              'github_run_id': int(os.environ['GITHUB_RUN_ID']),
              'github_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'runner_exit_code': os.environ.get('RUNNER_EXIT_CODE', ''),
              'packaged_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00', 'Z'),
              'artifact_is_research_evidence_only': True,
              'automatic_model_approval': False,
              'expected_goals_production_authorized': False,
              'score_matrix_authorized': False,
              'probability_inference_authorized': False,
              'pricing_authorized': False,
              'selection_authorized': False,
              'production_approval_authorized': False,
              'bet_authorized': False,
          }
          Path('xg-validation-artifact/execution-envelope.json').write_text(
              json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          PY

          (
            cd xg-validation-artifact
            find . -maxdepth 1 -type f ! -name files.sha256 -print0 \
              | sort -z \
              | xargs -0 sha256sum > files.sha256
          )

      - name: Upload expected-goals validation evidence even on failure
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fotmob-utc-native-expected-goals-validation-${{ github.run_id }}
          path: xg-validation-artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Verify exact expected-goals validation result
        id: verify
        if: always()
        env:
          RUNNER_EXIT_CODE: ${{ steps.execute_validation.outputs.exit_code }}
          ARTIFACT_DOWNLOAD_OUTCOME: ${{ steps.artifact_download.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_EXIT_CODE}" = "0"
          test "${ARTIFACT_DOWNLOAD_OUTCOME}" = "success"
          test "${PACKAGE_OUTCOME}" = "success"
          test "${UPLOAD_OUTCOME}" = "success"
          test -f fotmob-utc-native-xg-validation-receipt.json
          test -f fotmob-utc-native-xg-validation-predictions.ndjson

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          import domain.fotmob_utc_native_expected_goals_model_validation as evaluator
          import domain.fotmob_utc_native_expected_goals_model_validation_protocol as protocol
          import domain.fotmob_utc_native_expected_goals_model_validation_source_bound as source_bound

          receipt_path = Path('fotmob-utc-native-xg-validation-receipt.json')
          predictions_path = Path('fotmob-utc-native-xg-validation-predictions.ndjson')
          receipt_raw = receipt_path.read_bytes()
          receipt = json.loads(receipt_raw)

          if source_bound.canonical_source_bound_receipt_bytes(receipt) != receipt_raw:
              raise SystemExit('source-bound validation receipt is not exact canonical JSON')

          allowed_states = {evaluator.STRONG_STATE, evaluator.WEAK_STATE}
          if receipt.get('source_bound_id') != source_bound.SOURCE_BOUND_ID:
              raise SystemExit('source-bound validation identity changed')
          if receipt.get('implementation_state') != evaluator.IMPLEMENTATION_STATE:
              raise SystemExit('validator implementation state changed')
          if receipt.get('validation_state') not in allowed_states:
              raise SystemExit('validation state is outside reviewed vocabulary')
          if receipt.get('next_required_boundary') != evaluator.NEXT_REQUIRED_BOUNDARY:
              raise SystemExit('next required review boundary changed')
          if receipt.get('research_training_executed') is not True:
              raise SystemExit('research training did not execute')
          if receipt.get('automatic_model_approval') is not False:
              raise SystemExit('validation unexpectedly auto-approved a model')

          source = receipt.get('source_evidence', {})
          expected_source = {
              'artifact_id': 9275052993,
              'artifact_name': 'fotmob-utc-native-feature-qualification-v2-31990121181',
              'artifact_sha256': 'f69ffad8f47faadb3ec743c96efa35fb6f4b43776a7650cf0414fb40455d29eb',
              'artifact_size_bytes': 23349191,
              'qualification_run_id': 31990121181,
              'qualification_result_comment_id': 5311318782,
              'projection_member': 'utc-native-feature-projection-v2.ndjson',
              'projection_sha256': '5519ef40db3efc678c9eef73046c0e577e5f33a85f11b3fe043fc22bca2fcfed',
              'projection_size_bytes': 23342076,
              'projection_record_count': 21326,
          }
          for key, expected in expected_source.items():
              if source.get(key) != expected:
                  raise SystemExit(f'source evidence changed: {key}')

          input_projection = receipt.get('input_projection', {})
          if input_projection.get('record_count') != 21326:
              raise SystemExit('qualified projection row count changed')
          if input_projection.get('complete_case_count') != 21129:
              raise SystemExit('complete-case count changed')
          if input_projection.get('dropped_incomplete_count') != 197:
              raise SystemExit('dropped incomplete count changed')
          membership = input_projection.get('membership', {})
          expected_membership = {
              'all_complete': (21129, '1374fd323bd5aa7e6da6cee23358621c26435297c2e195553e227373008fd8ed'),
              'train': (14181, '4c017b9e43ab9e2f231e88187339a3960c5fdfbd087f21ba92ca8855576219a9'),
              'evaluation_a': (3471, '4361cd60976170bd14442502025160d9b3aa97717fb94afc1b68eee9b88c429f'),
              'evaluation_b': (3477, '4910b5db577bd87fd4bed4e24f3b1e00dff85d58f23e7ea8558cfba0aa5efd59'),
              'pooled_evaluation': (6948, 'f4d713a739feeac90c166f5125dd80ab7e3063598f9ad0187f07d10b88e5bcdc'),
          }
          for name, (count, digest) in expected_membership.items():
              value = membership.get(name, {})
              if value.get('count') != count or value.get('membership_sha256') != digest:
                  raise SystemExit(f'frozen {name} membership changed')

          arm_membership = receipt.get('arm_membership', {})
          if set(arm_membership) != set(evaluator.MODEL_IDS):
              raise SystemExit('model-arm membership set changed')
          train_membership = membership['train']
          for model_id in evaluator.MODEL_IDS:
              value = arm_membership[model_id]
              fit = value.get('fit_membership')
              if model_id == 'HISTORICAL_FIXED_COEFFICIENT_TRANSFER':
                  if fit is not None:
                      raise SystemExit('fixed-transfer arm unexpectedly has fit membership')
              elif fit != train_membership:
                  raise SystemExit(f'{model_id} fit membership changed')
              for name in ('evaluation_a', 'evaluation_b', 'pooled_evaluation'):
                  if value.get(name) != membership[name]:
                      raise SystemExit(f'{model_id} {name} membership changed')

          evaluation = receipt.get('evaluation', {})
          populations = evaluation.get('populations', {})
          expected_populations = {
              'EVALUATION_A': 3471,
              'EVALUATION_B_TERMINAL': 3477,
              'POOLED_A_PLUS_B': 6948,
          }
          protocol_payload = protocol.build_fotmob_utc_native_expected_goals_model_validation_protocol()
          required_deltas = set(protocol_payload['evaluation_contract']['required_paired_deltas'])
          for population_name, expected_count in expected_populations.items():
              population = populations.get(population_name, {})
              models = population.get('models', {})
              if set(models) != set(evaluator.MODEL_IDS):
                  raise SystemExit(f'{population_name} model-arm set changed')
              for model_id, model in models.items():
                  if model.get('fixture_count') != expected_count:
                      raise SystemExit(f'{population_name} {model_id} fixture count changed')
              if set(population.get('paired_nll_deltas', {})) != required_deltas:
                  raise SystemExit(f'{population_name} paired-delta set changed')

          checks = evaluation.get('strong_signal_checks', {})
          required_checks = protocol_payload['evaluation_contract']['strong_signal_rule']
          if set(checks) != set(required_checks):
              raise SystemExit('strong-signal check set changed')
          if any(type(value) is not bool for value in checks.values()):
              raise SystemExit('strong-signal checks must be exact booleans')
          if (receipt['validation_state'] == evaluator.STRONG_STATE) != all(checks.values()):
              raise SystemExit('validation state is inconsistent with strong-signal checks')

          if evaluation.get('competition_or_league_robustness_status') != (
              'BLOCKED_PROJECTION_DOES_NOT_CARRY_COMPETITION_IDENTITY'
          ):
              raise SystemExit('competition/league robustness status changed')

          temporal = evaluation.get('temporal_robustness', {})
          if temporal.get('population_rows') != 6948 or temporal.get('cluster_count') != 9:
              raise SystemExit('temporal robustness population changed')
          expected_quarters = [
              ('2024-Q3', 626),
              ('2024-Q4', 1017),
              ('2025-Q1', 1073),
              ('2025-Q2', 755),
              ('2025-Q3', 599),
              ('2025-Q4', 1020),
              ('2026-Q1', 1097),
              ('2026-Q2', 721),
              ('2026-Q3', 40),
          ]
          deletes = temporal.get('delete_quarters', [])
          actual_quarters = [
              (item.get('quarter'), item.get('omitted_fixture_count'))
              for item in deletes
          ]
          if actual_quarters != expected_quarters:
              raise SystemExit('UTC-quarter jackknife cluster identity changed')

          runtime = receipt.get('runtime_provenance', {})
          if runtime.get('cross_runtime_bit_identity_claimed') is not False:
              raise SystemExit('cross-runtime bit identity was unexpectedly claimed')
          if runtime.get('known_pr77_machine_precision_canonicalization_gap_cleared') is not False:
              raise SystemExit('PR77 runtime portability gap was unexpectedly cleared')

          safety = receipt.get('safety')
          if (
              not isinstance(safety, dict)
              or set(safety) != set(protocol.SAFETY_KEYS)
              or any(type(value) is not bool or value is not False for value in safety.values())
          ):
              raise SystemExit('one or more downstream authority flags changed')

          predictions_raw = predictions_path.read_bytes()
          prediction_receipt = receipt.get('predictions', {})
          if prediction_receipt.get('record_count') != 6948:
              raise SystemExit('prediction record count changed')
          if hashlib.sha256(predictions_raw).hexdigest() != prediction_receipt.get('sha256'):
              raise SystemExit('prediction SHA-256 differs from receipt')
          if len(predictions_raw) != prediction_receipt.get('size_bytes'):
              raise SystemExit('prediction size differs from receipt')

          lines = predictions_raw.splitlines(keepends=True)
          if len(lines) != 6948:
              raise SystemExit('prediction NDJSON does not contain exactly 6,948 rows')
          fixture_ids = set()
          population_counts = {'EVALUATION_A': 0, 'EVALUATION_B_TERMINAL': 0}
          for line in lines:
              row = json.loads(line)
              canonical = (
                  json.dumps(
                      row,
                      ensure_ascii=False,
                      allow_nan=False,
                      sort_keys=True,
                      separators=(',', ':'),
                  ) + '\n'
              ).encode('utf-8')
              if line != canonical:
                  raise SystemExit('prediction NDJSON contains a non-canonical row')
              fixture_id = row.get('fixture_identifier')
              if type(fixture_id) is not str or not fixture_id or fixture_id in fixture_ids:
                  raise SystemExit('prediction fixture identity is missing or duplicated')
              fixture_ids.add(fixture_id)
              population = row.get('population')
              if population not in population_counts:
                  raise SystemExit('prediction row has unexpected population')
              population_counts[population] += 1
              if set(row.get('predictions', {})) != set(evaluator.MODEL_IDS):
                  raise SystemExit('prediction row model-arm set changed')
          if population_counts != {'EVALUATION_A': 3471, 'EVALUATION_B_TERMINAL': 3477}:
              raise SystemExit('prediction population counts changed')
          PY

      - name: Record expected-goals validation result on control PR
        if: ${{ always() && steps.guard.outputs.marker_comment_id != '' }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          AUTHORIZED_MAIN_SHA: ${{ steps.guard.outputs.main_sha }}
          RUNNER_EXIT_CODE: ${{ steps.execute_validation.outputs.exit_code }}
          ARTIFACT_DOWNLOAD_OUTCOME: ${{ steps.artifact_download.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        with:
          script: |
            const marker =
              '<!-- ATHENA_FOTMOB_UTC_NATIVE_EXPECTED_GOALS_MODEL_VALIDATION_RESULT -->';
            const evidencePreserved =
              process.env.PACKAGE_OUTCOME === 'success' &&
              process.env.UPLOAD_OUTCOME === 'success';
            const resultVerified = process.env.VERIFY_OUTCOME === 'success';
            const outcome = evidencePreserved && resultVerified
              ? 'EXECUTION_COMPLETED_REVIEWED_UTC_NATIVE_EXPECTED_GOALS_MODEL_VALIDATION_EVIDENCE_PRESERVED'
              : 'EXECUTION_NOT_QUALIFIED_REVIEW_MODEL_VALIDATION_ARTIFACT_BEFORE_ANY_RETRY';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 145,
              body: [
                marker,
                'ATHENA reviewed FotMob UTC-native expected-goals model-validation execution result.',
                `run-id: ${context.runId}`,
                `main-sha: ${process.env.AUTHORIZED_MAIN_SHA || ''}`,
                `runner-exit-code: ${process.env.RUNNER_EXIT_CODE || 'unavailable'}`,
                `artifact-download-outcome: ${process.env.ARTIFACT_DOWNLOAD_OUTCOME || 'unavailable'}`,
                `package-outcome: ${process.env.PACKAGE_OUTCOME || 'unavailable'}`,
                `artifact-upload-outcome: ${process.env.UPLOAD_OUTCOME || 'unavailable'}`,
                `verification-outcome: ${process.env.VERIFY_OUTCOME || 'unavailable'}`,
                `state: ${outcome}`,
                `artifact-name: fotmob-utc-native-expected-goals-validation-${context.runId}`,
                'Research model-validation evidence only. Result review is required.',
                'No ScoreMatrix, probability, pricing, selection, production, or BET authority is granted.',
              ].join('\n'),
            });
