# HISTORICAL PROOF / RESEARCH SURFACE ONLY.
# This date-specific direct transport workflow must not be mistaken for the
# canonical ATHENA accumulator execution path.
name: Historical proof — Saturday 2026-08-22 SportyBet direct 20 transport

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/create-saturday-2026-08-22-sportybet-direct-20-code.yml"
      - "artifacts/research-protocols/saturday-2026-08-22-sportybet-final-20-selections-v1.json"
      - "scripts/sportybet_direct_share_bridge.py"
      - "tests/test_sportybet_direct_share_bridge.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sportybet-direct-final-20-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  create:
    name: historical exact 20-selection transport roundtrip (non-canonical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OUTPUT_DIR: .cache/athena-research/sportybet-direct-final-20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Run focused direct-share tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest -q tests/test_sportybet_direct_share_bridge.py

      - name: Historical proof only — direct 20-selection round-trip
        id: create
        continue-on-error: true
        run: |
          mkdir -p .cache/athena-research
          python scripts/sportybet_direct_share_bridge.py \
            --selections artifacts/research-protocols/saturday-2026-08-22-sportybet-final-20-selections-v1.json \
            --output-dir "${OUTPUT_DIR}" | tee "${OUTPUT_DIR}.summary.json"

      - name: Upload exact 20-fold booking-code evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: saturday-2026-08-22-sportybet-direct-final-20-code
          path: |
            .cache/athena-research/sportybet-direct-final-20
            .cache/athena-research/sportybet-direct-final-20.summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Require exact 20-selection roundtrip success
        if: always()
        env:
          CREATE_OUTCOME: ${{ steps.create.outcome }}
        run: |
          echo "create outcome: ${CREATE_OUTCOME}"
          test "${CREATE_OUTCOME}" = "success"
