      - name: Upload canonical part 016
        uses: actions/upload-artifact@v4
        with:
          name: athena-canonical-part-016
          path: drive-transfer/athena-history-canonical.zip.part016.part
          compression-level: 0
          retention-days: 30
      - name: Upload canonical part 017
        uses: actions/upload-artifact@v4
        with:
          name: athena-canonical-part-017
          path: drive-transfer/athena-history-canonical.zip.part017.part
          compression-level: 0
          retention-days: 30
      - name: Upload canonical part 018
        uses: actions/upload-artifact@v4
        with:
          name: athena-canonical-part-018
          path: drive-transfer/athena-history-canonical.zip.part018.part
          compression-level: 0
          retention-days: 30
      - name: Upload canonical part 019
        uses: actions/upload-artifact@v4
        with:
          name: athena-canonical-part-019
          path: drive-transfer/athena-history-canonical.zip.part019.part
          compression-level: 0
          retention-days: 30
      - name: Upload canonical part 020
        uses: actions/upload-artifact@v4
        with:
          name: athena-canonical-part-020
          path: drive-transfer/athena-history-canonical.zip.part020.part
          compression-level: 0
          retention-days: 30
      - name: Upload canonical part 021
        uses: actions/upload-artifact@v4
        with:
          name: athena-canonical-part-021
          path: drive-transfer/athena-history-canonical.zip.part021.part
          compression-level: 0
          retention-days: 30
      - name: Upload canonical part 022
        uses: actions/upload-artifact@v4
        with:
          name: athena-canonical-part-022
          path: drive-transfer/athena-history-canonical.zip.part022.part
          compression-level: 0
          retention-days: 30

      - name: Publish run pointer on automation branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${POINTER_BRANCH}"
          mkdir -p ops
          cat > ops/last_canonical_drive_transfer_run.json <<EOF
          {
            "run_id": ${GITHUB_RUN_ID},
            "run_attempt": ${GITHUB_RUN_ATTEMPT},
            "source_run_id": ${SOURCE_RUN_ID},
            "source_artifact_id": ${SOURCE_ARTIFACT_ID},
            "source_archive_sha256": "${EXPECTED_ARCHIVE_SHA256}",
            "part_count": 23,
            "head_sha": "${GITHUB_SHA}"
          }
          EOF
          git add ops/last_canonical_drive_transfer_run.json
          git commit -m "Record canonical Drive transfer run ${GITHUB_RUN_ID}"
          git push --force origin "HEAD:refs/heads/${POINTER_BRANCH}"
