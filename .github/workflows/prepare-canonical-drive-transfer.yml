name: Prepare Canonical Database Drive Transfer

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful historical warehouse run containing athena-history-sqlite"
        required: true
        default: "32628985683"
        type: string
      source_artifact_id:
        description: "GitHub artifact ID for athena-history-sqlite"
        required: true
        default: "9491418446"
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/prepare-canonical-drive-transfer.yml"

permissions:
  actions: read
  contents: write

jobs:
  prepare-drive-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id || '32628985683' }}
      SOURCE_ARTIFACT_ID: ${{ github.event.inputs.source_artifact_id || '9491418446' }}
      EXPECTED_ARCHIVE_BYTES: "2149256220"
      EXPECTED_ARCHIVE_SHA256: "a783886d0906e357e26851fcb3eb182bb06bdcc184d21f2b6578bb3d1fa61511"
      ARCHIVE_NAME: athena-history-canonical.zip
      POINTER_BRANCH: automation/canonical-drive-transfer-pointer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download canonical artifact archive exactly as stored by GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p source-artifact
          ARCHIVE_PATH="source-artifact/${ARCHIVE_NAME}"
          curl --fail --show-error --silent --location --retry 5 --retry-delay 2 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o "${ARCHIVE_PATH}"

          actual_bytes="$(stat -c '%s' "${ARCHIVE_PATH}")"
          actual_sha="$(sha256sum "${ARCHIVE_PATH}" | awk '{print $1}')"
          echo "Downloaded ${ARCHIVE_PATH}: ${actual_bytes} bytes"
          echo "SHA-256: ${actual_sha}"

          test "${actual_bytes}" = "${EXPECTED_ARCHIVE_BYTES}"
          test "${actual_sha}" = "${EXPECTED_ARCHIVE_SHA256}"

      - name: Split archive into Drive-safe parts and build manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p drive-transfer
          ARCHIVE_PATH="source-artifact/${ARCHIVE_NAME}"

          split -b 90M -d -a 3 --additional-suffix=.part \
            "${ARCHIVE_PATH}" "drive-transfer/${ARCHIVE_NAME}.part"

          PART_COUNT="$(find drive-transfer -maxdepth 1 -type f -name '${ARCHIVE_NAME}.part*.part' | wc -l | tr -d ' ')"
          if [ "${PART_COUNT}" != "23" ]; then
            echo "Expected exactly 23 parts, got ${PART_COUNT}" >&2
            exit 1
          fi

          sha256sum "${ARCHIVE_PATH}" > drive-transfer/ATHENA_CANONICAL_ARCHIVE_SHA256.txt
          sha256sum drive-transfer/${ARCHIVE_NAME}.part*.part > drive-transfer/ATHENA_PART_SHA256.txt

          cat > drive-transfer/README.txt <<EOF
          ATHENA canonical historical database transfer
          Source historical warehouse run: ${SOURCE_RUN_ID}
          Source artifact ID: ${SOURCE_ARTIFACT_ID}
          Canonical archive: ${ARCHIVE_NAME}
          Canonical archive bytes: ${EXPECTED_ARCHIVE_BYTES}
          Canonical archive SHA-256: ${EXPECTED_ARCHIVE_SHA256}
          Number of parts: ${PART_COUNT}

          Download and extract every athena-canonical-part-NNN.zip. Put all resulting *.part files in one directory.

          Linux/macOS:
            cat ${ARCHIVE_NAME}.part*.part > ${ARCHIVE_NAME}
            sha256sum ${ARCHIVE_NAME}
            unzip ${ARCHIVE_NAME}

          Windows PowerShell:
            \$parts = Get-ChildItem ${ARCHIVE_NAME}.part*.part | Sort-Object Name
            \$out = [System.IO.File]::Create('${ARCHIVE_NAME}')
            foreach (\$p in \$parts) {
              \$input = [System.IO.File]::OpenRead(\$p.FullName)
              \$input.CopyTo(\$out)
              \$input.Dispose()
            }
            \$out.Dispose()
            Get-FileHash ${ARCHIVE_NAME} -Algorithm SHA256
            Expand-Archive ${ARCHIVE_NAME} -DestinationPath .

          The reconstructed ZIP SHA-256 must equal the canonical archive SHA-256 above.
          The ZIP contains athena_history.db.
          EOF

          echo "Prepared ${PART_COUNT} parts"
          ls -lh drive-transfer

      - name: Upload transfer manifest
        uses: actions/upload-artifact@v4
        with:
          name: athena-canonical-manifest
          path: |
            drive-transfer/README.txt
            drive-transfer/ATHENA_CANONICAL_ARCHIVE_SHA256.txt
            drive-transfer/ATHENA_PART_SHA256.txt
          compression-level: 0
          retention-days: 30

      - name: Upload canonical part 000
        uses: actions/upload-artifact@v4
        with:
          name: athena-canonical-part-000
          path: drive-transfer/athena-history-canonical.zip.part000.part
          compression-level: 0
          retention-days: 30
      - name: Upload canonical part 001
        uses: actions/upload-artifact@v4
        with:
          name: athena-canonical-part-001
          path: drive-transfer/athena-history-canonical.zip.part001.part
          compression-level: 0
          retention-days: 30
      - name: Upload canonical part 002
        uses: actions/upload-artifact@v4
        with:
          name: athena-canonical-part-002
          path: drive-transfer/athena-history-canonical.zip.part002.part
          compression-level: 0
          retention-days: 30
      - name: Upload canonical part 003
        uses: actions/upload-artifact@v4
        with:
          name: athena-canonical-part-003
          path: drive-transfer/athena-history-canonical.zip.part003.part
          compression-level: 0
          retention-days: 30
      - name: Upload canonical part 004
        uses: actions/upload-artifact@v4
        with:
          name: athena-canonical-part-004
          path: drive-transfer/athena-history-canonical.zip.part004.part
          compression-level: 0
          retention-days: 30
      - name: Upload canonical part 005
        uses: actions/upload-artifact@v4
        with:
          name: athena-canonical-part-005
          path: drive-transfer/athena-history-canonical.zip.part005.part
          compression-level: 0
          retention-days: 30
      - name: Upload canonical part 006
        uses: actions/upload-artifact@v4
        with:
          name: athena-canonical-part-006
          path: drive-transfer/athena-history-canonical.zip.part006.part
          compression-level: 0
          retention-days: 30
      - name: Upload canonical part 007
        uses: actions/upload-artifact@v4
        with:
          name: athena-canonical-part-007
          path: drive-transfer/athena-history-canonical.zip.part007.part
          compression-level: 0
          retention-days: 30
      - name: Upload canonical part 008
        uses: actions/upload-artifact@v4
        with:
          name: athena-canonical-part-008
          path: drive-transfer/athena-history-canonical.zip.part008.part
          compression-level: 0
          retention-days: 30
      - name: Upload canonical part 009
        uses: actions/upload-artifact@v4
        with:
          name: athena-canonical-part-009
          path: drive-transfer/athena-history-canonical.zip.part009.part
          compression-level: 0
          retention-days: 30
      - name: Upload canonical part 010
        uses: actions/upload-artifact@v4
        with:
          name: athena-canonical-part-010
          path: drive-transfer/athena-history-canonical.zip.part010.part
          compression-level: 0
          retention-days: 30
      - name: Upload canonical part 011
        uses: actions/upload-artifact@v4
        with:
          name: athena-canonical-part-011
          path: drive-transfer/athena-history-canonical.zip.part011.part
          compression-level: 0
          retention-days: 30
      - name: Upload canonical part 012
        uses: actions/upload-artifact@v4
        with:
          name: athena-canonical-part-012
