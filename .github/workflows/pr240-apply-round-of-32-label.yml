name: PR240 Apply UEL Round of 32 Source Label

on:
  push:
    branches:
      - feature/pr240-uel-round-of-32-source-label
    paths:
      - .github/workflows/pr240-apply-round-of-32-label.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/pr240-uel-round-of-32-source-label
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Apply frozen source-label revision
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import importlib.util
          import sys

          sys.dont_write_bytecode = True
          module_path = Path('domain/uefa_competition_stage.py')
          text = module_path.read_text(encoding='utf-8')

          old_policy = 'MAIN_STAGE_POLICY = "OPENFOOTBALL_SOURCE_NATIVE_MAIN_STAGE_LABELS_AND_ERA_V1"'
          new_policy = 'MAIN_STAGE_POLICY = "OPENFOOTBALL_SOURCE_NATIVE_MAIN_STAGE_LABELS_AND_ERA_V2"'
          assert text.count(old_policy) == 1
          text = text.replace(old_policy, new_policy)

          old_mapping = '        "round of 32": UEFACompetitionStage.ROUND_OF_32,\n'
          new_mapping = (
              '        "round of 32": UEFACompetitionStage.ROUND_OF_32,\n'
              '        "sechzehntelfinale": UEFACompetitionStage.ROUND_OF_32,\n'
          )
          assert text.count(old_mapping) == 1
          text = text.replace(old_mapping, new_mapping)
          module_path.write_text(text, encoding='utf-8')

          spec = importlib.util.spec_from_file_location('stage_pr240', module_path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          parent = module.calculate_parent_identity_sha256()
          registry = module.calculate_stage_registry_sha256()
          contract = module.calculate_stage_contract_sha256(parent, registry)
          sidecar = module.calculate_training_sidecar_contract_sha256(contract)

          assert parent == '1ec3df0b5c1a428cf92b1427929acb0c80e04143b90166fdd2e74da8516b8fec'
          assert registry == '3125b6673b30a6706d9f03e335ae79ebca65a9a6c4b291504a7e5ae92a36d69b'
          assert contract == '069a838cf9561243e5f02c56f814c6c458b7a883ec7c4d84d4dcbd95af0154ce'
          assert sidecar == '2c1bfdd6d21892fba7cb1a1df64e02e188cf76c5fb2368716093df4343121014'

          text = module_path.read_text(encoding='utf-8')
          old_contract = 'b009351d6de7dc85cb9bd4a9ad009aad34d36bbe514aa6cf2a0a28791cb35621'
          old_sidecar = 'bc898289751b790084d21101b0171ad651a95c4d179436f0f4ed4df8d41d49f9'
          assert text.count(old_contract) == 1
          assert text.count(old_sidecar) == 1
          text = text.replace(old_contract, contract).replace(old_sidecar, sidecar)
          module_path.write_text(text, encoding='utf-8')
          pycache = module_path.parent / '__pycache__'
          if pycache.is_dir():
              for cached in pycache.glob('uefa_competition_stage*.pyc'):
                  cached.unlink()

          tests = Path('tests/test_uefa_competition_stage.py')
          test_text = tests.read_text(encoding='utf-8')
          marker = 'def test_source_native_uel_sechzehntelfinale_is_round_of_32_and_era_bounded'
          assert marker not in test_text
          test_text += '''\n\n\ndef test_source_native_uel_sechzehntelfinale_is_round_of_32_and_era_bounded(\n    tmp_path: Path,\n) -> None:\n    warehouse = _warehouse(\n        tmp_path / "round32.db",\n        [\n            dict(\n                key="valid",\n                date="2021-02-18",\n                home="A",\n                away="B",\n                stage="Sechzehntelfinale",\n                competition="uefa_uel",\n                season="2020-21",\n                source_path="champions-league-master/2020-21/el.txt",\n            ),\n            dict(\n                key="too-late",\n                date="2022-02-17",\n                home="C",\n                away="D",\n                stage="Sechzehntelfinale",\n                competition="uefa_uel",\n                season="2021-22",\n                source_path="champions-league-master/2021-22/el.txt",\n            ),\n            dict(\n                key="wrong-parent",\n                date="2021-02-18",\n                home="E",\n                away="F",\n                stage="Sechzehntelfinale",\n                competition="uefa_ucl",\n                season="2020-21",\n                source_path="champions-league-master/2020-21/cl.txt",\n            ),\n            dict(\n                key="wrong-phase",\n                date="2021-02-18",\n                home="G",\n                away="H",\n                stage="Sechzehntelfinale",\n                competition="uefa_uel",\n                season="2020-21",\n                source_path="champions-league-master/2020-21/elq.txt",\n            ),\n        ],\n    )\n    rows = {row.match_key: row for row in project_warehouse_uefa_stages(warehouse)}\n\n    assert rows["valid"].competition_stage is UEFACompetitionStage.ROUND_OF_32\n    assert rows["valid"].stage_authorized is True\n    assert rows["valid"].blocker is None\n    assert rows["too-late"].competition_stage is UEFACompetitionStage.UNKNOWN\n    assert rows["too-late"].blocker == "STAGE_NOT_ALLOWED_IN_COMPETITION_ERA"\n    assert rows["wrong-parent"].competition_stage is UEFACompetitionStage.UNKNOWN\n    assert rows["wrong-parent"].blocker == "STAGE_NOT_ALLOWED_IN_COMPETITION_ERA"\n    assert rows["wrong-phase"].competition_stage is UEFACompetitionStage.UNKNOWN\n    assert rows["wrong-phase"].blocker == "SOURCE_PATH_PARENT_OR_PHASE_CONFLICT"\n'''
          tests.write_text(test_text, encoding='utf-8')

          docs = Path('docs/uefa_competition_stage.md')
          doc = docs.read_text(encoding='utf-8')
          assert doc.count(old_contract) == 1
          assert doc.count(old_sidecar) == 1
          doc = doc.replace(old_contract, contract).replace(old_sidecar, sidecar)
          old_bullet = '- UEL / UECL `Playoffs` from 2021-22 onward, matching the introduction of the knockout playoff round in those competitions; and\n'
          new_bullet = (
              '- UEL 2004-05 through 2020-21 `Round of 32`, including the source-native '
              '`Sechzehntelfinale` spelling used by OpenFootball;\n'
              '- UEL / UECL `Playoffs` from 2021-22 onward, matching the introduction of the knockout playoff round in those competitions; and\n'
          )
          assert doc.count(old_bullet) == 1
          doc = doc.replace(old_bullet, new_bullet)
          docs.write_text(doc, encoding='utf-8')
          PY

      - name: Run focused tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest tests/test_uefa_competition_stage.py -q

      - name: Commit source-label revision and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr240-apply-round-of-32-label.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add domain/uefa_competition_stage.py tests/test_uefa_competition_stage.py docs/uefa_competition_stage.md .github/workflows/pr240-apply-round-of-32-label.yml
          git commit -m "[PR240] Recognize source-native UEL Round of 32 label"
          git push origin HEAD:feature/pr240-uel-round-of-32-source-label
