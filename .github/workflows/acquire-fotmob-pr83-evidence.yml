name: Materialize FotMob PR83 evidence

on:
  push:
    branches:
      - feature/fotmob-pr83-post-finish-capture-pair
    paths:
      - .github/workflows/acquire-fotmob-pr83-evidence.yml

permissions:
  actions: read
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feature/fotmob-pr83-post-finish-capture-pair
          fetch-depth: 0

      - name: Download exact reviewed acquisition artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 31822859656 \
            --repo "$GITHUB_REPOSITORY" \
            --name pr83-post-finish-capture-pair-20260814 \
            --dir recovered

      - name: Verify exact capture lineage
        run: |
          test "$(sha256sum recovered/20260814/a18e843fabe5aca74846b160/response.json | cut -d' ' -f1)" = "fbcf24729973dbe7153c87fe9f37bd988aaca14ad10cce6b260ac7df650ff80f"
          test "$(sha256sum recovered/20260814/a18e843fabe5aca74846b160/manifest.json | cut -d' ' -f1)" = "27bfb5dc90c67a305bdb045a7ff33010d87c4109925384d3e6d2a6e058d7b302"
          test "$(sha256sum recovered/20260814/e28d9ce746c1ef9102995517/response.json | cut -d' ' -f1)" = "175c6f94788fbf676e08a288ff0c46a995cd8798d60e4bc5044076e3c9713f8d"
          test "$(sha256sum recovered/20260814/e28d9ce746c1ef9102995517/manifest.json | cut -d' ' -f1)" = "d60501a5b7b1b4e5c810a0a0463bdcecb3a0b806110ad4542c314f8fe536824e"

      - name: Preserve evidence in branch and remove one-shot workflow
        run: |
          mkdir -p evidence/fotmob_data_matches/pr83_post_finish_pair
          cp -a recovered/20260814 evidence/fotmob_data_matches/pr83_post_finish_pair/
          git rm .github/workflows/acquire-fotmob-pr83-evidence.yml
          git add evidence/fotmob_data_matches/pr83_post_finish_pair/20260814
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Preserve reviewed FotMob PR83 capture pair evidence"
          git push origin HEAD:feature/fotmob-pr83-post-finish-capture-pair
