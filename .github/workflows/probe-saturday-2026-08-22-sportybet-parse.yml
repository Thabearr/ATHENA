name: Probe Saturday 2026-08-22 SportyBet Parse bridge

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/probe-saturday-2026-08-22-sportybet-parse.yml"
      - "artifacts/research-protocols/saturday-2026-08-22-sportybet-20-targets-v1.json"
      - "docs/sportybet_parse_booking_bridge.md"
      - "scripts/sportybet_parse_bridge.py"
      - "tests/test_sportybet_parse_bridge.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saturday-sportybet-parse-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: exact live SportyBet provider-native probe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PARSE_API_KEY: ${{ secrets.PARSE_API_KEY }}
      OUTPUT_DIR: .cache/athena-research/sportybet-parse-bridge/probe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require Parse repository secret without printing it
        shell: bash
        run: |
          test -n "${PARSE_API_KEY}"

      - name: Run focused bridge tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest -q tests/test_sportybet_parse_bridge.py

      - name: Capture today's exact target events and full market responses
        id: probe
        continue-on-error: true
        run: |
          python scripts/sportybet_parse_bridge.py probe \
            --targets artifacts/research-protocols/saturday-2026-08-22-sportybet-20-targets-v1.json \
            --output-dir "${OUTPUT_DIR}" \
            --delay-seconds 13 \
            --max-pages 8

      - name: Upload exact probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saturday-2026-08-22-sportybet-parse-probe
          path: .cache/athena-research/sportybet-parse-bridge/probe
          if-no-files-found: error
          retention-days: 7

      - name: Require all 20 fixtures to resolve exactly
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          echo "probe outcome: ${PROBE_OUTCOME}"
          test "${PROBE_OUTCOME}" = "success"
