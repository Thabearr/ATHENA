name: ATHENA Canonical Run

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: One through seven Lagos dates or relative day tokens
        required: true
        default: today
        type: string
      target_legs:
        description: Maximum desired selected-leg count (1 through 50)
        required: true
        default: "20"
        type: string
      target_total_odds:
        description: Separate optional objective; currently fails closed when supplied
        required: false
        default: ""
        type: string
      bookie:
        description: Reviewed delivery adapter
        required: true
        default: sportybet
        type: choice
        options:
          - sportybet
      profile:
        description: Explicit authority profile
        required: true
        default: main
        type: choice
        options:
          - main
          - shadow
      create_share_code:
        description: Explicit external share-code delivery intent
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'shadow' && 'current-shadow-all-market' || 'athena-run-main' }}
  cancel-in-progress: false

jobs:
  canonical-run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact requested commit
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Require exact main lineage
        id: verify_lineage
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF}" = "refs/heads/main"

      - name: Resolve and persist canonical request once
        id: resolve_request
        if: success()
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUT_DAYS: ${{ inputs.days }}
          INPUT_TARGET_LEGS: ${{ inputs.target_legs }}
          INPUT_TARGET_TOTAL_ODDS: ${{ inputs.target_total_odds }}
          INPUT_BOOKIE: ${{ inputs.bookie }}
          INPUT_PROFILE: ${{ inputs.profile }}
          INPUT_CREATE_SHARE_CODE: ${{ inputs.create_share_code }}
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: python -m scripts.resolve_athena_run_workflow_request --output-root artifacts/athena-run-workflow

      - name: Set up Python 3.12
        id: setup_python
        if: success()
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        id: install_dependencies
        if: success()
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore verified canonical artifact roles with historical compatibility
        id: restore_artifact_roles
        if: success() && steps.resolve_request.outputs.authority_profile == 'SHADOW'
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: python -m scripts.restore_athena_artifact_roles --restore-inputs

      - name: Resolve exact lineage main
        id: bind_lineage_main
        if: success() && steps.resolve_request.outputs.authority_profile == 'SHADOW'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          lineage_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "${#lineage_main_sha}" -eq 40
          [[ "${lineage_main_sha}" =~ ^[0-9a-f]{40}$ ]]
          printf 'ATHENA_EXPECTED_LINEAGE_MAIN_SHA=%s\n' "${lineage_main_sha}" >> "${GITHUB_ENV}"

      - name: Execute canonical request and capture exit code
        id: execute_request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ATHENA_PR119_BOOTSTRAP_PATH: .cache/athena-research/pr119-bootstrap/pr119-materialized.ndjson
          ATHENA_CURRENT_SHADOW_HISTORY_CACHE_DIR: .cache/athena-research/current-shadow-history-github-binary-cache-v1
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          set +e
          python -m scripts.execute_athena_run_workflow \
            --request artifacts/athena-run-workflow/resolved-run-request.json \
            --output-root artifacts/athena-runs \
            --expected-git-sha "${GITHUB_SHA}" \
            --expected-git-ref "${GITHUB_REF}"
          execution_exit_code=$?
          printf 'exit_code=%s\n' "${execution_exit_code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Preserve optional Shadow source and identity evidence
        id: preserve_shadow_evidence
        if: always() && steps.resolve_request.outputs.authority_profile == 'SHADOW'
        shell: bash
        run: |
          evidence_root='artifacts/athena-run-workflow/source-evidence'
          for source_dir in \
            '.cache/athena-research/current-shadow-sportybet-catalog-fanout' \
            '.cache/athena-research/current-shadow-sportybet-upcoming-discovery' \
            '.cache/athena-research/current-shadow-sportybet-pc-upcoming-discovery' \
            '.cache/athena-research/sportybet-live-event-quote-evidence' \
            '.cache/athena-research/fotmob-data-matches-captures'
          do
            if [ -d "${source_dir}" ]; then
              mkdir -p "${evidence_root}"
              cp -a "${source_dir}" "${evidence_root}/"
            fi
          done

          identity_path="${ATHENA_CURRENT_SHADOW_IDENTITY_STATE_PATH:-}"
          if [ -n "${identity_path}" ] && [ -f "${identity_path}" ]; then
            identity_root='artifacts/athena-run-workflow/identity-state'
            mkdir -p "${identity_root}"
            cp "${identity_path}" "${identity_root}/"
          fi

      - name: Generate verified canonical artifact role manifest
        id: build_artifact_roles
        if: always()
        env:
          ATHENA_EXECUTION_EXIT_CODE: ${{ steps.execute_request.outputs.exit_code }}
          ATHENA_PRESERVATION_RESULT: ${{ steps.preserve_shadow_evidence.outcome }}
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: python -m scripts.build_athena_artifact_role_manifest

      - name: Upload durable canonical run evidence
        id: upload_evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athena-run-${{ github.run_id }}
          path: |
            artifacts/athena-run-workflow
            artifacts/athena-runs
          if-no-files-found: warn
          retention-days: 30

      - name: Propagate control-plane failure after evidence upload
        id: propagate_failure
        if: always()
        env:
          CHECKOUT_RESULT: ${{ steps.checkout.outcome }}
          LINEAGE_RESULT: ${{ steps.verify_lineage.outcome }}
          RESOLUTION_RESULT: ${{ steps.resolve_request.outcome }}
          PYTHON_RESULT: ${{ steps.setup_python.outcome }}
          INSTALL_RESULT: ${{ steps.install_dependencies.outcome }}
          ARTIFACT_ROLES_RESULT: ${{ steps.restore_artifact_roles.outcome }}
          ROLE_MANIFEST_RESULT: ${{ steps.build_artifact_roles.outcome }}
          MAIN_LINEAGE_RESULT: ${{ steps.bind_lineage_main.outcome }}
          EXECUTION_RESULT: ${{ steps.execute_request.outcome }}
          PRESERVATION_RESULT: ${{ steps.preserve_shadow_evidence.outcome }}
          UPLOAD_RESULT: ${{ steps.upload_evidence.outcome }}
          EXECUTION_EXIT_CODE: ${{ steps.execute_request.outputs.exit_code }}
        shell: bash
        run: |
          for result in \
            "${CHECKOUT_RESULT}" "${LINEAGE_RESULT}" "${RESOLUTION_RESULT}" \
            "${PYTHON_RESULT}" "${INSTALL_RESULT}" "${ARTIFACT_ROLES_RESULT}" \
            "${ROLE_MANIFEST_RESULT}" "${MAIN_LINEAGE_RESULT}" \
            "${EXECUTION_RESULT}" "${PRESERVATION_RESULT}" "${UPLOAD_RESULT}"
          do
            if [ "${result}" = "failure" ] || [ "${result}" = "cancelled" ]; then
              echo "An ATHENA run control-plane step failed: ${result}."
              exit 1
            fi
          done
          if [ -n "${EXECUTION_EXIT_CODE}" ] && [ "${EXECUTION_EXIT_CODE}" != "0" ]; then
            echo "Canonical workflow transport failed with exit code ${EXECUTION_EXIT_CODE}."
            exit 1
          fi
